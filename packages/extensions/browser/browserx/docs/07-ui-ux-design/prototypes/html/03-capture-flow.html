<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Capture Flow · BrowserX</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      :root {
        --bg: #12090a;
        --surface: #1a0d0e;
        --border: #331416;
        --accent: #d71921;
        --accent2: #ffd700;
        --text: #f0e6e6;
        --muted: #6f5a5f;
        --danger: #ff4757;
      }
      body {
        width: 320px;
        min-height: 220px;
        font-family: 'DM Mono', monospace;
        background: var(--bg);
        color: var(--text);
      }
      .theme-switcher {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 60;
        display: flex;
        gap: 0.25rem;
        padding: 0.25rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      .theme-switcher button {
        font: inherit;
        font-size: 12px;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        border: 0;
        background: transparent;
        color: var(--text);
        opacity: 0.65;
        cursor: pointer;
      }
      .theme-switcher button[aria-pressed='true'] {
        background: var(--border);
        opacity: 1;
      }
    </style>
  </head>
  <body class="p-3">
    <div class="card bg-[var(--surface)] border border-[var(--border)]">
      <div class="card-body">
        <h2 class="card-title text-sm">Capture</h2>
        <div class="flex flex-col gap-2">
          <button class="btn btn-error btn-sm" disabled>
            Current View (busy)
          </button>
          <button class="btn btn-outline btn-sm" disabled>Full Page</button>
        </div>
        <div class="mt-2 text-xs space-y-1">
          <div
            class="alert alert-info bg-[var(--border)] border-0 text-[var(--text)] py-2"
          >
            <span>Stitching chunks...</span>
          </div>
          <div>
            <span class="font-medium">Status:</span> SNAP_GET_LAYOUT → scrolling
            → stitching
          </div>
          <div><span class="font-medium">Last:</span> example.com/fullpage</div>
        </div>
      </div>
    </div>
    <div class="theme-switcher">
      <button id="theme-light">Light</button
      ><button id="theme-dark" aria-pressed="true">Dark</button>
    </div>
    <script>
      const root = document.documentElement,
        light = document.getElementById('theme-light'),
        dark = document.getElementById('theme-dark');
      const apply = (t) => {
        root.setAttribute('data-theme', t);
        light.setAttribute('aria-pressed', String(t === 'light'));
        dark.setAttribute('aria-pressed', String(t === 'dark'));
      };
      light.onclick = () => apply('light');
      dark.onclick = () => apply('dark');
      apply('dark');
    </script>
  </body>
</html>
