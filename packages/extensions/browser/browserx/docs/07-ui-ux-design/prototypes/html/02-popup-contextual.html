<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Popup Contextual · BrowserX</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      :root {
        --bg: #12090a;
        --surface: #1a0d0e;
        --border: #331416;
        --accent: #d71921;
        --accent2: #ffd700;
        --text: #f0e6e6;
        --muted: #6f5a5f;
      }
      body {
        width: 320px;
        min-height: 420px;
        font-family: 'DM Mono', monospace;
        background: var(--bg);
        color: var(--text);
      }
      .brand-name {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 28px;
        letter-spacing: 0.1em;
        color: var(--accent);
      }
      .tab-btn {
        color: var(--muted);
        border-bottom: 2px solid transparent;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .tab-btn.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
      .theme-switcher {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 60;
        display: flex;
        gap: 0.25rem;
        padding: 0.25rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      .theme-switcher button {
        font: inherit;
        font-size: 12px;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        border: 0;
        background: transparent;
        color: var(--text);
        opacity: 0.65;
        cursor: pointer;
      }
      .theme-switcher button[aria-pressed='true'] {
        background: var(--border);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="p-4 border-b border-[var(--border)]">
      <div class="brand-name">tab-x</div>
      <div class="text-[10px] text-[var(--muted)] mt-1">instagram.com</div>
    </div>
    <div
      role="tablist"
      class="tabs tabs-boxed bg-[var(--surface)] justify-start flex-nowrap overflow-x-auto"
    >
      <button class="tab tab-btn" data-tab="ads">Ads</button>
      <button class="tab tab-btn" data-tab="backtotop">BackToTop</button>
      <button class="tab tab-btn" data-tab="block">Block</button>
      <button class="tab tab-btn" data-tab="chess">Chess</button>
      <button class="tab tab-btn" data-tab="claude">Claude</button>
      <button class="tab tab-btn" data-tab="github">GitHub</button>
      <button class="tab tab-btn active" data-tab="insta">Insta</button>
      <button class="tab tab-btn" data-tab="newtab">New Tab</button>
      <button class="tab tab-btn" data-tab="shopify">Shopify</button>
      <button class="tab tab-btn" data-tab="snap">Snap</button>
      <button class="tab tab-btn" data-tab="sound">Sound</button>
    </div>
    <div class="p-4 space-y-3">
      <div id="tab-ads" class="tab-content">
        <label class="label cursor-pointer"
          ><span class="label-text">Block ads</span
          ><input type="checkbox" class="toggle toggle-error" checked
        /></label>
      </div>
      <div id="tab-backtotop" class="tab-content">
        <label class="label cursor-pointer"
          ><span class="label-text">Show Back to Top</span
          ><input type="checkbox" class="toggle toggle-error" checked
        /></label>
      </div>
      <div id="tab-block" class="tab-content">
        <label class="label cursor-pointer"
          ><span class="label-text">Block distracting sites</span
          ><input type="checkbox" class="toggle toggle-error" checked
        /></label>
      </div>
      <div id="tab-chess" class="tab-content">
        <label class="label cursor-pointer"
          ><span class="label-text">Hide distractions on Chess.com</span
          ><input type="checkbox" class="toggle toggle-error" checked
        /></label>
      </div>
      <div id="tab-claude" class="tab-content">
        <label class="label cursor-pointer"
          ><span class="label-text">Show Claude API usage</span
          ><input type="checkbox" class="toggle toggle-error" checked
        /></label>
      </div>
      <div id="tab-github" class="tab-content">
        <label class="label cursor-pointer"
          ><span class="label-text">Open external links in new tab</span
          ><input type="checkbox" class="toggle toggle-error" checked
        /></label>
      </div>
      <div id="tab-insta" class="tab-content active">
        <label class="label cursor-pointer"
          ><span class="label-text"
            >Shift + right-click to open carousel images</span
          ><input type="checkbox" class="toggle toggle-error" checked
        /></label>
        <div class="text-xs mt-2 opacity-70">
          On instagram.com, Shift + right-click opens all post images in new
          tabs.
        </div>
      </div>
      <div id="tab-newtab" class="tab-content">
        <label class="label cursor-pointer"
          ><span class="label-text">Redirect new tabs</span
          ><input type="checkbox" class="toggle toggle-error" checked /></label
        ><input
          type="text"
          class="input input-bordered input-sm w-full mt-2"
          value="https://hieudoanm.github.io"
        />
      </div>
      <div id="tab-shopify" class="tab-content">
        <div class="space-y-2">
          <div class="badge badge-success">Shopify detected</div>
          <div class="badge badge-info">Shopify Plus</div>
          <button class="btn btn-sm btn-outline w-full">Check Shopify</button>
        </div>
      </div>
      <div id="tab-snap" class="tab-content">
        <div class="flex flex-col gap-2">
          <button class="btn btn-error btn-sm">Current View</button
          ><button class="btn btn-outline btn-sm">Full Page</button>
        </div>
      </div>
      <div id="tab-sound" class="tab-content">
        <div class="text-xs mb-1">2 playing</div>
        <div class="space-y-1">
          <div class="flex justify-between items-center">
            <span class="text-xs truncate">♪ YouTube</span
            ><button class="btn btn-xs btn-outline">Mute</button>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-xs truncate">♪ Spotify</span
            ><button class="btn btn-xs btn-outline">Mute</button>
          </div>
        </div>
      </div>
    </div>
    <div class="theme-switcher">
      <button id="theme-light">Light</button
      ><button id="theme-dark" aria-pressed="true">Dark</button>
    </div>
    <script>
      const root = document.documentElement,
        light = document.getElementById('theme-light'),
        dark = document.getElementById('theme-dark');
      const apply = (t) => {
        root.setAttribute('data-theme', t);
        light.setAttribute('aria-pressed', String(t === 'light'));
        dark.setAttribute('aria-pressed', String(t === 'dark'));
      };
      light.onclick = () => apply('light');
      dark.onclick = () => apply('dark');
      apply('dark');
      document.querySelectorAll('.tab-btn').forEach((tab) => {
        tab.onclick = () => {
          document
            .querySelectorAll('.tab-btn')
            .forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          document
            .querySelectorAll('.tab-content')
            .forEach((c) => c.classList.remove('active'));
          const el = document.getElementById('tab-' + tab.dataset.tab);
          if (el) el.classList.add('active');
        };
      });
    </script>
  </body>
</html>
