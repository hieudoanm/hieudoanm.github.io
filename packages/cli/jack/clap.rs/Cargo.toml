[package]
name = "jack"
version = "0.0.1"
description = "A personal CLI toolbox"
authors = ["hieudoanm <hieumdoan@gmail.com> (https://hieudoanm.github.io)"]
license = "GPL-3.0"
repository = "git+ssh://git@github.com/hieudoanm/hieudoanm.github.io.git"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "jack"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.5", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["full"] }
reqwest = { version = "=0.13.4", features = ["json", "blocking"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
csv = "=1.4.0"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
md-5 = "=0.11.0"
anyhow = "=1.0.104"
image = "=0.25.10"
thiserror = "=2.0.19"
colored = "=3.1.1"
chrono = { version = "=0.4.45", features = ["serde"] }
regex = "=1.13.1"
rand = "=0.10.2"
uuid = { version = "=1.24.0", features = ["v1", "v4", "v7"] }
qrcode = "=0.14.1"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
base64 = "=0.23.0"
url = "=2.5.8"
log = "=0.4.33"
env_logger = "=0.11.11"
dirs = "=6.0.0"
deunicode = "=1.6.2"
html-escape = "=0.2.15"
scraper = "=0.27.0"
quick-xml = { version = "=0.41.0", features = ["serialize"] }
lazy_static = "=1.5.0"
once_cell = "=1.21.4"
walkdir = "=2.5.0"
sysinfo = "=0.39.6"
ratatui = { version = "=0.30.2", features = ["unstable"] }
crossterm = "=0.29.0"
