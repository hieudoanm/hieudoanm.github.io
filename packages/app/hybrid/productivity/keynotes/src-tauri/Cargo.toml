[package]
name = "keynotes"
version = "0.1.0"
description = "Keynotes — presentation editor desktop app"
authors = ["hieudoanm"]
edition = "2021"

[lib]
name = "keynotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
