<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>A resume builder that exports</title>
  <desc>A free resume builder with 64 templates, live preview and PDF export.</desc>
  <defs>
    <linearGradient id="og-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbf7" />
      <stop offset="1" stop-color="#fffefe" />
    </linearGradient>
    <radialGradient id="og-glow" cx="0.88" cy="0.04" r="0.58">
      <stop offset="0" stop-color="#676447" stop-opacity="0.17" />
      <stop offset="1" stop-color="#676447" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f" />
      <stop offset="1" stop-color="#1a3151" />
    </linearGradient>
    <filter id="og-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#og-base)" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#og-glow)" />
  <rect x="0" y="0" width="12" height="630" fill="url(#og-accent)" />

  <g>
    <rect x="96" y="84" width="56" height="56" rx="16" fill="url(#og-accent)" />
    <text x="124" y="121" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">RE</text>
    <text x="172" y="121" font-size="26" font-weight="600" fill="#181d25">Resume</text>
    <text x="1104" y="119" text-anchor="end" font-size="22" fill="#676e74">hieudoanm.github.io</text>
  </g>
  <line x1="96" y1="176" x2="1104" y2="176" stroke="#abadaf" stroke-width="2" />

  <g font-size="17" font-weight="700" letter-spacing="0.16em" fill="#1e3a5f">
    <text x="96" y="283">64 TEMPLATES, ONE EXPORT</text>
  </g>
  <g font-size="58" font-weight="800" fill="#181d25" letter-spacing="-0.022em">
  <text x="96" y="358">A resume builder that</text>
  <text x="96" y="420">exports</text>
  </g>
  <g font-size="25" fill="#676e74">
  <text x="96" y="472">A free resume builder with 64 templates, live</text>
  <text x="96" y="507">preview and PDF export.</text>
  </g>

  <g>
    <rect x="748" y="202" width="356" height="382" rx="24" fill="#e2e4e5" stroke="#c1c3c3" stroke-width="1.5" filter="url(#og-shadow)" />
    <rect x="778" y="262" width="84" height="84" rx="24" fill="url(#og-accent)" />
    <text x="820" y="319" text-anchor="middle" font-size="42" font-weight="800" fill="#ffffff">RE</text>
    <rect x="778" y="372" width="174" height="44" rx="22" fill="#fdfbf7" />
    <circle cx="798" cy="394" r="4" fill="#1e3a5f" />
    <text x="818" y="401" font-size="19" font-weight="500" fill="#181d25">64 templates</text>
    <rect x="778" y="426" width="181" height="44" rx="22" fill="#fdfbf7" />
    <circle cx="798" cy="448" r="4" fill="#1e3a5f" />
    <text x="818" y="455" font-size="19" font-weight="500" fill="#181d25">Live preview</text>
    <rect x="778" y="480" width="163" height="44" rx="22" fill="#fdfbf7" />
    <circle cx="798" cy="502" r="4" fill="#1e3a5f" />
    <text x="818" y="509" font-size="19" font-weight="500" fill="#181d25">PDF export</text>
