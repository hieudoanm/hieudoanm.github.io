[package]
name = "store"
version = "0.0.1"
description = "Store"
authors = ["hieudoanm"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-shell = "=2.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
