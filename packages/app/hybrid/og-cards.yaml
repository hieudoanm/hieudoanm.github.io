# Social cards for the hybrid apps, rendered by landify's card pipeline into
# each app's public/og/. One entry per app that has a public/ dir.
#
# Regenerate with:
#   cd packages/app/headless/landify/languages/go
#   go run ./cmd/ogcard ../../../../hybrid/og-cards.yaml ../../../../hybrid
#   cd ../../../../hybrid && for d in */*/public/og; do rsvg-convert -o "$d/og.png" "$d/og.svg"; done
#
# name and description come from the app's own metadata export in
# src/app/layout.tsx; theme comes from the light daisyUI theme its layout names
# with data-theme; kicker and tags describe what the app actually does. url is
# the app's public address, as listed in packages/app/hybrid/README.md.

- app: education/lingo
  url: 'https://hieudoanm.github.io/open/lingo/'
  name: Lingo
  kicker: '12 subjects, 275 pages'
  title: 'Learn by playing'
  description: 'Vocabulary, economics, neuroscience, maths and engineering with calculators, visualisers and quizzes.'
  tags:
    [
      '12 subjects',
      '275 interactive pages',
      'Vocabulary & sign',
      'Quizzes & labs',
    ]
  theme:
    base: '#ffffff'
    content: '#4b4b4b'
    primary: '#58cc02'
    secondary: '#1cb0f6'
    info: '#1cb0f6'
    warning: '#ffc800'
    success: '#58cc02'
    error: '#ff4b4b'

- app: utilities/docs
  url: 'https://hieudoanm.github.io/open/docs/'
  name: Hieu Doan
  kicker: 'Notes and small tools'
  title: 'A start page that works'
  description: 'A start page with a calculator, clocks, data converters, developer utilities and a writing space.'
  tags: ['Calculator', 'Clocks & timers', 'Data converters', 'Developer tools']
  theme:
    base: '#000000'
    content: '#f5f5f5'
    primary: '#ff0030'
    secondary: '#f5f5f5'
    info: '#4da3ff'
    warning: '#ffb000'
    success: '#00c853'
    error: '#ff0030'
