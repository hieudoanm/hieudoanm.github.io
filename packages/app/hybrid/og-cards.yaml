# Social cards for the hybrid apps, rendered by landify's card pipeline into
# each app's public/og/. One entry per app that has a public/ dir.
#
# Regenerate with:
#   cd packages/app/headless/landify/languages/go
#   go run ./cmd/ogcard ../../../../hybrid/og-cards.yaml ../../../../hybrid
#   cd ../../../../hybrid && for d in */*/public/og; do rsvg-convert -o "$d/og.png" "$d/og.svg"; done
#
# name and description come from the app's own metadata export in
# src/app/layout.tsx; theme comes from the light daisyUI theme its layout names
# with data-theme; kicker and tags describe what the app actually does. url is
# the app's public address, as listed in packages/app/hybrid/README.md.
