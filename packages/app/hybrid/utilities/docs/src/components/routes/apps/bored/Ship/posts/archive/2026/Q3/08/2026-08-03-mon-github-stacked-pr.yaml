timeline:
  title: 'From Preview to Public'
  entries:
    - date: 'Apr 13, 2026'
      event: 'Private preview opens, waitlist required'
    - date: 'Jul 30, 2026'
      event: 'Public preview — no waitlist, rolling out to all repos'
    - date: 'Coming weeks'
      event: 'Merge queue support rolls out progressively'
  imageUrl: ''
