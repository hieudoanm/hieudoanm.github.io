# Slide 7 (Checklist) — Counterarguments / Limitations
checklist:
  title: 'Before You Adopt It'
  text: 'Stacked PRs are still public preview, not GA. Know this first:'
  items:
    - 'Merge queue support for stacks is still rolling out'
    - 'Squash-merge repos need "gh stack rebase" after each merge, or tracking
      breaks'
    - 'Practitioners suggest capping a stack around 3–4 PRs'
    - 'Graphite still leads on VS Code integration and a dedicated review UI'
  citation: 'InfoQ, ByteIota, 2026'

---
# Slide 8 (Cheat Sheet) — Conclusion & Key Takeaways
cheat-sheet:
  title: 'Stacked PRs Cheat Sheet'
  subject: 'GitHub'
  items:
    - label: 'Install'
      content: 'gh extension install github/gh-stack'
    - label: 'Structure'
      content: 'Each PR targets the branch below it'
    - label: 'Review'
      content: 'One layer at a time, in parallel'
    - label: 'Merge'
      content: 'One click lands the whole stack'
    - label: 'Agents'
      content: 'Copilot builds stacks via the gh-stack skill'
  citation: ''

