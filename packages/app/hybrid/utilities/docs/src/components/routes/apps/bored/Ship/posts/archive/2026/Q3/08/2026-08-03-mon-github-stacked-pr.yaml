# Slide 5 (Feature Grid) — Evidence 2: What You Get
feature-grid:
  title: 'What Stacked PRs Give You'
  features:
    - label: 'Stack Map'
      desc: 'Built into the PR header — jump between layers instantly'
    - label: 'Focused Diffs'
      desc: 'Each PR shows only its own layer, not the ones below it'
    - label: 'Parallel Review'
      desc: 'Teammates review different layers at the same time'
    - label: 'One-Click Merge'
      desc: 'Land the whole stack, or just the lower layers'
  citation: 'GitHub Changelog, 2026'

