# Post 5 (Checklist)
checklist:
  title: 'Trait 3: Mastery Over Time'
  text: Long-term commitment beats novelty-chasing.
  items:
    - Sustained engagement builds skill
    - Mentoring others deepens satisfaction
    - Immersion improves quality of life
  citation: Cleary et al., 2025

---
# Post 6 (Bullet List)
bullet-list:
  title: 'Trait 4: Social Connection'
  items:
    - Bonus, not required
    - Hobby groups reduce loneliness
    - Provides social support
    - Solo hobbies still count
  citation: Nature Medicine, 2023

