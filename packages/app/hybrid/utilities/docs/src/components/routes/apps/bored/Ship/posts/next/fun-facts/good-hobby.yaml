# Post 7 (Icon + Text)
icon-text:
  icon: 🏃
  title: 'Trait 5: Physical Activity'
  text:
    Bonus, not required. Physical-sports hobbies boost self-acceptance, positive
    relationships, and sense of purpose. But non-physical hobbies still deliver
    most of the same wellbeing gains.
  citation: Ruiz-Ariza et al., 2019

