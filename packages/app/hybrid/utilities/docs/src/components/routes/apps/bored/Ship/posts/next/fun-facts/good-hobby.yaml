# Post 2 (Checklist)
checklist:
  title: The Short Answer
  text:
    It is not about being productive. Research on 93,000+ people points to what
    actually separates a hobby from ordinary leisure.
  items:
    - Active engagement, not passive consumption
    - Some skill-building or growth
    - Room to get better over time
    - Watching TV alone does not count
  citation: Nature Medicine, 2023

---
# Post 3 (Checklist)
checklist:
  title: 'Trait 1: Creativity'
  text: Good hobbies involve generating something, not just consuming.
  items:
    - Imagination and novelty
    - Self-expression
    - Sensory engagement
    - Cognitive stimulation
  citation: Nature Medicine, 2023

---
