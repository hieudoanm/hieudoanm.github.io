  title: 'Keep It Effective'
  text: 'Over 60,000 repos have one. Most still get it wrong.'
  items:
    - 'Under 150 lines'
    - 'Hand-written, not AI-generated'
    - 'Real code examples, not descriptions'
    - 'Critical rules stated first'
    - 'Updated whenever the code changes'
