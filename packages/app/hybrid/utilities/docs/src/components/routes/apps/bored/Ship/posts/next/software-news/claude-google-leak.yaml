# Post 2 (Takeaway)
takeaway:
  title: Anyone Could Search Your Chats
  text:
    Hundreds of shared Claude conversations and artifacts were indexed by Google
    in July 2026. No hacking required — just a search bar.
  source: 404 Media, 2026
  citation: (404 Media, 2026)

---
# Post 3 (Icon + Text)
icon-text:
  icon: 🔓
  title: Share Was Never Meant to Mean Public
  text:
    Claude's share link was built to send a chat to one person, not to publish
    it to the open web.
  citation: ''

