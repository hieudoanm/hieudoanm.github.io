# Post 5 (Step by Step)
step-by-step:
  title: Why It Happened
  text: A gap between blocking crawlers and blocking indexing.
  steps:
    - label: Users posted share links on forums and social media
    - label: Pages had no noindex tag, only a robots.txt block
    - label: Google indexed pages it found linked elsewhere on the web
  citation: (Fortune, 2026)

---
# Post 6 (Checklist)
checklist:
  title: What Got Exposed
  text: The indexed pages went far beyond casual conversations.
  items:
    - Crypto wallet keys
    - Personal names and addresses
    - API keys and resumes
    - Internal company documents
    - Work notes and private messages
  citation: (Fortune, 2026)

