# Post 3 (Minimal)
minimal:
  title: 'Why It Matters'
  text:
    "Brain activity happens in milliseconds, but most brain-imaging tools are
    slow or invasive. EEG is different: it's non-invasive, portable, and
    captures changes as they happen. That combination makes it the tool of
    choice for diagnosing epilepsy, staging sleep, monitoring anesthesia depth,
    and building brain-computer interfaces where timing matters more than exact
    location."
  imageUrl: ''
  citation: ''

