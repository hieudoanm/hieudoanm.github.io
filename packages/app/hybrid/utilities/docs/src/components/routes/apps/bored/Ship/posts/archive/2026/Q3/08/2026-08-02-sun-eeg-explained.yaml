# Post 4 (Architecture Diagram)
architecture-diagram:
  title: 'Inside an EEG System'
  components:
    - name: 'Scalp Electrodes'
      desc: 'Up to 256 sensors detect tiny voltage changes'
    - name: 'Amplifier'
      desc: 'Boosts microvolt signals thousands of times'
    - name: 'Digitizer'
      desc: 'Converts the analog signal into digital data'
    - name: 'Computer'
      desc: 'Plots the signal as waveforms in real time'
  connections:
    - from: 'Scalp Electrodes'
      to: 'Amplifier'
      label: 'sends raw signal'
    - from: 'Amplifier'
      to: 'Digitizer'
      label: 'boosts & filters'
    - from: 'Digitizer'
      to: 'Computer'
      label: 'streams data'
  citation: 'Zanoaga et al., 2018'

