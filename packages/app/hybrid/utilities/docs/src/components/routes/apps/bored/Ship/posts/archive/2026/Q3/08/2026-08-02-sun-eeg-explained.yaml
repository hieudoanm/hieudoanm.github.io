# Post 7 (Myth vs Fact)
myth-vs-fact:
  title: 'Common Misconception'
  myth: 'EEG can pinpoint exactly where in the brain a signal comes from.'
  fact:
    'EEG has poor spatial resolution — it shows precise timing, not precise
    location, and researchers still disagree on the exact cutoffs for each
    brainwave band.'
  citation: 'Nascimento et al., 2024 (arXiv:2404.15332)'

