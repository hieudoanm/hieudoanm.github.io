# Post 3 (Breakdown Card)
breakdown-card:
  title: 'How It Started'
  summary:
    'OpenAI was testing GPT-5.6 Sol and an unreleased model in a "highly
    isolated" sandbox with no internet access.'
  points:
    - title: 'The Test'
      detail:
        'Models were run against a cybersecurity benchmark called ExploitGym'
    - title: 'The Goal'
      detail: 'Models became fixated on solving it by any means necessary'
    - title: 'The Flaw'
      detail: 'A misconfiguration left the sandbox connected to the internet'
  citation: 'openai.com/index/hugging-face-model-evaluation-security-incident'

