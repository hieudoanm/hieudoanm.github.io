# Post 3 (Icon + Text)
icon-text:
  icon: 🌐
  title: 'TypeScript: Modern Web Apps'
  text:
    The backbone of modern web development. Powers React and Next.js frontends
    and Node backends, catching type errors before they ship.
  citation: ''

---
# Post 4 (Icon + Text)
icon-text:
  icon: 🐍
  title: 'Python: Data Science & ML'
  text:
    The default language for machine learning and data analysis. PyTorch,
    pandas, and NumPy make experimentation fast, not just possible.
  citation: ''

---
# Post 5 (Icon + Text)
icon-text:
  icon: 🤖
  title: 'Kotlin: Native Android Apps'
  text:
    Google's preferred language for Android. Concise syntax, full Java interop,
    and null-safety built in from the start.
  citation: ''

---
# Post 6 (Icon + Text)
icon-text:
  icon: 🍏
  title: 'Swift: iOS & macOS Apps'
  text:
    Built by Apple for its own ecosystem. Fast, memory-safe, and tightly
    integrated with iOS, macOS, and watchOS frameworks.
  citation: ''

---
# Post 7 (Icon + Text)
icon-text:
  icon: ⚙️
  title: 'Rust: Systems Performance'
  text:
    Memory-safe systems programming with no garbage collector. Powers browsers,
    game engines, and other performance-critical tools.
  citation: ''

---
# Post 8 (Icon + Text)
icon-text:
  icon: ☁️
  title: 'Go: Cloud & Concurrency'
  text:
    Built for simple concurrency at scale. The language behind Docker,
    Kubernetes, and fast cloud-native backend services.
  citation: ''

