# Post 6 (Checklist)
checklist:
  title: Where It's Used
  text: Structural maps are already reshaping neuroscience.
  items:
    - Linking brain wiring to behavior and disease
    - Planning safer brain surgery
    - Inspiring AI and neuromorphic chip design
    - Tracking connectivity changes in psychiatric disorders
  citation: ''

---
# Post 7 (Myth vs Fact)
myth-vs-fact:
  title: A Common Misconception
  myth: A complete connectome will fully explain how the brain works.
  fact:
    A wiring diagram shows structure, not signal strength or activity over time
    — it's a map, not the whole story.
  citation: ''

