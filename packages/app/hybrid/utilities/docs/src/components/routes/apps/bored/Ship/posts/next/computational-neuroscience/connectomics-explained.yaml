# Post 2 (Icon + Text)
icon-text:
  icon: 🧠
  title: A Circuit Diagram for the Brain
  text:
    Connectomics is the science of mapping a complete "connectome" — every
    neuron and every connection between them.
  citation: ''

---
# Post 3 (Bullet List)
bullet-list:
  title: Why It Matters
  items:
    - Knowing where neurons are isn't enough
    - Behavior comes from how they're wired together
    - A wiring diagram lets scientists trace circuits, not just cells
    - It's the closest thing to a brain's "source code"
  citation: ''

---
# Post 4 (Timeline)
timeline:
  title: Key Milestones
  entries:
    - date: '1986'
      event: 'First complete connectome: a 302-neuron worm, mapped by hand'
    - date: '2011'
      event: Human Connectome Project launched
    - date: '2024'
      event: Full adult fruit fly brain connectome completed
    - date: '2025'
      event: Connectomics named Nature's Method of the Year
  imageUrl: ''
