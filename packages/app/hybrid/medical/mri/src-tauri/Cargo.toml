[package]
name = "mri"
version = "0.1.0"
description = "Local workbench for the post-stroke aphasia prediction pipeline"
authors = ["hieudoanm <hieumdoan@gmail.com> (https://hieudoanm.github.io)"]
license = "GPL-3.0"
repository = "git@github.com:hieudoanm/hieudoanm.github.io.git"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
log = "=0.4.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = "=0.9.34"
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-log = "=2.10.0"
thiserror = "=2.0.21"

[dev-dependencies]
tempfile = "=3.27.0"