[package]
name = "mri"
version = "0.0.1"
description = "MRI research workspace and orchestration layer"
authors = ["hieudoanm <hieumdoan@gmail.com> (https://hieudoanm.github.io)"]
license = "GPL-3.0"
repository = "git+ssh://git@github.com/hieudoanm/hieudoanm.github.io.git"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.23.1"
dicom-object = "=0.10.0"
dicom-core = "=0.10.0"
dicom-dictionary-std = "=0.10.0"
dicom-transfer-syntax-registry = "=0.10.0"
log = "=0.4.33"
nifti = "=0.17.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-log = "=2.9.0"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-updater = "=2.10.1"
uuid = { version = "=1.25.0", features = ["v4"] }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls", "gzip"] }
