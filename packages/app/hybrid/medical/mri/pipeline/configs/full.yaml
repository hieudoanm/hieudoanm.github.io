# Full configuration for the MRI pipeline
# This is the configuration for production runs

schema_version: '0.1.0'

data:
  dataset: arc
  data_path: 'data/'
  participants_tsv: null
  lesion_mask_path: null
  t1_path: null

split:
  n_folds: 4
  lock_box_fraction: 0.2
  seed: 42
  stratify_by: 'wab_aq'

model:
  model_type: resnet18
  image_type: hybrid
  learning_rate: 0.001
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 10
  class_weight: true
  calibration: true

run:
  run_id: null
  output_dir: 'runs/'
  device: auto
  log_level: 'INFO'
  cache_stages: true
