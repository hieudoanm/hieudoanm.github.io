# Full configuration for the MRI pipeline
# This is the configuration for production runs

schema_version: '0.1.0'

data:
  dataset: arc
  data_path: 'data/'
  # Required by `pipeline run`: a BIDS-style participants table, one row per
  # participant. A table with several sessions per participant is refused, so a
  # person can never appear in two folds.
  participants_tsv: null
  lesion_mask_path: null
  t1_path: null
  # The outcome is binarised at this threshold. It is a modelling decision, not a
  # fact about the data: it is recorded in docs/protocol.md once it is justified.
  outcome_column: 'wab_aq'
  outcome_threshold: 50.0
  # Tabular inputs. An empty list is refused at run time, so a full sweep needs
  # the candidates named in ROADMAP section 5 checked against participants.tsv
  # first; see docs/protocol.md.
  features:
    - 'age_at_stroke'
    - 'sex'
    - 'wab_days'

split:
  n_folds: 4
  lock_box_fraction: 0.2
  seed: 42
  stratify_by: 'wab_aq'

model:
  # TODO(ROADMAP Phase 4): `resnet18` is a declared ModelType with no trainer
  # behind it, so a full run would fail when the model is built. A baseline that
  # exists today is used instead; switch back when Phase 4 lands.
  # `image_type` has no generator yet either (Phase 3) and is inert for now.
  model_type: logistic_regression
  image_type: hybrid
  learning_rate: 0.001
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 10
  class_weight: true
  calibration: true

run:
  run_id: null
  output_dir: 'runs/'
  device: auto
  log_level: 'INFO'
  cache_stages: true
