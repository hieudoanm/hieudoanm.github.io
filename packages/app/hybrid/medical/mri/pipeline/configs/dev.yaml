# Development configuration for the MRI pipeline
# This is a minimal configuration for local development and testing

schema_version: '0.1.0'

data:
  dataset: arc
  data_path: 'data/'
  # Required by `pipeline run`: a BIDS-style participants table, one row per
  # participant. A table with several sessions per participant is refused, so a
  # person can never appear in two folds. `pipeline data cohort` writes this one,
  # so `make demo` runs from a clean clone without the (non-redistributable) ARC
  # data; point it at the real table for a real run.
  participants_tsv: 'data/synthetic/participants.tsv'
  lesion_mask_path: null
  t1_path: null
  # The outcome is binarised at this threshold. It is a modelling decision, not a
  # fact about the data: record it in docs/protocol.md once it is justified.
  outcome_column: 'wab_aq'
  outcome_threshold: 50.0
  # participants.tsv columns used as model inputs. Must be non-empty for a run.
  features:
    - 'age_at_stroke'
    - 'sex'
    - 'wab_days'

split:
  n_folds: 2 # Smaller for faster iteration
  lock_box_fraction: 0.2
  seed: 42
  stratify_by: 'wab_aq'

model:
  model_type: logistic_regression
  image_type: stitched
  learning_rate: 0.001
  batch_size: 16 # Smaller for local testing
  max_epochs: 10 # Fewer epochs for quick iteration
  early_stopping_patience: 5
  class_weight: true
  calibration: true

run:
  run_id: null
  output_dir: 'runs/'
  device: auto
  log_level: 'DEBUG'
  cache_stages: true
