[project]
name = "pipeline"
version = "0.1.0"
description = "Predicting post-stroke aphasia outcome from lesion MRI plus clinical data"
readme = "README.md"
requires-python = "==3.14.8"
dependencies = [
    "typer==0.27.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "statsmodels==0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "pyright==1.1.414",
]

imaging = [
    "nibabel==5.4.2",
    "nilearn==0.14.1",
    "SimpleITK==2.5.6",
]

ml = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "timm==1.0.30",
    "xgboost==3.2.0",
]

stats = [
    "statsmodels==0.15.0",
]

explainability = [
    "captum==0.9.0",
]

data = [
    "openneuro-py==2026.9.1",
    "pybids==0.22.0",
]

tracking = [
    "mlflow==3.16.1",
]

storage = [
    "pyarrow==25.0.1",
    "duckdb==1.5.6",
]

all = [
    "pipeline[imaging,ml,stats,explainability,data,tracking,storage]",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
