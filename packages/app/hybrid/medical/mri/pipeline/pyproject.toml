[project]
name = "pipeline"
version = "0.1.0"
description = "Predicting post-stroke aphasia outcome from lesion MRI plus clinical data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

imaging = [
    "nibabel>=5.0.0",
    "nilearn>=0.10.0",
    "SimpleITK>=2.3.0",
]

ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "xgboost>=2.0.0",
]

stats = [
    "statsmodels>=0.14.0",
]

explainability = [
    "captum>=0.7.0",
]

data = [
    "openneuro-py>=0.7.0",
    "pybids>=0.16.0",
]

tracking = [
    "mlflow>=2.0.0",
]

storage = [
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
]

all = [
    "pipeline[imaging,ml,stats,explainability,data,tracking,storage]",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
