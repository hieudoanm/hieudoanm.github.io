[package]
name = "psychology"
version = "0.0.1"
description = "Psychology"
authors = ["hieudoanm <hieumdoan@gmail.com>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "psychology_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib",
]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
log = "0.4.29"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2.10.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
