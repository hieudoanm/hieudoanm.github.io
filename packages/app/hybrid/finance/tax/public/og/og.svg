<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Personal and business tax</title>
  <desc>Vietnamese tax management: a personal calculator, business submissions and an audit trail.</desc>
  <defs>
    <linearGradient id="og-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#fefeff" />
    </linearGradient>
    <radialGradient id="og-glow" cx="0.88" cy="0.04" r="0.58">
      <stop offset="0" stop-color="#62653c" stop-opacity="0.17" />
      <stop offset="1" stop-color="#62653c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="1" stop-color="#0d645e" />
    </linearGradient>
    <filter id="og-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#og-base)" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#og-glow)" />
  <rect x="0" y="0" width="12" height="630" fill="url(#og-accent)" />

  <g>
    <rect x="96" y="84" width="56" height="56" rx="16" fill="url(#og-accent)" />
    <text x="124" y="121" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">TA</text>
    <text x="172" y="121" font-size="26" font-weight="600" fill="#181d25">Tax</text>
    <text x="1104" y="119" text-anchor="end" font-size="22" fill="#686d7a">hieudoanm.github.io</text>
  </g>
  <line x1="96" y1="176" x2="1104" y2="176" stroke="#a9acb5" stroke-width="2" />

  <g font-size="17" font-weight="700" letter-spacing="0.16em" fill="#0f766e">
    <text x="96" y="266">VIETNAMESE TAX, SORTED</text>
  </g>
  <g font-size="58" font-weight="800" fill="#181d25" letter-spacing="-0.022em">
  <text x="96" y="341">Personal and</text>
  <text x="96" y="403">business tax</text>
  </g>
  <g font-size="25" fill="#686d7a">
  <text x="96" y="455">Vietnamese tax management: a personal</text>
  <text x="96" y="490">calculator, business submissions and an audit</text>
  <text x="96" y="525">trail.</text>
  </g>

  <g>
    <rect x="748" y="202" width="356" height="382" rx="24" fill="#dceaeb" stroke="#bec2c8" stroke-width="1.5" filter="url(#og-shadow)" />
    <rect x="778" y="262" width="84" height="84" rx="24" fill="url(#og-accent)" />
    <text x="820" y="319" text-anchor="middle" font-size="42" font-weight="800" fill="#ffffff">TA</text>
    <rect x="778" y="372" width="238" height="44" rx="22" fill="#f8fafc" />
    <circle cx="798" cy="394" r="4" fill="#0f766e" />
    <text x="818" y="401" font-size="19" font-weight="500" fill="#181d25">Personal calculator</text>
    <rect x="778" y="426" width="192" height="44" rx="22" fill="#f8fafc" />
    <circle cx="798" cy="448" r="4" fill="#0f766e" />
    <text x="818" y="455" font-size="19" font-weight="500" fill="#181d25">Business filing</text>
    <rect x="778" y="480" width="150" height="44" rx="22" fill="#f8fafc" />
    <circle cx="798" cy="502" r="4" fill="#0f766e" />
    <text x="818" y="509" font-size="19" font-weight="500" fill="#181d25">Audit trail</text>
  </g>
