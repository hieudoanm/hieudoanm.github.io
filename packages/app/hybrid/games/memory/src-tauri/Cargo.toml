[package]
name = "memory"
version = "0.0.1"
description = "Memory Games"
authors = ["hieudoanm"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
