[package]
name = "lingo"
version = "0.0.1"
description = "Lingo"
authors = ["hieudoanm <hieumdoan@gmail.com>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib",
]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
log = "=0.4.34"
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-log = "=2.10.0"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-updater = "=2.13.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
