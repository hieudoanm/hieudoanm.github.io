hero:
  badge: '🍎 macOS 13+ · v0.0.1'
  headline: One app to rule your Mac.
  subheadline: >-
    Live system stats, network throughput, local ports, running apps,
    workspace layouts, and clipboard history right in your menu bar — all
    local-first, with nothing ever leaving your machine.
  primary:
    label: Download for macOS
