type: product

theme:
  base: "#f8fafc"
  primary: "#d9822b"
  secondary: "#0d9488"
  neutral: "#475569"
  info: "#0ea5e9"
  warning: "#f59e0b"
  success: "#10b981"
  error: "#ef4444"
  radius: "10px"

site:
  name: Brewery
  mark: "🍺"
  description: >-
    Manage Homebrew packages and services from a native macOS interface.
  nav:
    - label: Features
      href: "#features"
    - label: Demo
      href: "#demo"
    - label: Source
      href: "https://github.com/hieudoanm/hieudoanm.github.io/tree/master/packages/app/native/brewery"

hero:
  badge: "🍺 macOS · GPL-3.0"
  headline: Your Homebrew, without the terminal.
  subheadline: >-
    A clean SwiftUI wrapper around brew — discover, install, upgrade, and
    manage formulae, casks, and services without touching the terminal.
  primary:
    label: Download for macOS
    href: "https://github.com/hieudoanm/hieudoanm.github.io/releases/tag/app-native-macos-brewery-latest"
  secondary:
    label: View source
    href: "https://github.com/hieudoanm/hieudoanm.github.io/tree/master/packages/app/native/brewery"
  image:
    src: demo.png
    alt: Brewery terminal preview of update, upgrade, and services

features:
  heading: Why Brewery
  sub: Everything a Homebrew user needs, wrapped in a native Mac interface.
  items:
    - icon: "🔍"
      title: Search & install
      body: >-
        Browse formulae and casks, read their details, and install with one
        click.
    - icon: "⬆️"
      title: Update everything
      body: >-
        Refresh Homebrew metadata and upgrade every outdated package at once.
    - icon: "⚙️"
      title: Services at hand
      body: >-
        List Homebrew services and start, stop, or restart each one straight
        from the sidebar.
    - icon: "🗑️"
      title: Upgrade & uninstall
      body: >-
        See what is installed with full details, then upgrade or uninstall as
        needed.

demo:
  heading: See it in action
  sub: Update, upgrade, and manage services — the Homebrew workflow end to end.
  video:
    src: demo.mp4
    poster: demo.png
    track: demo-en-descriptions.vtt

cta:
  icon: "🍺"
  heading: Your Homebrew, without the terminal.
  body: >-
    Manage packages, services, and updates from a clean native Mac interface —
    brew itself runs locally and nothing ever leaves your device.
  button:
    label: Download for macOS
    href: "https://github.com/hieudoanm/hieudoanm.github.io/releases/tag/app-native-macos-brewery-latest"

footer:
  copyright: "© 2026 Hieu Doan"
  links:
    - label: Features
      href: "#features"
    - label: Demo
      href: "#demo"
    - label: Source
      href: "https://github.com/hieudoanm/hieudoanm.github.io/tree/master/packages/app/native/brewery"