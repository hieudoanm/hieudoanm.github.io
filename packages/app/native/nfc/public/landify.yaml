type: product

theme:
  base: "#f8fafc"
  primary: "#6366f1"
  secondary: "#8b5cf6"
  neutral: "#475569"
  info: "#0ea5e9"
  warning: "#f59e0b"
  success: "#10b981"
  error: "#ef4444"
  radius: "10px"

site:
  name: NFC
  mark: "📡"
  description: >-
    Read and inspect NFC tags on your phone.
  nav:
    - label: Features
      href: "#features"
    - label: Demo
      href: "#demo"
    - label: Source
      href: "https://github.com/hieudoanm/hieudoanm.github.io/tree/master/packages/app/native/nfc"

hero:
  badge: "📡 Android · GPL-3.0"
  headline: Read and inspect NFC tags on your phone.
  subheadline: >-
    A general-purpose NFC toolkit for reading, writing, analyzing, and
    emulating tags — everything stays local on your device.
  primary:
    label: Download for Android
    href: "https://github.com/hieudoanm/hieudoanm.github.io/releases/tag/app-native-android-nfc-latest"
  secondary:
    label: View source
    href: "https://github.com/hieudoanm/hieudoanm.github.io/tree/master/packages/app/native/nfc"
  image:
    src: demo.png
    alt: NFC terminal preview of build, install, and tag read

features:
  heading: Why NFC
  sub: Responds the moment a tag is near your phone, and keeps every scan you make.
  items:
    - icon: "📡"
      title: Tap to scan
      body: >-
        Foreground dispatch picks up tags as soon as the app is open, with
        clear scan states.
    - icon: "🕘"
      title: Scan history
      body: >-
        Every scan is stored in a local Room database, with delete and
        clear-all actions.
    - icon: "🔬"
      title: Deep inspection
      body: >-
        NDEF records and raw tag technology data are decoded in the data
        layer for full detail.
    - icon: "🎛️"
      title: Tunable behavior
      body: >-
        Settings let you toggle app behavior — all persisted locally with
        DataStore.

demo:
  heading: See it in action
  sub: Build, install, and tap — the NFC inspection workflow end to end.
  video:
    src: demo.mp4
    poster: demo.png
    track: demo-en-descriptions.vtt

cta:
  icon: "📡"
  heading: Tap, read, explore.
  body: >-
    Inspect NFC tags from your phone — tags are read and stored locally, with
    nothing uploaded anywhere.
  button:
    label: Download for Android
    href: "https://github.com/hieudoanm/hieudoanm.github.io/releases/tag/app-native-android-nfc-latest"

footer:
  copyright: "© 2026 Hieu Doan"
  links:
    - label: Features
      href: "#features"
    - label: Demo
      href: "#demo"
    - label: Source
      href: "https://github.com/hieudoanm/hieudoanm.github.io/tree/master/packages/app/native/nfc"