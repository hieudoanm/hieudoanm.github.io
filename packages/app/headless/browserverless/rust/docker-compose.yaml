services:
  browserverless:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: browserverless
    restart: always
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    volumes:
      - browserverless_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  browserverless_data:
