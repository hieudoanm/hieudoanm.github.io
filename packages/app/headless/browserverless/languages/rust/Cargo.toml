[workspace]
resolver = "2"
members = [
    "crates/browserverless",
    "crates/headless",
    "crates/cli",
]

[workspace.dependencies]
servo = "=0.6.0"
clap = { version = "=4.6.7", features = ["derive"] }
thiserror = "=2.0.21"
image = "=0.25.10"
url = "=2.5.8"
log = "=0.4.34"
env_logger = "=0.11.11"
winit = "=0.30.13"
dpi = "=0.1.2"
tracing = "=0.1.44"
tiny_http = "=0.12.0"
