<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <title>Landify terminal: new, validate, build, serve</title>
  <desc>Animated terminal window showing landify new, landify validate, landify build, and landify serve with their output.</desc>

  <style>
    .line { opacity: 0; }
    .line.new { animation: rise 0.4s ease-out 0.9s forwards; }
    .line.created { animation: rise 0.4s ease-out 1.7s forwards; }
    .line.next { animation: rise 0.4s ease-out 2.4s forwards; }
    .line.then { animation: rise 0.4s ease-out 3.1s forwards; }
    .line.validate { animation: rise 0.4s ease-out 4.3s forwards; }
    .line.valid { animation: rise 0.4s ease-out 5.3s forwards; }
    .line.build { animation: rise 0.4s ease-out 6.5s forwards; }
    .line.built { animation: rise 0.4s ease-out 7.5s forwards; }
    .line.serve { animation: rise 0.4s ease-out 8.7s forwards; }
    .line.serving { animation: rise 0.4s ease-out 9.7s forwards; }
    .line.stop { animation: rise 0.4s ease-out 10.5s forwards; }
    .line.prompt { animation: rise 0.4s ease-out 12.0s forwards; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <rect x="0" y="0" width="1280" height="720" fill="#0f172a"/>
  <rect x="0" y="0" width="1280" height="48" fill="#1e293b"/>
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#334155" stroke-width="1"/>

  <circle cx="32" cy="24" r="8" fill="#ef4444"/>
  <circle cx="58" cy="24" r="8" fill="#f59e0b"/>
  <circle cx="84" cy="24" r="8" fill="#22c55e"/>

  <text x="640" y="32" font-size="20" fill="#94a3b8" text-anchor="middle">landify — zsh</text>

  <g font-size="27" transform-origin="48 108">
    <g class="line new" transform-origin="48 108">
      <text x="48" y="108">
        <tspan fill="#475569">~/landify </tspan><tspan fill="#e2e8f0">$ </tspan><tspan fill="#14b8a6">landify </tspan><tspan fill="#e2e8f0">new</tspan>
      </text>
    </g>
    <g class="line created" transform-origin="48 148">
      <text x="48" y="148" fill="#94a3b8">✨ Created landify.yaml</text>
    </g>
    <g class="line next" transform-origin="48 188">
      <text x="48" y="188" fill="#94a3b8">Next: landify validate</text>
    </g>
    <g class="line then" transform-origin="48 228">
      <text x="48" y="228" fill="#94a3b8">then: landify build</text>
    </g>

    <g class="line validate" transform-origin="48 296">
      <text x="48" y="296">
        <tspan fill="#475569">~/landify </tspan><tspan fill="#e2e8f0">$ </tspan><tspan fill="#14b8a6">landify </tspan><tspan fill="#e2e8f0">validate</tspan>
      </text>
    </g>
    <g class="line valid" transform-origin="48 336">
      <text x="48" y="336" fill="#34d399">✅ landify.yaml is valid</text>
    </g>

    <g class="line build" transform-origin="48 404">
      <text x="48" y="404">
        <tspan fill="#475569">~/landify </tspan><tspan fill="#e2e8f0">$ </tspan><tspan fill="#14b8a6">landify </tspan><tspan fill="#e2e8f0">build</tspan>
      </text>
    </g>
    <g class="line built" transform-origin="48 444">
      <text x="48" y="444" fill="#34d399">🚀 Built index.html from landify.yaml</text>
    </g>

    <g class="line serve" transform-origin="48 512">
      <text x="48" y="512">
        <tspan fill="#475569">~/landify </tspan><tspan fill="#e2e8f0">$ </tspan><tspan fill="#14b8a6">landify </tspan><tspan fill="#e2e8f0">serve</tspan>
      </text>
    </g>
    <g class="line serving" transform-origin="48 552">
      <text x="48" y="552" fill="#34d399">🌐 Serving index.html on http://localhost:8080</text>
    </g>
    <g class="line stop" transform-origin="48 592">
      <text x="48" y="592" fill="#94a3b8">⏹️ Ctrl+C to stop</text>
    </g>

    <g class="line prompt" transform-origin="48 648">
      <text x="48" y="648">
        <tspan fill="#475569">~/landify </tspan><tspan fill="#e2e8f0">$ </tspan>
      </text>
    </g>
  </g>

</svg>