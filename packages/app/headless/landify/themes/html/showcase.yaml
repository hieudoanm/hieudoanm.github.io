# showcase.yaml — the gallery content rendered for every built-in theme.
#   landify build -f themes/html/showcase.yaml -o themes/html/<name>.html --theme <name>
site:
  name: Landify
  mark: '🌄'
  description: Landing pages generated from a single YAML file — pick a theme and ship.
  nav:
    - label: Features
      href: '#features'
    - label: Demo
      href: '#demo'
    - label: Get started
      href: '#cta'

hero:
  badge: '✨ 8 built-in themes'
  headline: Landing pages from a single YAML file.
  subheadline:
    Write a handful of YAML keys, pick one of eight color presets, and
    ship a flat, dependency-free HTML page anywhere.
  primary:
    label: Get started
    href: '#cta'
  secondary:
    label: See the demo
    href: '#demo'
  image:
    src: "assets/demo.png"
    alt: The Landify terminal demo

features:
  heading: One YAML, one flat page
  sub: Every theme renders the same page — only the colors change.
  items:
    - icon: '🎨'
      title: Eight color presets
      body: Ocean, forest, sunset, royal, rose, slate, sand, or a dark midnight.
    - icon: '📄'
      title: Zero build step
      body: HTML and CSS only — open it anywhere, no server required.
    - icon: '🧩'
      title: YAML-powered content
      body: Edit one YAML file, regenerate, and the whole page updates in place.
    - icon: '🖼️'
      title: One hero, one demo
      body: Both rendered in the same 16:9 frame (1280 × 720) for consistency.
    - icon: '🧠'
      title: Smart color derivation
      body: Surfaces, hairlines, and contrast are computed from just eight colors.
    - icon: '🚀'
      title: Ship anywhere
      body: GitHub Pages, Netlify, or a USB stick — no build pipeline needed.

demo:
  heading: Demo
  sub: A short walkthrough in the same 16:9 frame.
  video:
    src: 'assets/demo.mp4'
    poster: 'assets/demo.png'

cta:
  icon: '🪄'
  heading: Make your mark on the web.
  body: Write your YAML, pick a theme, generate, and go live before your coffee cools.
  button:
    label: Get the template
    href: https://github.com/hieudoanm/hieudoanm.github.io

footer:
  copyright: '© 2026 Landify'
  links:
    - label: Features
      href: '#features'
    - label: Demo
      href: '#demo'
    - label: Get started
      href: '#cta'
