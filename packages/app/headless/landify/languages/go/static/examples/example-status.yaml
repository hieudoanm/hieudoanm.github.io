# landify.yaml — the single content source for your landing page.
#
#   landify validate   # check that this file is valid
#   landify build      # generate index.html from this file
#
# Every field below has placeholder text and a short "what to do" hint.
# Attributes like mark, badge, and icon are emoji; keep them quoted so the
# intent is explicit. All fields marked "required" must be non-empty for
# `landify validate` to pass.
#
# Type: the "status" layout is a service-status page. The status.state value
# picks a banner color: operational maps to green, degraded and maintenance to
# amber, outage to red. Render as a static page and re-run `landify build`
# whenever your incident log changes.
#
# Media: this layout ships no media — no hero image, no demo video. If you
# switch the type, regenerate with `landify new -t <type>` for the matching
# example.
#
# Colors: theme is the only design input. List the eight base colors (and,
# optionally, the corner radius); every other CSS token the page uses —
# surfaces (base-100/200/300, base-content), accent shades and tints
# (primary-dark/soft/content, secondary-content), and hairlines derived from
# neutral (neutral-faint, border, border-soft) — is calculated from them.
# Values below are the defaults; any field left empty keeps its default.

type: status             # status | team | linktree | faq | product (default) | waitlist | event | download | app | pricing | portfolio | docs

theme:
  base: "#f7f8fa"         #   backgrounds and surface family
  primary: "#0d9488"      #   brand accent
  secondary: "#7c3aed"    #   secondary accent
  neutral: "#555f6e"      #   muted text and hairline base
  info: "#2563eb"
  warning: "#d97706"
  success: "#16a34a"
  error: "#dc2626"
  radius: "10px"          #   corner radius (not a color)

site:                     # used in the navbar, <title>, and meta description
  name: Landify Status     # [required] your product or site name
  mark: "📊"              # [optional] emoji shown next to the name
  description: >-          # [required] one sentence used for <meta name="description">
    Live status, uptime figures, and the incident log for Landify.
  nav:                     # [required] links shown in the top navbar
    - label: Status
      href: "#status"
    - label: Subscribe
      href: "#cta"

hero:                     # the first thing visitors see
  badge: "⚡ Live"        # [optional] small pill above the headline
  headline: All systems normal.   # [required] the big title
  subheadline: >-          # [required] one or two sentences of supporting text
    Status of the Landify website and API, updated whenever something changes.

status:                   # the status page content
  state: operational       # [required] operational | degraded | outage | maintenance
  updated: "September 7, 2026 09:00 UTC"   # [optional] when the state last changed
  announcement: >-        # [optional] one-line notice above the stats
    No scheduled maintenance this week. Builds and the theme gallery are green.
  stats:                  # [optional] uptime figures; add or remove freely
    - label: Uptime (30d)   # [required] stat label
      value: 99.99%        # [required] stat value
    - label: API latency
      value: 42 ms
    - label: Open incidents
      value: "0"
  heading: Recent incidents   # [optional] section title above the log
  sub: Newest first.      # [optional] section subtitle
  incidents:              # [optional] the incident log; add or remove freely
    - date: August 14      # [required] when it happened
      title: Elevated API latency   # [required] short title
      state: resolved      # [optional] investigating | monitoring | resolved
      body: Transient slowdown during a platform update, now back to normal.
    - date: July 2
      title: Scheduled maintenance
      state: resolved
      body: The gallery rebuild took the site briefly read-only overnight.

cta:                      # the closing call to action
  icon: "🔔"              # [optional] emoji above the heading
  heading: Want updates?   # [required]
  body: >-                 # [required]
    Subscribe and we will email you whenever the status changes.
  button:                  # [required] the single main action
    label: Subscribe
    href: https://forms.example.com/status

footer:                   # the simple footer row
  copyright: "© 2026 Landify Status"   # [required] shown first in the footer
  links:                  # [optional] footer links; use the same items as nav
    - label: Status
      href: "#status"
    - label: Subscribe
      href: "#cta"