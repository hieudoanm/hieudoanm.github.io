# landify.yaml — the single content source for your landing page.
#
#   landify validate   # check that this file is valid
#   landify build      # generate index.html from this file
#
# Every field below has placeholder text and a short "what to do" hint.
# Attributes like mark, badge, and icon are emoji; keep them quoted so the
# intent is explicit. All fields marked "required" must be non-empty for
# `landify validate` to pass.
#
# Type: the "event" layout is a conference-style page — a date/venue strip, an
# agenda timeline, a speaker grid, and a tickets button. Required: event.date,
# event.venue.name, event.primary (label + href), at least one event.agenda
# item (time + title), and at least one event.speaker (name + role).
#
# Open Graph: the optional site.og block fills the <head> so a shared link
# renders a card. title, description and site_name fall back to the site
# values, and url and image only appear when you set them. `landify build`
# also writes a 1200 x 630 og/og.svg from the card copy and the theme above:
# kicker becomes the small line above the title, tags the chips in the right
# panel, and site.name the monogram. Convert it to the PNG that image points
# at, e.g. rsvg-convert -o og/og.png og/og.svg
#
# Colors: theme is the only design input. List the eight base colors (and,
# optionally, the corner radius); every other CSS token the page uses —
# surfaces (base-100/200/300, base-content), accent shades and tints
# (primary-dark/soft/content, secondary-content), and hairlines derived from
# neutral (neutral-faint, border, border-soft) — is calculated from them.
# Values below are the defaults; any field left empty keeps its default.

type: event               # waitlist | event | download | app | pricing | portfolio | docs | faq | team | status | linktree

theme:
  base: "#f7f8fa"         #   backgrounds and surface family
  primary: "#0d9488"      #   brand accent
  secondary: "#7c3aed"    #   secondary accent
  neutral: "#555f6e"      #   muted text and hairline base
  info: "#2563eb"
  warning: "#d97706"
  success: "#16a34a"
  error: "#dc2626"
  radius: "10px"          #   corner radius (not a color)

site:                     # used in the navbar, <title>, and meta description
  name: Landify            # [required] your product or site name
  mark: "🌄"               # [optional] emoji shown next to the name
  description: >-          # [required] one sentence used for <meta name="description">
    A flat, dependency-free landing page generated from a single YAML file.
  nav:                     # [required] links shown in the top navbar
    - label: Agenda       #   visible link text
      href: "#agenda"     #   link target: "#section" or a full URL
    - label: Speakers
      href: "#speakers"
    - label: Tickets
      href: "https://tickets.example.com"

  og:                        # [optional] social card: build writes og/og.svg and the <head> tags
    title: Your page in one link   #   og:title — defaults to site.name
    description: >-          #   og:description — defaults to site.description
      One sentence a link preview can show.
    image: "https://example.com/og/og.png"   #   og:image — omit to emit no image tags (1200 × 630)
    image_alt: ""            #   og:image:alt — describe the card for screen readers
    url: "https://example.com"   #   og:url — the canonical address of this page
    type: "website"          #   og:type — defaults to website
    site_name: ""            #   og:site_name — defaults to site.name
    twitter_card: ""         #   twitter:card — defaults to summary_large_image
    kicker: "One file, one page"   #   card only: the small line above the title
    tags:                    #   card only: chips in the right panel, first 4 shown
      - "Zero build step"
      - "12 layouts"
      - "HTML + CSS only"

hero:                     # the first thing visitors see
  badge: "🎟️ Save the date"   # [optional] small pill above the headline
  headline: Your event headline.   # [required] the big title
  subheadline: >-          # [required] one or two sentences of supporting text
    Describe the event in one or two sentences. Keep it short and clear.
  secondary:               # [optional] secondary link, e.g. the venue
    label: Venue
    href: "#venue"

event:                     # the event details and program
  date: "March 14, 2026"   # [required]
  time: "9:00 – 17:00"     # [optional]
  venue:                   # [required] venue.name is required
    name: Civic Hall       #   [required] venue name
    city: Paris            #   [optional]
    address: "1 Rue des Flots"   #   [optional]
  primary:                 # [required] the tickets button
    label: Get tickets
    href: "https://tickets.example.com"
  speakers_heading: Speakers       # [optional] section heading
  speakers_sub: The folks on stage.   # [optional]
  agenda:                  # [required] at least one slot
    - time: "09:30"        #   [required] start time
      title: Keynote       #   [required] session title
      speaker: Ana         #   [optional]
      body: A look at where things go next.   # [optional]
    - time: "11:00"
      title: Hands-on lab
      speaker: Sam
      body: Build your first page, live.
  speakers:                # [required] at least one speaker
    - name: Ana            #   [required]
      role: Principal Engineer   #   [required]
      avatar: "🦊"         #   [optional] emoji avatar
    - name: Sam
      role: Product Designer
      avatar: "🐙"

cta:                       # the closing call to action
  icon: "🎟️"               # [optional] emoji above the heading
  heading: See you there.   # [required]
  body: >-                 # [required]
    Get a ticket before they sell out.
  button:                  # [required] the single main action
    label: Get tickets
    href: "https://tickets.example.com"

footer:                    # the simple footer row
  copyright: "© 2026 Landify"   # [required] shown first in the footer
  links:                   # [required] footer links; use the same items as nav
    - label: Agenda
      href: "#agenda"
    - label: Speakers
      href: "#speakers"