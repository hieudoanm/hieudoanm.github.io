# landify.yaml — the single content source for your landing page.
#
#   landify validate   # check that this file is valid
#   landify build      # generate index.html from this file
#
# Every field below has placeholder text and a short "what to do" hint.
# Attributes like mark, badge, and icon are emoji; keep them quoted so the
# intent is explicit. All fields marked "required" must be non-empty for
# `landify validate` to pass.
#
# Type: the "faq" layout is a question-and-answer page. Questions render as
# native <details>/<summary> rows, so the page needs no JavaScript.
#
# Media: this layout ships no media — no hero image, no demo video. If you
# switch the type, regenerate with `landify new -t <type>` for the matching
# example.
#
# Colors: theme is the only design input. List the eight base colors (and,
# optionally, the corner radius); every other CSS token the page uses —
# surfaces (base-100/200/300, base-content), accent shades and tints
# (primary-dark/soft/content, secondary-content), and hairlines derived from
# neutral (neutral-faint, border, border-soft) — is calculated from them.
# Values below are the defaults; any field left empty keeps its default.

type: faq                # faq | team | status | linktree | product (default) | waitlist | event | download | app | pricing | portfolio | docs

theme:
  base: "#f7f8fa"         #   backgrounds and surface family
  primary: "#0d9488"      #   brand accent
  secondary: "#7c3aed"    #   secondary accent
  neutral: "#555f6e"      #   muted text and hairline base
  info: "#2563eb"
  warning: "#d97706"
  success: "#16a34a"
  error: "#dc2626"
  radius: "10px"          #   corner radius (not a color)

site:                     # used in the navbar, <title>, and meta description
  name: Landify Help       # [required] your product or site name
  mark: "❓"               # [optional] emoji shown next to the name
  description: >-          # [required] one sentence used for <meta name="description">
    Answers to the most common questions about Landify.
  nav:                     # [required] links shown in the top navbar
    - label: Questions
      href: "#faq"
    - label: Contact
      href: "#cta"

hero:                     # the first thing visitors see
  badge: "🙋 FAQ"         # [optional] small pill above the headline
  headline: Questions, answered.   # [required] the big title
  subheadline: >-          # [required] one or two sentences of supporting text
    Straight answers to the questions we hear the most. Still stuck after
    this list? The button below links to human support.

faq:                      # [required] the question-and-answer list
  heading: Frequently asked   # [optional] section title
  sub: Picked from real support conversations.   # [optional] section subtitle
  items:                  # [required] add or remove freely
    - question: Does Landify need a build step?   # [required] the question
      answer: >-          # [required] the answer shown when the row is open
        No. Landify emits one flat HTML file with inline CSS. Open it in a
        browser or drop it on any static host.
    - question: Where do the colors come from?
      answer: >-
        The theme section lists eight base colors. Every other CSS token the
        page uses — surfaces, shades, tints, and text-on-accent contrast — is
        derived from them automatically.
    - question: Can I switch the page layout later?
      answer: >-
        Yes. Recreate the file with `landify new -t <type>` for the layout you
        want, then copy your site, theme, and footer blocks across.

cta:                      # the closing call to action
  icon: "💬"              # [optional] emoji above the heading
  heading: Still curious?   # [required]
  body: >-                 # [required]
    If your question is not listed here, ask a human — we answer within a day.
  button:                  # [required] the single main action
    label: Contact support
    href: mailto:support@example.com

footer:                   # the simple footer row
  copyright: "© 2026 Landify Help"   # [required] shown first in the footer
  links:                  # [optional] footer links; use the same items as nav
    - label: Questions
      href: "#faq"
    - label: Contact
      href: "#cta"