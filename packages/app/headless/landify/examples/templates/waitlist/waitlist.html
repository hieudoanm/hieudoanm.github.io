<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Join the waitlist for the world&#39;s flattest app." />
    <title>Hype</title>
    <style>
      :root {
        --base-100: #f8fafc;
        --base-200: #fefeff;
        --base-300: #f1f3f4;
        --base-content: #181d25;
        --border: #64748b;
        --border-soft: #bdc4cf;
        --error: #ef4444;
        --info: #0ea5e9;
        --neutral: #64748b;
        --neutral-faint: #a7b0be;
        --primary: #1e293b;
        --primary-content: #ffffff;
        --primary-dark: #1a2332;
        --primary-soft: #dee1e5;
        --radius: 10px;
        --secondary: #475569;
        --secondary-content: #ffffff;
        --success: #10b981;
        --warning: #f59e0b;
      }
* {
        box-sizing: border-box;
      }
      html {
        margin: 0;
        scroll-behavior: smooth;
        scroll-padding-top: 76px;
      }
      body {
        margin: 0;
        padding: 0;
        background: var(--base-100);
        color: var(--base-content);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 0 24px;
        height: 60px;
        background: var(--base-200);
        border-bottom: 1px solid var(--border-soft);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 700;
        color: var(--base-content);
      }
      .brand:hover {
        text-decoration: none;
      }
      .brand .mark {
        font-size: 20px;
        line-height: 1;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 14px;
      }
      nav a {
        color: var(--neutral);
      }
      nav a:hover {
        color: var(--base-content);
        text-decoration: none;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        justify-items: center;
        max-width: 760px;
        margin: 0 auto;
        text-align: center;
        padding: 16px 0 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid var(--border-soft);
        background: var(--primary-soft);
        color: var(--primary-dark);
      }
      .hero h1 {
        margin: 14px 0 8px;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .lead {
        margin: 0 auto;
        max-width: 58ch;
        font-size: 16px;
        color: var(--neutral);
      }
      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 22px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:hover {
        text-decoration: none;
      }
      .btn-primary {
        color: var(--primary-content);
        background: var(--primary);
        border-color: var(--primary);
      }
      .btn-primary:hover {
        background: var(--primary-dark);
        border-color: var(--primary-dark);
      }
      .btn-ghost {
        color: var(--base-content);
        background: var(--base-200);
        border-color: var(--border);
      }
      .btn-ghost:hover {
        background: var(--base-300);
      }

       
      .hero-media,
      .demo-media {
        display: block;
        width: 100%;
        max-width: 720px;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        margin-inline: auto;
        background: var(--base-300);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
      }

      section.block {
        margin-top: 32px;
      }
      .block-head {
        margin: 0 0 18px;
        text-align: center;
      }
      .block-head h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .block-head .sub {
        margin: 6px auto 0;
        max-width: 60ch;
        color: var(--neutral);
        font-size: 14.5px;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .feature {
        background: var(--base-200);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 24px 24px;
        text-align: center;
      }
      .feature .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        font-size: 22px;
        border-radius: var(--radius);
        background: var(--primary-soft);
        border: 1px solid var(--border-soft);
      }
      .feature h3 {
        margin: 14px 0 8px;
        font-size: 16px;
        font-weight: 700;
      }
      .feature p {
        margin: 0;
        font-size: 13.5px;
        color: var(--neutral);
      }

      .cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
        background: var(--base-200);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 48px 32px;
      }
      .cta .icon {
        font-size: 34px;
        line-height: 1;
      }
      .cta h2 {
        margin: 10px 0 6px;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .cta p {
        margin: 0;
        max-width: 52ch;
        color: var(--neutral);
        font-size: 15px;
      }
      .cta .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        align-items: center;
        justify-content: center;
        border-top: 1px solid var(--border-soft);
        margin-top: 48px;
        padding: 24px 0 4px;
        font-size: 13px;
        color: var(--neutral-faint);
      }
      footer a {
        color: var(--neutral-faint);
      }
      footer a:hover {
        color: var(--base-content);
      }

      @media (max-width: 900px) {
        .features {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 560px) {
        nav {
          display: none;
        }
        .hero h1 {
          font-size: 26px;
        }
      }
      .waitlist-panel {
        max-width: 640px;
        margin: 0 auto;
        text-align: center;
        background: var(--base-200);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 40px 32px;
      }
      .waitlist-panel .lead {
        margin: 10px auto 24px;
      }
      .launch-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid var(--border-soft);
        background: var(--primary-soft);
        color: var(--primary-dark);
      }
      .waitlist-form {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        max-width: 460px;
        margin: 0 auto;
      }
      .waitlist-form input[type="email"] {
        flex: 1 1 220px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--base-100);
        color: var(--base-content);
        padding: 12px 16px;
        font-size: 15px;
        font-family: inherit;
      }
      .waitlist-form input:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
      }
      .socials {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 22px;
      }
      .social {
        font-size: 13px;
        font-weight: 600;
        color: var(--base-content);
        background: var(--base-100);
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        padding: 6px 14px;
      }
      .social:hover {
        text-decoration: none;
        background: var(--base-300);
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="#top">
        
        <span>Hype</span>
      </a>
      <nav>
        <a href="#join">Join</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero">
        <div>
          <span class="badge">🪄 Now building</span>
          <h1>The tool the internet asked for.</h1>
          <p class="lead">A dependency-free page generated from a single YAML file.</p>
        </div>
      </section>

      <section id="join" class="block">
        <div class="waitlist-panel">
          <span class="launch-chip">🧡 Open to the first 1,000 on November 1</span>
          <h2>Join the waitlist.</h2>
          <p class="lead">Leave your email and we will send one note when seats open — nothing else.</p>
          <form class="waitlist-form" method="post" action="https://forms.example.com/signup">
            <input type="email" name="email" placeholder="you@example.com" aria-label="Email address" required />
            <button type="submit" class="btn btn-primary">Notify me</button>
          </form>
          
          <div class="socials">
            <a href="https://twitter.com" class="social">𝕏</a><a href="https://discord.example.com" class="social">🎮</a>
          </div>
          
        </div>
      </section>

      

      <footer>
        <span>© 2026 Hype</span>
        
      </footer>
    </main>
  </body>
</html>
