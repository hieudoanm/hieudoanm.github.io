<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Every link to Ana Ruiz in one place." />
    <title>Ana @ the foxes</title>
    <style>
      :root {
        --base-100: #f8fafc;
        --base-200: #fefeff;
        --base-300: #f1f3f4;
        --base-content: #181d25;
        --border: #64748b;
        --border-soft: #bdc4cf;
        --error: #ef4444;
        --info: #0ea5e9;
        --neutral: #64748b;
        --neutral-faint: #a7b0be;
        --primary: #1e293b;
        --primary-content: #ffffff;
        --primary-dark: #1a2332;
        --primary-soft: #dee1e5;
        --radius: 10px;
        --secondary: #475569;
        --secondary-content: #ffffff;
        --success: #10b981;
        --warning: #f59e0b;
      }
* {
        box-sizing: border-box;
      }
      html {
        margin: 0;
        scroll-behavior: smooth;
        scroll-padding-top: 76px;
      }
      body {
        margin: 0;
        padding: 0;
        background: var(--base-100);
        color: var(--base-content);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 0 24px;
        height: 60px;
        background: var(--base-200);
        border-bottom: 1px solid var(--border-soft);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 700;
        color: var(--base-content);
      }
      .brand:hover {
        text-decoration: none;
      }
      .brand .mark {
        font-size: 20px;
        line-height: 1;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 14px;
      }
      nav a {
        color: var(--neutral);
      }
      nav a:hover {
        color: var(--base-content);
        text-decoration: none;
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }

      .hero {
        display: grid;
        grid-template-columns: 1fr;
        gap: 28px;
        justify-items: center;
        max-width: 760px;
        margin: 0 auto;
        text-align: center;
        padding: 16px 0 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid var(--border-soft);
        background: var(--primary-soft);
        color: var(--primary-dark);
      }
      .hero h1 {
        margin: 14px 0 8px;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .lead {
        margin: 0 auto;
        max-width: 58ch;
        font-size: 16px;
        color: var(--neutral);
      }
      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 22px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:hover {
        text-decoration: none;
      }
      .btn-primary {
        color: var(--primary-content);
        background: var(--primary);
        border-color: var(--primary);
      }
      .btn-primary:hover {
        background: var(--primary-dark);
        border-color: var(--primary-dark);
      }
      .btn-ghost {
        color: var(--base-content);
        background: var(--base-200);
        border-color: var(--border);
      }
      .btn-ghost:hover {
        background: var(--base-300);
      }

       
      .hero-media,
      .demo-media {
        display: block;
        width: 100%;
        max-width: 720px;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        margin-inline: auto;
        background: var(--base-300);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
      }

      section.block {
        margin-top: 32px;
      }
      .block-head {
        margin: 0 0 18px;
        text-align: center;
      }
      .block-head h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .block-head .sub {
        margin: 6px auto 0;
        max-width: 60ch;
        color: var(--neutral);
        font-size: 14.5px;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .feature {
        background: var(--base-200);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 24px 24px;
        text-align: center;
      }
      .feature .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        font-size: 22px;
        border-radius: var(--radius);
        background: var(--primary-soft);
        border: 1px solid var(--border-soft);
      }
      .feature h3 {
        margin: 14px 0 8px;
        font-size: 16px;
        font-weight: 700;
      }
      .feature p {
        margin: 0;
        font-size: 13.5px;
        color: var(--neutral);
      }

      .cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
        background: var(--base-200);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 48px 32px;
      }
      .cta .icon {
        font-size: 34px;
        line-height: 1;
      }
      .cta h2 {
        margin: 10px 0 6px;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .cta p {
        margin: 0;
        max-width: 52ch;
        color: var(--neutral);
        font-size: 15px;
      }
      .cta .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        align-items: center;
        justify-content: center;
        border-top: 1px solid var(--border-soft);
        margin-top: 48px;
        padding: 24px 0 4px;
        font-size: 13px;
        color: var(--neutral-faint);
      }
      footer a {
        color: var(--neutral-faint);
      }
      footer a:hover {
        color: var(--base-content);
      }

      @media (max-width: 900px) {
        .features {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 560px) {
        nav {
          display: none;
        }
        .hero h1 {
          font-size: 26px;
        }
      }
      main {
        max-width: 640px;
        padding-top: 48px;
        padding-bottom: 48px;
      }
      .lt-profile {
        text-align: center;
        padding-bottom: 28px;
      }
      .lt-avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        font-size: 40px;
        line-height: 1;
        background: var(--primary-soft);
        border: 2px solid var(--primary);
      }
      .lt-profile h1 {
        margin: 14px 0 6px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .lt-sub {
        margin: 0;
        font-size: 14.5px;
        color: var(--neutral);
      }
      .lt-cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .lt-card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--base-200);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 16px 20px;
        color: var(--base-content);
        font-size: 15px;
        font-weight: 600;
      }
      .lt-card:hover {
        border-color: var(--primary);
        color: var(--primary);
        text-decoration: none;
      }
      .lt-card .icon {
        font-size: 20px;
        line-height: 1;
      }
      .lt-card-title {
        flex: 1;
        text-align: left;
      }
      .lt-card-note {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--neutral);
      }
      .lt-social {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 26px;
      }
      .lt-social-link {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary-dark);
        background: var(--primary-soft);
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        padding: 8px 16px;
      }
      .lt-social-link:hover {
        border-color: var(--primary);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="#top">
        <span class="mark">🦊</span>
        <span>Ana @ the foxes</span>
      </a>
      <nav>
        <a href="#links">Links</a>
      </nav>
    </header>

    <main id="top">
      <section class="lt-profile">
        <span class="lt-avatar" aria-hidden="true">🦊</span>
        <h1>@anaruiz</h1>
        <p class="lt-sub">Design engineer making flat pages and tiny tools.</p>
      </section>

      <section id="links" class="lt-cards">
        
        <a class="lt-card" href="https://example.com/landify">
          <span class="icon" aria-hidden="true">🛠️</span>
          <span class="lt-card-title">Landify</span>
          <span class="lt-card-note">flat landing pages</span>
        </a>
        
        <a class="lt-card" href="https://example.com/writing">
          <span class="icon" aria-hidden="true">📄</span>
          <span class="lt-card-title">My writing</span>
          <span class="lt-card-note">notes on design systems</span>
        </a>
        
        <a class="lt-card" href="https://example.com/podcast">
          <span class="icon" aria-hidden="true">🎙️</span>
          <span class="lt-card-title">Podcast</span>
          <span class="lt-card-note">new episode Fridays</span>
        </a>
        
        <a class="lt-card" href="mailto:ana@example.com">
          <span class="icon" aria-hidden="true">💌</span>
          <span class="lt-card-title">Say hello</span>
          <span class="lt-card-note">replies within a day</span>
        </a>
        
      </section>

      
      <nav class="lt-social" aria-label="Social links">
        <a class="lt-social-link" href="https://twitter.com">𝕏</a><a class="lt-social-link" href="https://github.com">GitHub</a><a class="lt-social-link" href="https://linkedin.com">LinkedIn</a>
      </nav>
      

      <footer>
        <span>© 2026 Ana Ruiz</span>
        <a href="#links">Links</a>
      </footer>
    </main>
  </body>
</html>
