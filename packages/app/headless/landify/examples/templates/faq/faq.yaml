faq:
  heading: Frequently asked
  sub: Picked from real support conversations.
  items:
    - question: Does Landify need a build step?
      answer: No. Landify emits one flat HTML file with inline CSS. Open it in a browser or drop it on any static host.
    - question: Where do the colors come from?
      answer: The theme section lists eight base colors. Every other CSS token the page uses — surfaces, shades, tints, and text-on-accent contrast — is derived from them automatically.
    - question: Can I switch the page layout later?
      answer: Yes. Recreate the file with `landify new -t <type>` for the layout you want, then copy your site, theme, and footer blocks across.
    - question: Does this page need any JavaScript?
      answer: No. Questions render as native <details> rows, so the accordion works with markup alone.
