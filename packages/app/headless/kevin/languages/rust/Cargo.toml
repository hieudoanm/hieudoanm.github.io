[package]
name = "kevin"
version = "0.0.1"
edition = "2021"
description = "Redis-style in-memory key/value store, behaviour-identical to the C, C++ and Go implementations"
license = "GPL-3.0"

[[bin]]
name = "kevin"
path = "src/main.rs"

[lib]
name = "kevin"
path = "src/lib.rs"

[features]
default = []
# Material-design slint key/value manager (serve --gui). Needs CGO-free winit
# backend; build with: cargo build --features gui
gui = ["dep:slint", "dep:arboard"]

[dependencies]
anyhow = "=1.0.104"
arboard = { version = "=3.6.1", optional = true }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
signal-hook = "=0.4.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
slint = { version = "=1.18.1", optional = true }
ratatui = "=0.30.2"
crossterm = "=0.29.0"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
criterion = "=0.8.2"
tempfile = "=3.27.0"

[[bench]]
name = "bench"
harness = false

[[test]]
name = "handler"
path = "tests/handler.rs"

[[test]]
name = "persist"
path = "tests/persist.rs"

[[test]]
name = "server"
path = "tests/server.rs"

[profile.release]
lto = true
