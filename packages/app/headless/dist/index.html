<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home · pg-docs</title>
    
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="header">
      <div class="header__bar">
        
        <button
          class="header__toggle"
          type="button"
          aria-expanded="false"
          aria-controls="sidebar"
          data-nav-toggle
        >
          <span class="header__toggle-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Menu</span>
        </button>
        
        <a class="header__title" href="/">pg-docs</a>
        <div class="header__actions">
          <label class="header__search" for="search">
            <span class="visually-hidden">Search</span>
            <input
              id="search"
              type="search"
              placeholder="Search"
              autocomplete="off"
              data-search
              data-search-index="/assets/search-index.json"
            />
          </label>
          <button class="header__theme" type="button" data-theme-toggle>
            <span class="visually-hidden">Toggle colour theme</span>
          </button>
        </div>
      </div>
      <div class="search" data-search-panel hidden>
        <p class="search__status" role="status" data-search-status></p>
        <ul class="search__results" data-search-results></ul>
      </div>
    </header>

    <div class="layout">
      
      <nav class="sidebar" id="sidebar" aria-label="Site">
        <ul class="nav">
  <li class="nav__item">
  <a
    class="nav__link nav__link--current"
    href="/"
    aria-current="page">Home</a
  > 
</li>
</ul>
      </nav>
      

      <main class="main" id="main">
        <article class="markdown"><h1 id="page-title" class="markdown__title">Home</h1>
          
          
          
        </article>
        
      </main>
    </div>

    <footer class="footer">
      <p>Built with pagify</p>
    </footer>

    <script src="/assets/script.js" defer></script>
    <script src="/assets/search.js" defer></script>
  </body>
</html>
