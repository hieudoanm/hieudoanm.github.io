<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>A jack-of-all-trades for your terminal.</title>
  <desc>A personal CLI toolbox with 180+ commands across 14 modules — calculate, convert, encrypt, and time anything from your terminal.</desc>
  <defs>
    <linearGradient id="og-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#fefeff" />
    </linearGradient>
    <radialGradient id="og-glow" cx="0.88" cy="0.04" r="0.58">
      <stop offset="0" stop-color="#333f52" stop-opacity="0.17" />
      <stop offset="1" stop-color="#333f52" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset="1" stop-color="#1a2332" />
    </linearGradient>
    <filter id="og-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#og-base)" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#og-glow)" />
  <rect x="0" y="0" width="12" height="630" fill="url(#og-accent)" />

  <g>
    <rect x="96" y="84" width="56" height="56" rx="16" fill="url(#og-accent)" />
    <text x="124" y="121" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">JA</text>
    <text x="172" y="121" font-size="26" font-weight="600" fill="#181d25">J.A.C.K.</text>
    <text x="1104" y="119" text-anchor="end" font-size="22" fill="#64748b">hieudoanm.github.io</text>
  </g>
  <line x1="96" y1="176" x2="1104" y2="176" stroke="#a7b0be" stroke-width="2" />

  <g font-size="17" font-weight="700" letter-spacing="0.16em" fill="#1e293b">
    <text x="96" y="266">180+ COMMANDS, ONE BINARY</text>
  </g>
  <g font-size="58" font-weight="800" fill="#181d25" letter-spacing="-0.022em">
  <text x="96" y="341">A jack-of-all-trades</text>
  <text x="96" y="403">for your terminal.</text>
  </g>
  <g font-size="25" fill="#64748b">
  <text x="96" y="455">A personal CLI toolbox with 180+ commands</text>
  <text x="96" y="490">across 14 modules — calculate, convert, encrypt,</text>
  <text x="96" y="525">and time anything from your terminal.</text>
  </g>

  <g>
    <rect x="748" y="202" width="356" height="382" rx="24" fill="#dee1e5" stroke="#bdc4cf" stroke-width="1.5" filter="url(#og-shadow)" />
    <rect x="778" y="235" width="84" height="84" rx="24" fill="url(#og-accent)" />
    <text x="820" y="292" text-anchor="middle" font-size="42" font-weight="800" fill="#ffffff">JA</text>
    <rect x="778" y="345" width="162" height="44" rx="22" fill="#f8fafc" />
    <circle cx="798" cy="367" r="4" fill="#1e293b" />
    <text x="818" y="374" font-size="19" font-weight="500" fill="#181d25">14 modules</text>
    <rect x="778" y="399" width="154" height="44" rx="22" fill="#f8fafc" />
    <circle cx="798" cy="421" r="4" fill="#1e293b" />
    <text x="818" y="428" font-size="19" font-weight="500" fill="#181d25">Calculator</text>
    <rect x="778" y="453" width="231" height="44" rx="22" fill="#f8fafc" />
    <circle cx="798" cy="475" r="4" fill="#1e293b" />
    <text x="818" y="482" font-size="19" font-weight="500" fill="#181d25">Converter &amp; crypto</text>
    <rect x="778" y="507" width="128" height="44" rx="22" fill="#f8fafc" />
    <circle cx="798" cy="529" r="4" fill="#1e293b" />
    <text x="818" y="536" font-size="19" font-weight="500" fill="#181d25">Timers</text>
