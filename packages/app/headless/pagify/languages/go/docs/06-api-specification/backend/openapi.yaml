openapi: 3.0.3
info:
  title: pagify JSON API
  version: 0.1.0
  description: |
    Render individual pages over HTTP. All file access is confined to --root.
servers:
  - url: http://localhost:8080
    description: Local pagify serve
paths:
  /api/v1/health:
    get:
      summary: Service health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/openapi.json:
    get:
      summary: OpenAPI document
      responses:
        '200':
          description: OpenAPI JSON
          content:
            application/json:
              schema:
                type: object
  /api/v1/docs:
    get:
      summary: API description
      responses:
        '200':
          description: API description text
          content:
            text/plain:
              schema:
                type: string
  /api/v1/build:
    post:
      summary: Render one page in memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  example: docs/getting-started.md
      responses:
        '200':
          description: Rendered page
          content:
            application/json:
              schema:
                type: object
                properties:
                  html:
                    type: string
                  title:
                    type: string
                  url:
                    type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Page not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Path escapes root
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Render failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: ERR_PAGE_NOT_FOUND
            message:
              type: string
              example: "page not found: docs/missing.md"
            path:
              type: string
              example: docs/missing.md
