[package]
name = "backbone"
version = "0.0.1"
description = "Backbone - Back-end as a Service"
authors = ["hieudoanm <hieumdoan@gmail.com> (https://hieudoanm.github.io)"]
license = "GPL-3.0"
repository = "git+ssh://git@github.com/hieudoanm/hieudoanm.github.io.git"
edition = "2024"
rust-version = "1.85.0"

[dependencies]
axum = { version = "=0.8.9", features = ["ws", "macros"] }
tokio = { version = "=1.53.1", features = ["full"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
jsonwebtoken = { version = "=11.0.0", features = ["rust_crypto"] }
bcrypt = "=0.19.3"
uuid = { version = "=1.26.0", features = ["v4"] }
chrono = { version = "=0.4.45", features = ["serde"] }
tower-http = { version = "=0.7.0", features = ["cors", "fs", "limit"] }
tower = "=0.5.3"
multer = "=3.1.0"
http-body-util = "=0.1.5"
infer = "=0.22.0"
reqwest = { version = "=0.13.4", features = ["json", "multipart"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"
hex = "=0.4.3"
aes-gcm = "=0.11.1"
rand = "=0.10.2"
tokio-stream = "=0.1.19"
cron = "=0.17.0"
rust-embed = "=8.12.0"
mime_guess = "=2.0.5"
deadpool = { version = "=0.13.1", features = ["rt_tokio_1"] }
image = "=0.25.10"
futures = "=0.3.34"

[dev-dependencies]
tempfile = "=3.27.0"
tokio-tungstenite = "=0.30.0"
