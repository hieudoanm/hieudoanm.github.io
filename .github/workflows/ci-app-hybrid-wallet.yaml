name: CI - App - Hybrid - Wallet

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/hybrid/wallet/**'
      - '.github/workflows/ci-app-hybrid-wallet.yaml'
      - '.github/workflows/ci-app-hybrid-template.yaml'

permissions:
  contents: read

concurrency:
  group: ci-app-hybrid-wallet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-hybrid-template.yaml
    with:
      package: packages/app/hybrid/wallet
      filter: '@hieudoanm.github.io/wallet'
      releaseName: app-hybrid-wallet-latest
      releaseTitle: App - Hybrid - Wallet (latest)
      artifactPrefix: wallet
