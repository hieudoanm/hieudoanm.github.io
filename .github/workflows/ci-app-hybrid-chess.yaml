name: CI - App - Hybrid - Chess

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/hybrid/chess/**'
      - '.github/workflows/ci-app-hybrid-chess.yaml'
      - '.github/workflows/ci-app-hybrid-template.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-hybrid-chess-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-hybrid-template.yaml
    with:
      package: packages/app/hybrid/chess
      filter: '@hieudoanm.github.io/chess'
      releaseName: app-hybrid-chess-latest
      releaseTitle: App - Hybrid - Chess (latest)
      artifactPrefix: chess
