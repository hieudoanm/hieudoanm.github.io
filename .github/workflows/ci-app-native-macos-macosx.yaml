name: CI - App - Native - macOS - MacOSX

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/native/macosx/apple/macos/**/*'
      - '.github/workflows/ci-app-native-macos-macosx.yaml'
      - '.github/workflows/ci-app-native-macos-template.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-native-macos-macosx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-native-macos-template.yaml
    with:
      package: packages/app/native/macosx/apple/macos
      releaseName: app-native-macos-macosx-latest
      releaseTitle: App - Native - macOS - MacOSX (latest)
      artifactPrefix: macosx
