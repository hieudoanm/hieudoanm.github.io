name: CI - CLI - Jack

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/cli/jack/clap.rs/**'
      - 'packages/cli/jack/cobra.go/**'
      - 'packages/cli/jack/swift/**'
      - 'packages/cli/jack/cli.kt/**'
      - '.github/workflows/ci-cli-jack.yaml'

permissions:
  contents: write

concurrency:
  group: ci-cli-jack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/cli/jack/clap.rs
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy
      - name: Cache Cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-jack-rust-${{ hashFiles('packages/cli/jack/clap.rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-jack-rust-
      - name: Install zig
        run: |
          ZIG_VERSION="0.14.0"
          case "$RUNNER_OS" in
            Linux)
              url="https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
              dir="zig-linux-x86_64-${ZIG_VERSION}"
              ;;
            macOS)
              url="https://ziglang.org/download/${ZIG_VERSION}/zig-macos-aarch64-${ZIG_VERSION}.tar.xz"
              dir="zig-macos-aarch64-${ZIG_VERSION}"
              ;;
          esac
          if [ ! -d "/tmp/$dir" ]; then
            curl -fsSL "$url" | tar xJ -C /tmp
          fi
          echo "/tmp/$dir" >> "$GITHUB_PATH"
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build (cross-compile)
        run: make build-all
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-rust
          path: packages/cli/jack/clap.rs/bin/*

  go:
    name: Go
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/cli/jack/cobra.go
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: packages/cli/jack/cobra.go/go.sum
      - name: Install Dependencies
        run: go mod download
      - name: Install zig
        run: |
          ZIG_VERSION="0.14.0"
          case "$RUNNER_OS" in
            Linux)
              url="https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
              dir="zig-linux-x86_64-${ZIG_VERSION}"
              ;;
            macOS)
              url="https://ziglang.org/download/${ZIG_VERSION}/zig-macos-aarch64-${ZIG_VERSION}.tar.xz"
              dir="zig-macos-aarch64-${ZIG_VERSION}"
              ;;
          esac
          if [ ! -d "/tmp/$dir" ]; then
            curl -fsSL "$url" | tar xJ -C /tmp
          fi
          echo "/tmp/$dir" >> "$GITHUB_PATH"
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build (cross-compile)
        run: make build-all
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-go
          path: packages/cli/jack/cobra.go/bin/*

  swift:
    name: Swift
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/cli/jack/swift
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Build
        run: make build
      - name: Test
        run: swift test
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-swift
          path: packages/cli/jack/swift/.build/release/jack

  kotlin:
    name: Kotlin
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/cli/jack/cli.kt
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test
        run: ./gradlew test

  publish:
    name: Publish to GitHub Release
    needs: [rust, go, swift]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Collect Release Artifacts
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            artifact_name=$(basename "$dir")
            for file in "$dir"*; do
              cp "$file" "release/${artifact_name}-$(basename "$file")"
            done
          done
      - name: Publish Release
        run: |
          gh release delete cli-jack-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create cli-jack-latest \
            --title "CLI - Jack (latest)" \
            --notes "Auto-built CLI tools from commit ${{ github.sha }}" \
            release/*
        env:
          GH_TOKEN: ${{ github.token }}
