name: CI - App - Native - Android - NFC

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/native/nfc/android/**'
      - '.github/workflows/ci-app-native-android-nfc.yaml'
      - '.github/workflows/ci-app-native-android-template.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-native-android-nfc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-native-android-template.yaml
    with:
      package: packages/app/native/nfc/android
      releaseName: app-native-android-nfc-latest
      releaseTitle: App - Native - Android - NFC (latest)
      artifactPrefix: android-nfc
