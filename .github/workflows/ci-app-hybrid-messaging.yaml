name: CI - App - Hybrid - Messaging

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/hybrid/messaging/**'
      - '.github/workflows/ci-app-hybrid-messaging.yaml'
      - '.github/workflows/ci-app-hybrid-template.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-hybrid-messaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-hybrid-template.yaml
    with:
      package: packages/app/hybrid/messaging
      filter: '@hieudoanm.github.io/messaging'
      releaseName: app-hybrid-messaging-latest
      releaseTitle: App - Hybrid - Messaging (latest)
      artifactPrefix: messaging
