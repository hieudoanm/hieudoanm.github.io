name: CI - App - Headless - Go - Template

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: Go module directory, e.g. packages/app/headless/backbone/go
      releaseName:
        required: true
        type: string
        description: GitHub release tag, e.g. app-headless-backbone-latest
      releaseTitle:
        required: true
        type: string
        description: GitHub release title, e.g. App - Headless - Backbone (latest)
      artifactName:
        required: true
        type: string
        description: Artifact name, e.g. app-headless-backbone
      artifactPath:
        required: true
        type: string
        description: Artifact path glob, e.g. packages/app/headless/backbone/go/bin/*
      runsOn:
        required: false
        type: string
        default: ubuntu-latest
        description: Runner image for the Go job
      goVersion:
        required: false
        type: string
        default: '1.27.0'
        description: Go toolchain version to install
      buildCommand:
        required: false
        type: string
        default: make build
        description: Command that produces the binary under bin/
      testCommand:
        required: false
        type: string
        default: make test
        description: Command that runs the test suite
      lintCommand:
        required: false
        type: string
        default: make lint
        description: Command that runs static analysis
      installZig:
        required: false
        type: boolean
        default: false
        description: Install zig 0.14.0 for cross-compilation (build-all)
      gofmtCheck:
        required: false
        type: boolean
        default: true
        description: Fail the build if gofmt reports unformatted files
      notesFile:
        required: false
        type: string
        description: Optional path to a release notes file, e.g. packages/app/headless/landify/README.md
      publish:
        required: false
        type: boolean
        default: true
        description: Whether this call creates the GitHub release (set false when the caller aggregates multiple languages)

permissions:
  contents: write

jobs:
  go:
    name: Go
    runs-on: ${{ inputs.runsOn }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ inputs.goVersion }}
          cache-dependency-path: ${{ inputs.package }}/go.sum
      - name: Install Dependencies
        run: go mod download
      - name: Install zig
        if: inputs.installZig
        run: |
          ZIG_VERSION="0.14.0"
          case "$RUNNER_OS" in
            Linux)
              url="https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
              dir="zig-linux-x86_64-${ZIG_VERSION}"
              ;;
            macOS)
              url="https://ziglang.org/download/${ZIG_VERSION}/zig-macos-aarch64-${ZIG_VERSION}.tar.xz"
              dir="zig-macos-aarch64-${ZIG_VERSION}"
              ;;
          esac
          if [ ! -d "/tmp/$dir" ]; then
            curl -fsSL "$url" | tar xJ -C /tmp
          fi
          echo "/tmp/$dir" >> "$GITHUB_PATH"
      - name: Check Formatting
        if: inputs.gofmtCheck
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt wants to reformat:"
            echo "$files"
            exit 1
          fi
      - name: Lint
        run: ${{ inputs.lintCommand }}
      - name: Test
        run: ${{ inputs.testCommand }}
      - name: Build
        run: ${{ inputs.buildCommand }}
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: [go]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifactName }}
          path: artifacts
      - name: Collect Release Artifacts
        run: |
          mkdir -p release
          for file in artifacts/*; do
            cp "$file" "release/${{ inputs.artifactName }}-$(basename "$file")"
          done
      - name: Publish Release
        run: |
          RELEASE_NAME="${{ inputs.releaseName }}"
          RELEASE_TITLE="${{ inputs.releaseTitle }}"
          if [[ -n "${{ inputs.notesFile }}" ]]; then
            NOTES_FILE="${{ inputs.notesFile }}"
          else
            NOTES_FILE="${{ inputs.package }}/docs/DOWNLOADS.md"
          fi
          RELEASE_NOTES="release-notes.md"
          {
            echo "Auto-built from commit ${{ github.sha }}"
            if [[ -f "$NOTES_FILE" ]]; then
              echo ""
              echo "---"
              echo ""
              cat "$NOTES_FILE"
            fi
          } > "$RELEASE_NOTES"
          gh release delete "$RELEASE_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            release/*
        env:
          GH_TOKEN: ${{ github.token }}
