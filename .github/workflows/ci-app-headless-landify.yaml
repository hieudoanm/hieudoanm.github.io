name: CI - App - Headless - Landify

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/headless/landify/**'
      - '.github/workflows/ci-app-headless-landify.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-headless-landify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/app/headless/landify/go
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: packages/app/headless/landify/go/go.sum
      - name: Install Dependencies
        run: go mod download
      - name: Lint
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt wants to reformat:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-headless-landify
          path: packages/app/headless/landify/go/bin/landify

  publish:
    name: Publish to GitHub Release
    needs: [go]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Collect Release Artifacts
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            artifact_name=$(basename "$dir")
            for file in "$dir"*; do
              cp "$file" "release/${artifact_name}-$(basename "$file")"
            done
          done
      - name: Publish Release
        run: |
          gh release delete app-headless-landify-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-headless-landify-latest \
            --title "App - Headless - Landify (latest)" \
            --notes-file packages/app/headless/landify/README.md \
            release/*
        env:
          GH_TOKEN: ${{ github.token }}
