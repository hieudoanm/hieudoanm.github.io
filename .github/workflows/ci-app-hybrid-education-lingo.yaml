name: CI - App - Hybrid - Education - Lingo

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/hybrid/education/lingo/**'
      - '.github/workflows/ci-app-hybrid-education-lingo.yaml'
      - '.github/workflows/ci-app-hybrid-template.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-hybrid-education-lingo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-hybrid-template.yaml
    with:
      package: packages/app/hybrid/education/lingo
      filter: '@hieudoanm.github.io/lingo'
      releaseName: app-hybrid-education-lingo-latest
      releaseTitle: App - Hybrid - Education - Lingo (latest)
      artifactPrefix: education-lingo
