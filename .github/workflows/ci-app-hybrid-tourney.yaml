name: CI - App - Hybrid - Tourney

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/hybrid/tourney/**'
      - '.github/workflows/ci-app-hybrid-tourney.yaml'
      - '.github/workflows/ci-app-hybrid-template.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-hybrid-tourney-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-hybrid-template.yaml
    with:
      package: packages/app/hybrid/tourney
      filter: '@hieudoanm.github.io/tourney'
      releaseName: app-hybrid-tourney-latest
      releaseTitle: App - Hybrid - Tourney (latest)
      artifactPrefix: tourney
