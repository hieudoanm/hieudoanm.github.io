name: CI - App - Hybrid - Utilities - Clipper

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/hybrid/utilities/clipper/**'
      - '.github/workflows/ci-app-hybrid-utilities-clipper.yaml'
      - '.github/workflows/ci-app-hybrid-template.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-hybrid-utilities-clipper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-hybrid-template.yaml
    with:
      package: packages/app/hybrid/utilities/clipper
      filter: '@hieudoanm.github.io/clipper'
      releaseName: app-hybrid-utilities-clipper-latest
      releaseTitle: App - Hybrid - Utilities - Clipper (latest)
      artifactPrefix: utilities-clipper
