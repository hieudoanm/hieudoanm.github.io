name: CI - Extensions - Browser - Template

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: Extension directory, e.g. packages/extensions/browser/instax
      filter:
        required: true
        type: string
        description: pnpm filter, e.g. @hieudoanm.github.io/instax
      releaseName:
        required: true
        type: string
        description: GitHub release tag, e.g. extensions-browser-instax-latest
      releaseTitle:
        required: true
        type: string
        description: GitHub release title, e.g. Extensions - Browser - InstaX (latest)
      artifactPrefix:
        required: true
        type: string
        description: Artifact name prefix, e.g. instax
    secrets:
      WEB_EXT_API_KEY:
        required: false
        description: AMO automation API key (Mozilla developer hub)
      WEB_EXT_API_SECRET:
        required: false
        description: AMO automation API secret (Mozilla developer hub)

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Cache pnpm
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: '11.24.0'
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build --filter=${{ inputs.filter }}
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-build
          path: ${{ inputs.package }}/download/
          if-no-files-found: error
      - name: Upload Build Sources
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-dist
          path: ${{ inputs.package }}/dist/
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: [build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-build
          path: artifacts
      - name: Download Build Sources
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-dist
          path: dist
      - name: Collect Release Artifacts
        run: |
          mkdir -p release
          cp artifacts/README.md release/ 2>/dev/null || true
          for ver in v2 v3; do
            for file in artifacts/$ver/*; do
              [ -f "$file" ] || continue
              base="$(basename "$file")"
              name="${base%.*}-${ver}.${base##*.}"
              cp "$file" "release/$name"
            done
          done
      - name: Sign Firefox Add-on (AMO)
        if: secrets.WEB_EXT_API_KEY != '' && secrets.WEB_EXT_API_SECRET != ''
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          set -euo pipefail

          MANIFEST="dist/v2/manifest.json"
          ADDON_ID="$(node -e '
            const m = require(process.argv[1]);
            const gecko = (m.browser_specific_settings ?? m.applications)?.gecko;
            process.stdout.write((gecko && gecko.id) || "");
          ' "$MANIFEST")"
          ADDON_VERSION="$(node -e 'process.stdout.write(require(process.argv[1]).version)' "$MANIFEST")"
          if [[ -z "$ADDON_ID" ]]; then
            echo "::error::No gecko id in $MANIFEST; cannot sign for AMO." >&2
            exit 1
          fi
          echo "Signing $ADDON_ID v$ADDON_VERSION via AMO (unlisted)..."

          SIGNED_XPI=""
          set +e
          npx --yes web-ext@10.6.0 sign \
            --source-dir dist/v2 \
            --channel unlisted \
            --artifacts-dir signed \
            --no-upload-source-code 2>&1 | tee /tmp/amo-sign.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [[ $STATUS -eq 0 ]]; then
            SIGNED_XPI="$(find signed -name '*.xpi' -print -quit)"
          elif grep -Eqi 'already (been signed|exists)' /tmp/amo-sign.log; then
            echo "Version $ADDON_VERSION already signed on AMO; fetching the existing signed artifact."
            TOKEN="$(node -e '
              const crypto = require("crypto");
              const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64url");
              const header = b64({ alg: "HS256", typ: "JWT" });
              const now = Math.floor(Date.now() / 1000);
              const payload = b64({ iss: process.env.WEB_EXT_API_KEY, exp: now + 300, iat: now, jti: crypto.randomUUID() });
              const sig = crypto.createHmac("sha256", process.env.WEB_EXT_API_SECRET)
                .update(header + "." + payload).digest("base64url");
              process.stdout.write(header + "." + payload + "." + sig);
            ')"
            DOWNLOAD_URL="$(curl -fsSL \
              -H "Authorization: Bearer $TOKEN" \
              "https://addons.mozilla.org/api/v5/addons/addon/$ADDON_ID/versions/$ADDON_VERSION/" \
              | node -e '
                let s = "";
                process.stdin.on("data", (d) => { s += d; });
                process.stdin.on("end", () => {
                  const v = JSON.parse(s);
                  const f = v.file ?? v.files?.[0];
                  process.stdout.write(f?.url || "");
                });
              ')"

            if [[ -z "$DOWNLOAD_URL" ]]; then
              echo "::error::AMO has no signed artifact for $ADDON_ID v$ADDON_VERSION." >&2
              exit 1
            fi
            mkdir -p signed
            curl -fsSL -H "Authorization: Bearer $TOKEN" -o signed/reuse.xpi "$DOWNLOAD_URL"
            SIGNED_XPI="signed/reuse.xpi"
          else
            echo "::error::AMO signing failed with exit code $STATUS; see /tmp/amo-sign.log." >&2
            exit 1
          fi

          cp "$SIGNED_XPI" "release/${{ inputs.artifactPrefix }}-v2.xpi"
          echo "Replaced unsigned V2 .xpi with AMO-signed artifact:"
          ls -l "release/${{ inputs.artifactPrefix }}-v2.xpi"
      - name: Regenerate Checksums
        run: |
          cd release
          for file in *.zip *.xpi *.crx; do
            [ -f "$file" ] && sha256sum --binary "$file"
          done > SHA256SUMS.txt
          sha256sum --check --quiet SHA256SUMS.txt
      - name: Publish Release
        run: |
          RELEASE_NAME="${{ inputs.releaseName }}"
          RELEASE_TITLE="${{ inputs.releaseTitle }}"
          NOTES_FILE="${{ inputs.package }}/docs/DOWNLOADS.md"
          RELEASE_NOTES="release-notes.md"
          {
            echo "Auto-built Extension from commit ${{ github.sha }}"
            if [[ -f "$NOTES_FILE" ]]; then
              echo ""
              echo "---"
              echo ""
              cat "$NOTES_FILE"
            fi
          } > "$RELEASE_NOTES"
          mapfile -d '' -t files < <(find release -type f -print0 | sort -z)
          gh release delete "$RELEASE_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            "${files[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
