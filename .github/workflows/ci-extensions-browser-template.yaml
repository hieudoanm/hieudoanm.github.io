name: CI - Extensions - Browser - Template

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: Extension directory, e.g. packages/extensions/browser/instax
      filter:
        required: true
        type: string
        description: pnpm filter, e.g. @hieudoanm.github.io/instax
      releaseName:
        required: true
        type: string
        description: GitHub release tag, e.g. extensions-browser-instax-latest
      releaseTitle:
        required: true
        type: string
        description: GitHub release title, e.g. Extensions - Browser - InstaX (latest)
      artifactPrefix:
        required: true
        type: string
        description: Artifact name prefix, e.g. instax

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Cache pnpm
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: '11.24.0'
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build --filter=${{ inputs.filter }}
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-build
          path: ${{ inputs.package }}/download/
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: [build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-build
          path: artifacts
      - name: Collect Release Artifacts
        run: |
          mkdir -p release
          cp artifacts/README.md release/ 2>/dev/null || true
          for ver in v2 v3; do
            for file in artifacts/$ver/*; do
              [ -f "$file" ] || continue
              base="$(basename "$file")"
              name="${base%.*}-${ver}.${base##*.}"
              cp "$file" "release/$name"
            done
          done
          cd release
          for file in *.zip *.xpi *.crx; do
            [ -f "$file" ] && sha256sum --binary "$file"
          done > SHA256SUMS.txt
          sha256sum --check --quiet SHA256SUMS.txt
      - name: Publish Release
        run: |
          RELEASE_NAME="${{ inputs.releaseName }}"
          RELEASE_TITLE="${{ inputs.releaseTitle }}"
          NOTES_FILE="${{ inputs.package }}/docs/DOWNLOADS.md"
          RELEASE_NOTES="release-notes.md"
          {
            echo "Auto-built Extension from commit ${{ github.sha }}"
            if [[ -f "$NOTES_FILE" ]]; then
              echo ""
              echo "---"
              echo ""
              cat "$NOTES_FILE"
            fi
          } > "$RELEASE_NOTES"
          mapfile -d '' -t files < <(find release -type f -print0 | sort -z)
          gh release delete "$RELEASE_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            "${files[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
