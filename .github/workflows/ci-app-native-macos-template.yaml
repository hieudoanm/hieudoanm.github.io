name: CI - App - Native - macOS - Template

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: macOS project directory, e.g. packages/app/native/snap/apple/macos
      releaseName:
        required: true
        type: string
        description: GitHub release tag, e.g. app-native-macos-snap-latest
      releaseTitle:
        required: true
        type: string
        description: GitHub release title, e.g. App - Native - macOS - Snap (latest)
      artifactPrefix:
        required: true
        type: string
        description: Artifact name prefix, e.g. macos-snap

jobs:
  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Build Release
        run: make build
      - name: Create App Bundle
        run: make app
      - name: Create DMG
        run: make dmg
      - name: Zip App
        run: cd build && zip -r -y ${{ inputs.artifactPrefix }}.app.zip *.app
      - name: Upload App
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-app
          path: ${{ inputs.package }}/build/*.app.zip
      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-dmg
          path: ${{ inputs.package }}/build/*.dmg

  publish:
    name: Publish to GitHub Release
    needs: [build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Download App
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-app
          path: artifacts/app
      - name: Download DMG
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-dmg
          path: artifacts/dmg
      - name: Publish Release
        run: |
          gh release delete ${{ inputs.releaseName }} --yes --cleanup-tag 2>/dev/null || true
          gh release create ${{ inputs.releaseName }} \
            --title "${{ inputs.releaseTitle }}" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            artifacts/app/*.zip artifacts/dmg/*.dmg
        env:
          GH_TOKEN: ${{ github.token }}
