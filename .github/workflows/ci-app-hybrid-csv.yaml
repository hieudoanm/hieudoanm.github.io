name: CI - App - Hybrid - CSV

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/hybrid/csv/**'
      - '.github/workflows/ci-app-hybrid-csv.yaml'
      - '.github/workflows/ci-app-hybrid-template.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-hybrid-csv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-hybrid-template.yaml
    with:
      package: packages/app/hybrid/csv
      filter: '@hieudoanm.github.io/csv'
      releaseName: app-hybrid-csv-latest
      releaseTitle: App - Hybrid - CSV (latest)
      artifactPrefix: csv
