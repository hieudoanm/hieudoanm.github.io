name: CI - App - Hybrid - Template

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: Package directory, e.g. packages/app/hybrid/api
      filter:
        required: true
        type: string
        description: pnpm filter, e.g. @hieudoanm.github.io/api
      releaseName:
        required: true
        type: string
        description: GitHub release tag, e.g. app-hybrid-api-latest
      releaseTitle:
        required: true
        type: string
        description: GitHub release title, e.g. App - Hybrid - API (latest)
      artifactPrefix:
        required: true
        type: string
        description: Artifact name prefix, e.g. api
      needsEnv:
        required: false
        type: boolean
        default: false
        description: Whether the build needs an EXPORT=true .env file

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Cache pnpm
        uses: actions/cache@v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: '11.23.0'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Environment
        if: inputs.needsEnv
        run: echo 'EXPORT=true' >> ${{ inputs.package }}/.env
      - name: Lint
        run: pnpm run lint --filter=${{ inputs.filter }}
      - name: Build
        run: pnpm run build --filter=${{ inputs.filter }}
      - name: Test
        run: pnpm run test --filter=${{ inputs.filter }}
      - name: Upload Build Output
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-out
          path: ${{ inputs.package }}/out/
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: [build]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: '11.23.0'
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install Tauri Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Tauri CLI
        run: pnpm add -D @tauri-apps/cli
      - name: Download Build Output
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-out
          path: ${{ inputs.package }}/out/
      - name: Build Tauri Desktop
        working-directory: ${{ inputs.package }}
        shell: bash
        run: pnpm exec tauri build --ci --config '{"build":{"beforeBuildCommand":""}}'
      - name: Zip App Bundle for macOS
        if: runner.os == 'macOS'
        working-directory: ${{ inputs.package }}/src-tauri/target/release/bundle/macos
        run: |
          shopt -s nullglob
          for app in *.app; do
            zip -r -y "${app}.zip" "$app"
          done
      - name: Set Date
        id: date
        run: echo "value=$(date +'%Y_%m_%d')" >> "$GITHUB_OUTPUT"
      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}_desktop_${{ matrix.os }}-${{ steps.date.outputs.value }}
          path: ${{ inputs.package }}/src-tauri/target/release/bundle/

  android:
    name: Mobile (Android)
    needs: [build]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: '11.23.0'
      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install Tauri CLI
        run: pnpm add -D @tauri-apps/cli
      - name: Install Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4.0.1
      - name: Install Rust Targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android
      - name: Download Build Output
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifactPrefix }}-out
          path: ${{ inputs.package }}/out/
      - name: Init Android Project
        working-directory: ${{ inputs.package }}
        run: pnpm exec tauri android init
      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=, OU=, O=, L=, S=, C="
      - name: Build Android APK & AAB
        working-directory: ${{ inputs.package }}
        run: pnpm exec tauri android build --ci --config '{"build":{"beforeBuildCommand":""}}'
      - name: Sign APK
        run: |
          ANDROID_BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$ANDROID_BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias release \
            ${{ inputs.package }}/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          mv ${{ inputs.package }}/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
             ${{ inputs.package }}/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
      - name: Set Date
        id: date
        run: echo "value=$(date +'%Y_%m_%d')" >> "$GITHUB_OUTPUT"
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.artifactPrefix }}_android-${{ steps.date.outputs.value }}
          path: ${{ inputs.package }}/src-tauri/gen/android/app/build/outputs/

  publish:
    name: Publish to GitHub Release
    needs: [desktop, android]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Collect Release Artifacts
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            find "$dir" -type f \( \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.dmg" -o \
              -name "*.zip" -o \
              -name "*.tar.xz" -o \
              -name "*.msi" -o \
              -name "*.exe" -o \
              -name "*.apk" -o \
              -name "*.aab" \
            \) ! -name "*control.tar.gz" ! -name "*data.tar.gz" -print0 |
              while IFS= read -r -d '' file; do
                cp "$file" release/
              done
          done
          for file in release/*; do
            base="$(basename "$file")"
            normalized="$(printf '%s' "$base" | sed -E 's/_v?[0-9]+\.[0-9]+\.[0-9]+_/_/; s/_x64_en-US\.msi$/_x64.msi/')"
            if [[ "$base" != "$normalized" ]]; then
              mv "$file" "release/$normalized"
            fi
          done
          cd release
          for file in ./*; do
            if [[ "$file" != "./SHA256SUMS.txt" ]]; then
              sha256sum --binary "${file#./}"
            fi
          done > SHA256SUMS.txt
          sha256sum --check --quiet SHA256SUMS.txt
      - name: Publish Release
        run: |
          RELEASE_NAME="${{ inputs.releaseName }}"
          RELEASE_TITLE="${{ inputs.releaseTitle }}"
          NOTES_FILE="${{ inputs.package }}/docs/DOWNLOADS.md"
          RELEASE_NOTES="release-notes.md"
          {
            echo "Auto-built from commit ${{ github.sha }}"
            if [[ -f "$NOTES_FILE" ]]; then
              echo ""
              echo "---"
              echo ""
              cat "$NOTES_FILE"
            fi
          } > "$RELEASE_NOTES"
          mapfile -d '' -t files < <(find release -type f -print0 | sort -z)
          gh release delete "$RELEASE_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            "${files[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
