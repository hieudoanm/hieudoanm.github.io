name: CI - App - Hybrid - Social Networking - Chat

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'hotfix/**'
      - 'feature/**'
      - 'renovate/**'
      - 'dependabot/**'
    paths:
      - 'packages/app/hybrid/social-networking/chat/**'
      - '.github/workflows/ci-app-hybrid-social-networking-chat.yaml'
      - '.github/workflows/ci-app-hybrid-template.yaml'

permissions:
  contents: write

concurrency:
  group: ci-app-hybrid-social-networking-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-app-hybrid-template.yaml
    with:
      package: packages/app/hybrid/social-networking/chat
      filter: '@hieudoanm.github.io/chat'
      releaseName: app-hybrid-social-networking-chat-latest
      releaseTitle: App - Hybrid - Social Networking - Chat (latest)
      artifactPrefix: social-networking-chat
