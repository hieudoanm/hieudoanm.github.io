<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 359.59 285.42" width="359.59" height="285.42" role="img" aria-labelledby="greece-title greece-desc">
  <title id="greece-title">Greece hex map</title>
  <desc id="greece-desc">Hexagon map with 14 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.40; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 11.87 8.48; }
    .label { fill: #52525b; font: 600 9.61px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="AN">
