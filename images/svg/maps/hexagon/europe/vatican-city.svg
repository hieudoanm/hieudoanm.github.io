<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 79.29 88.40" width="79.29" height="88.40" role="img" aria-labelledby="vatican-city-title vatican-city-desc">
  <title id="vatican-city-title">Vatican City hex map</title>
  <desc id="vatican-city-desc">Hexagon map with 1 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="VAT">
    <title>Vatican</title>
    <polygon class="tile" points="39.64,10.20 69.09,27.20 69.09,61.20 39.64,78.20 10.20,61.20 10.20,27.20" aria-label="Vatican"/>
    <text class="label" x="39.64" y="44.20">VAT</text>
  </g>
</svg>
