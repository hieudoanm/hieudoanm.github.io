<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 357.71 328.67" width="357.71" height="328.67" role="img" aria-labelledby="netherlands-title netherlands-desc">
  <title id="netherlands-title">Netherlands hex map</title>
  <desc id="netherlands-desc">Hexagon map with 15 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.77; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 13.67 9.76; }
    .label { fill: #52525b; font: 600 11.06px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="GR">
    <title>Groningen</title>
    <polygon class="tile" points="319.76,9.76 347.94,26.03 347.94,58.57 319.76,74.85 291.58,58.57 291.58,26.03" aria-label="Groningen"/>
    <text class="label" x="319.76" y="42.30">GR</text>
  </g>
  <g class="state" data-state="OV">
