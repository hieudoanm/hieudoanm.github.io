<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314.85 292.40" width="314.85" height="292.40" role="img" aria-labelledby="finland-title finland-desc">
  <title id="finland-title">Finland hex map</title>
  <desc id="finland-desc">Hexagon map with 18 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="NK">
    <title>North Karelia</title>
    <polygon class="tile" points="275.20,61.20 304.65,78.20 304.65,112.20 275.20,129.20 245.76,112.20 245.76,78.20" aria-label="North Karelia"/>
    <text class="label" x="275.20" y="95.20">NK</text>
  </g>
  <g class="state" data-state="KAI">
    <title>Kainuu</title>
