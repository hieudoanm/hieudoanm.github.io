<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255.96 241.40" width="255.96" height="241.40" role="img" aria-labelledby="lithuania-title lithuania-desc">
  <title id="lithuania-title">Lithuania hex map</title>
  <desc id="lithuania-desc">Hexagon map with 10 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="UT">
    <title>Utenos</title>
    <polygon class="tile" points="216.31,61.20 245.76,78.20 245.76,112.20 216.31,129.20 186.87,112.20 186.87,78.20" aria-label="Utenos"/>
    <text class="label" x="216.31" y="95.20">UT</text>
  </g>
  <g class="state" data-state="PN">
    <title>Panevezio</title>
    <polygon class="tile" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Panevezio"/>
    <text class="label" x="186.87" y="44.20">PN</text>
  </g>
  <g class="state" data-state="VL">
    <title>Vilniaus</title>
