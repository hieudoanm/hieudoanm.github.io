    <text class="label" x="157.42" y="95.20">KU</text>
  </g>
  <g class="state" data-state="AL">
    <title>Alytaus</title>
    <polygon class="tile" points="157.42,163.20 186.87,180.20 186.87,214.20 157.42,231.20 127.98,214.20 127.98,180.20" aria-label="Alytaus"/>
    <text class="label" x="157.42" y="197.20">AL</text>
  </g>
  <g class="state" data-state="SA">
