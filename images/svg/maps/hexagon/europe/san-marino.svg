<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.07 241.40" width="197.07" height="241.40" role="img" aria-labelledby="san-marino-title san-marino-desc">
  <title id="san-marino-title">San Marino hex map</title>
  <desc id="san-marino-desc">Hexagon map with 9 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="DOM">
    <title>Domagnano</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Domagnano"/>
    <text class="label" x="157.42" y="95.20">DOM</text>
  </g>
  <g class="state" data-state="MON">
    <title>Montegiardino</title>
    <polygon class="tile" points="157.42,163.20 186.87,180.20 186.87,214.20 157.42,231.20 127.98,214.20 127.98,180.20" aria-label="Montegiardino"/>
    <text class="label" x="157.42" y="197.20">MON</text>
  </g>
  <g class="state" data-state="SER">
    <title>Serravalle</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="Serravalle"/>
    <text class="label" x="127.98" y="44.20">SER</text>
  </g>
  <g class="state" data-state="FAE">
    <title>Faetano</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Faetano"/>
    <text class="label" x="127.98" y="146.20">FAE</text>
  </g>
  <g class="state" data-state="BM">
    <title>Borgo Maggiore</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Borgo Maggiore"/>
    <text class="label" x="98.53" y="95.20">BM</text>
  </g>
  <g class="state" data-state="FIO">
    <title>Fiorentino</title>
    <polygon class="tile" points="98.53,163.20 127.98,180.20 127.98,214.20 98.53,231.20 69.09,214.20 69.09,180.20" aria-label="Fiorentino"/>
    <text class="label" x="98.53" y="197.20">FIO</text>
  </g>
  <g class="state" data-state="SM">
    <title>San Marino</title>
    <polygon class="tile" points="69.09,112.20 98.53,129.20 98.53,163.20 69.09,180.20 39.64,163.20 39.64,129.20" aria-label="San Marino"/>
    <text class="label" x="69.09" y="146.20">SM</text>
  </g>
  <g class="state" data-state="ACQ">
    <title>Acquaviva</title>
    <polygon class="tile" points="39.64,61.20 69.09,78.20 69.09,112.20 39.64,129.20 10.20,112.20 10.20,78.20" aria-label="Acquaviva"/>
    <text class="label" x="39.64" y="95.20">ACQ</text>
  </g>
  <g class="state" data-state="CHI">
    <title>Chiesanuova</title>
    <polygon class="tile" points="39.64,163.20 69.09,180.20 69.09,214.20 39.64,231.20 10.20,214.20 10.20,180.20" aria-label="Chiesanuova"/>
    <text class="label" x="39.64" y="197.20">CHI</text>
  </g>
</svg>
