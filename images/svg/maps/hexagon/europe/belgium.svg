<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285.40 190.40" width="285.40" height="190.40" role="img" aria-labelledby="belgium-title belgium-desc">
  <title id="belgium-title">Belgium hex map</title>
  <desc id="belgium-desc">Hexagon map with 11 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="WLG">
    <title>Liege</title>
    <polygon class="tile" points="245.76,61.20 275.20,78.20 275.20,112.20 245.76,129.20 216.31,112.20 216.31,78.20" aria-label="Liege"/>
    <text class="label" x="245.76" y="95.20">WLG</text>
  </g>
  <g class="state" data-state="VLI">
    <title>Limburg</title>
    <polygon class="tile" points="216.31,10.20 245.76,27.20 245.76,61.20 216.31,78.20 186.87,61.20 186.87,27.20" aria-label="Limburg"/>
    <text class="label" x="216.31" y="44.20">VLI</text>
  </g>
  <g class="state" data-state="WLX">
    <title>Luxembourg</title>
    <polygon class="tile" points="216.31,112.20 245.76,129.20 245.76,163.20 216.31,180.20 186.87,163.20 186.87,129.20" aria-label="Luxembourg"/>
    <text class="label" x="216.31" y="146.20">WLX</text>
  </g>
  <g class="state" data-state="VBR">
    <title>Flemish Brabant</title>
    <polygon class="tile" points="186.87,61.20 216.31,78.20 216.31,112.20 186.87,129.20 157.42,112.20 157.42,78.20" aria-label="Flemish Brabant"/>
    <text class="label" x="186.87" y="95.20">VBR</text>
  </g>
  <g class="state" data-state="VAN">
    <title>Antwerp</title>
    <polygon class="tile" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="Antwerp"/>
    <text class="label" x="157.42" y="44.20">VAN</text>
  </g>
  <g class="state" data-state="WNA">
    <title>Namur</title>
    <polygon class="tile" points="157.42,112.20 186.87,129.20 186.87,163.20 157.42,180.20 127.98,163.20 127.98,129.20" aria-label="Namur"/>
    <text class="label" x="157.42" y="146.20">WNA</text>
  </g>
  <g class="state" data-state="WHT">
    <title>Hainaut</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Hainaut"/>
    <text class="label" x="127.98" y="95.20">WHT</text>
  </g>
  <g class="state" data-state="VOV">
    <title>East Flanders</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="East Flanders"/>
    <text class="label" x="98.53" y="44.20">VOV</text>
  </g>
  <g class="state" data-state="WBR">
    <title>Walloon Brabant</title>
    <polygon class="tile" points="98.53,112.20 127.98,129.20 127.98,163.20 98.53,180.20 69.09,163.20 69.09,129.20" aria-label="Walloon Brabant"/>
    <text class="label" x="98.53" y="146.20">WBR</text>
  </g>
  <g class="state" data-state="VWV">
    <title>West Flanders</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="West Flanders"/>
    <text class="label" x="69.09" y="95.20">VWV</text>
  </g>
  <g class="state" data-state="BRU">
    <title>Brussels</title>
    <polygon class="tile" points="39.64,10.20 69.09,27.20 69.09,61.20 39.64,78.20 10.20,61.20 10.20,27.20" aria-label="Brussels"/>
    <text class="label" x="39.64" y="44.20">BRU</text>
  </g>
</svg>
