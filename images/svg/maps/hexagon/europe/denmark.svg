<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 190.40" width="226.51" height="190.40" role="img" aria-labelledby="denmark-title denmark-desc">
  <title id="denmark-title">Denmark hex map</title>
  <desc id="denmark-desc">Hexagon map with 5 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="SJA">
    <title>Sjaælland</title>
    <polygon class="tile inset" points="186.87,112.20 216.31,129.20 216.31,163.20 186.87,180.20 157.42,163.20 157.42,129.20" aria-label="Sjaælland"/>
    <text class="label" x="186.87" y="146.20">SJA</text>
  </g>
  <g class="state" data-state="HOV">
    <title>Hovedstaden</title>
    <polygon class="tile inset" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Hovedstaden"/>
    <text class="label" x="186.87" y="44.20">HOV</text>
  </g>
  <g class="state" data-state="SYD">
    <title>Syddanmark</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Syddanmark"/>
    <text class="label" x="98.53" y="95.20">SYD</text>
  </g>
  <g class="state" data-state="NOR">
    <title>Nordjylland</title>
    <polygon class="tile" points="69.09,10.20 98.53,27.20 98.53,61.20 69.09,78.20 39.64,61.20 39.64,27.20" aria-label="Nordjylland"/>
    <text class="label" x="69.09" y="44.20">NOR</text>
  </g>
  <g class="state" data-state="MID">
    <title>Midtjylland</title>
    <polygon class="tile" points="39.64,61.20 69.09,78.20 69.09,112.20 39.64,129.20 10.20,112.20 10.20,78.20" aria-label="Midtjylland"/>
    <text class="label" x="39.64" y="95.20">MID</text>
  </g>
</svg>
