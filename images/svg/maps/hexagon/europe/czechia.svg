<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314.85 241.40" width="314.85" height="241.40" role="img" aria-labelledby="czechia-title czechia-desc">
  <title id="czechia-title">Czechia hex map</title>
  <desc id="czechia-desc">Hexagon map with 14 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="MO">
    <title>Moravskoslezský</title>
    <polygon class="tile" points="275.20,112.20 304.65,129.20 304.65,163.20 275.20,180.20 245.76,163.20 245.76,129.20" aria-label="Moravskoslezský"/>
    <text class="label" x="275.20" y="146.20">MO</text>
  </g>
  <g class="state" data-state="OL">
    <title>Olomoucký</title>
