<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344.29 190.40" width="344.29" height="190.40" role="img" aria-labelledby="austria-title austria-desc">
  <title id="austria-title">Austria hex map</title>
  <desc id="austria-desc">Hexagon map with 9 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="WI">
    <title>Wien</title>
    <polygon class="tile" points="304.65,10.20 334.09,27.20 334.09,61.20 304.65,78.20 275.20,61.20 275.20,27.20" aria-label="Wien"/>
    <text class="label" x="304.65" y="44.20">WI</text>
  </g>
  <g class="state" data-state="BU">
    <title>Burgenland</title>
    <polygon class="tile" points="275.20,61.20 304.65,78.20 304.65,112.20 275.20,129.20 245.76,112.20 245.76,78.20" aria-label="Burgenland"/>
    <text class="label" x="275.20" y="95.20">BU</text>
  </g>
  <g class="state" data-state="NO">
    <title>Niederösterreich</title>
    <polygon class="tile" points="245.76,10.20 275.20,27.20 275.20,61.20 245.76,78.20 216.31,61.20 216.31,27.20" aria-label="Niederösterreich"/>
    <text class="label" x="245.76" y="44.20">NO</text>
  </g>
  <g class="state" data-state="ST">
    <title>Steiermark</title>
    <polygon class="tile" points="216.31,61.20 245.76,78.20 245.76,112.20 216.31,129.20 186.87,112.20 186.87,78.20" aria-label="Steiermark"/>
    <text class="label" x="216.31" y="95.20">ST</text>
  </g>
  <g class="state" data-state="OO">
    <title>Oberösterreich</title>
    <polygon class="tile" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Oberösterreich"/>
    <text class="label" x="186.87" y="44.20">OO</text>
  </g>
  <g class="state" data-state="KA">
    <title>Kärnten</title>
    <polygon class="tile" points="186.87,112.20 216.31,129.20 216.31,163.20 186.87,180.20 157.42,163.20 157.42,129.20" aria-label="Kärnten"/>
    <text class="label" x="186.87" y="146.20">KA</text>
  </g>
  <g class="state" data-state="SZ">
    <title>Salzburg</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Salzburg"/>
    <text class="label" x="157.42" y="95.20">SZ</text>
  </g>
  <g class="state" data-state="TR">
    <title>Tirol</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Tirol"/>
    <text class="label" x="98.53" y="95.20">TR</text>
  </g>
  <g class="state" data-state="VO">
    <title>Vorarlberg</title>
    <polygon class="tile" points="39.64,61.20 69.09,78.20 69.09,112.20 39.64,129.20 10.20,112.20 10.20,78.20" aria-label="Vorarlberg"/>
    <text class="label" x="39.64" y="95.20">VO</text>
  </g>
</svg>
