<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 241.40" width="226.51" height="241.40" role="img" aria-labelledby="pakistan-title pakistan-desc">
  <title id="pakistan-title">Pakistan hex map</title>
  <desc id="pakistan-desc">Hexagon map with 8 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="GB">
    <title>Northern Areas</title>
    <polygon class="tile" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Northern Areas"/>
    <text class="label" x="186.87" y="44.20">GB</text>
  </g>
  <g class="state" data-state="JK">
    <title>Azad Kashmir</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Azad Kashmir"/>
    <text class="label" x="157.42" y="95.20">JK</text>
  </g>
  <g class="state" data-state="KP">
    <title>K.P.</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="K.P."/>
    <text class="label" x="127.98" y="44.20">KP</text>
  </g>
  <g class="state" data-state="PB">
    <title>Punjab</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Punjab"/>
    <text class="label" x="127.98" y="146.20">PB</text>
  </g>
  <g class="state" data-state="IS">
    <title>F.C.T.</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="F.C.T."/>
    <text class="label" x="98.53" y="95.20">IS</text>
  </g>
  <g class="state" data-state="SD">
    <title>Sind</title>
    <polygon class="tile" points="98.53,163.20 127.98,180.20 127.98,214.20 98.53,231.20 69.09,214.20 69.09,180.20" aria-label="Sind"/>
    <text class="label" x="98.53" y="197.20">SD</text>
  </g>
  <g class="state" data-state="TA">
    <title>F.A.T.A.</title>
    <polygon class="tile" points="69.09,112.20 98.53,129.20 98.53,163.20 69.09,180.20 39.64,163.20 39.64,129.20" aria-label="F.A.T.A."/>
    <text class="label" x="69.09" y="146.20">TA</text>
  </g>
  <g class="state" data-state="BA">
    <title>Baluchistan</title>
    <polygon class="tile" points="39.64,163.20 69.09,180.20 69.09,214.20 39.64,231.20 10.20,214.20 10.20,180.20" aria-label="Baluchistan"/>
    <text class="label" x="39.64" y="197.20">BA</text>
  </g>
</svg>
