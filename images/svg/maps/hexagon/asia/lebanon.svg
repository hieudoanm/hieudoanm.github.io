<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.07 190.40" width="197.07" height="190.40" role="img" aria-labelledby="lebanon-title lebanon-desc">
  <title id="lebanon-title">Lebanon hex map</title>
  <desc id="lebanon-desc">Hexagon map with 6 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="AS">
    <title>North Lebanon</title>
    <polygon class="tile" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="North Lebanon"/>
    <text class="label" x="157.42" y="44.20">AS</text>
  </g>
  <g class="state" data-state="BI">
    <title>Beqaa</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Beqaa"/>
    <text class="label" x="127.98" y="95.20">BI</text>
  </g>
  <g class="state" data-state="JL">
    <title>Mount Lebanon</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Mount Lebanon"/>
    <text class="label" x="98.53" y="44.20">JL</text>
  </g>
  <g class="state" data-state="NA">
    <title>An Nabatiyah</title>
    <polygon class="tile" points="98.53,112.20 127.98,129.20 127.98,163.20 98.53,180.20 69.09,163.20 69.09,129.20" aria-label="An Nabatiyah"/>
    <text class="label" x="98.53" y="146.20">NA</text>
  </g>
  <g class="state" data-state="JA">
    <title>South Lebanon</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="South Lebanon"/>
    <text class="label" x="69.09" y="95.20">JA</text>
  </g>
  <g class="state" data-state="BA">
    <title>Beirut</title>
    <polygon class="tile" points="39.64,112.20 69.09,129.20 69.09,163.20 39.64,180.20 10.20,163.20 10.20,129.20" aria-label="Beirut"/>
    <text class="label" x="39.64" y="146.20">BA</text>
  </g>
</svg>
