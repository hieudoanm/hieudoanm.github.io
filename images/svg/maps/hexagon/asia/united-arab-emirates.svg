    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Sharjah"/>
    <text class="label" x="98.53" y="95.20">SH</text>
  </g>
