    <text class="label" x="127.98" y="44.20">UQ</text>
  </g>
  <g class="state" data-state="NZ">
    <title>Neutral Zone</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Neutral Zone"/>
    <text class="label" x="127.98" y="146.20">NZ</text>
  </g>
  <g class="state" data-state="SH">
