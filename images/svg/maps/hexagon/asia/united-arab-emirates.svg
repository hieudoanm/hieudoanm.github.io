<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 190.40" width="226.51" height="190.40" role="img" aria-labelledby="united-arab-emirates-title united-arab-emirates-desc">
  <title id="united-arab-emirates-title">United Arab Emirates hex map</title>
  <desc id="united-arab-emirates-desc">Hexagon map with 9 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="AJ">
    <title>Ajman</title>
    <polygon class="tile" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Ajman"/>
    <text class="label" x="186.87" y="44.20">AJ</text>
  </g>
  <g class="state" data-state="NZA">
    <title>Neutral Zone</title>
    <polygon class="tile" points="186.87,112.20 216.31,129.20 216.31,163.20 186.87,180.20 157.42,163.20 157.42,129.20" aria-label="Neutral Zone"/>
    <text class="label" x="186.87" y="146.20">NZA</text>
  </g>
  <g class="state" data-state="FU">
    <title>Fujayrah</title>
