<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 357.71 279.86" width="357.71" height="279.86" role="img" aria-labelledby="malaysia-title malaysia-desc">
  <title id="malaysia-title">Malaysia hex map</title>
  <desc id="malaysia-desc">Hexagon map with 16 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.77; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 13.67 9.76; }
    .label { fill: #52525b; font: 600 11.06px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="SK">
    <title>Sarawak</title>
    <polygon class="tile inset" points="319.76,107.39 347.94,123.66 347.94,156.20 319.76,172.47 291.58,156.20 291.58,123.66" aria-label="Sarawak"/>
    <text class="label" x="319.76" y="139.93">SK</text>
  </g>
