<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344.29 190.40" width="344.29" height="190.40" role="img" aria-labelledby="uzbekistan-title uzbekistan-desc">
  <title id="uzbekistan-title">Uzbekistan hex map</title>
  <desc id="uzbekistan-desc">Hexagon map with 14 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="TK">
    <title>Tashkent</title>
    <polygon class="tile" points="304.65,10.20 334.09,27.20 334.09,61.20 304.65,78.20 275.20,61.20 275.20,27.20" aria-label="Tashkent"/>
    <text class="label" x="304.65" y="44.20">TK</text>
  </g>
  <g class="state" data-state="AN">
