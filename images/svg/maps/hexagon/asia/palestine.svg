<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138.18 190.40" width="138.18" height="190.40" role="img" aria-labelledby="palestine-title palestine-desc">
  <title id="palestine-title">Palestine hex map</title>
  <desc id="palestine-desc">Hexagon map with 2 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="WBK">
    <title>West Bank</title>
    <polygon class="tile inset" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="West Bank"/>
    <text class="label" x="98.53" y="44.20">WBK</text>
  </g>
  <g class="state" data-state="GZZ">
    <title>Gaza Strip</title>
    <polygon class="tile" points="39.64,112.20 69.09,129.20 69.09,163.20 39.64,180.20 10.20,163.20 10.20,129.20" aria-label="Gaza Strip"/>
    <text class="label" x="39.64" y="146.20">GZZ</text>
  </g>
</svg>
