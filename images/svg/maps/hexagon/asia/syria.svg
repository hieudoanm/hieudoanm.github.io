<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314.85 241.40" width="314.85" height="241.40" role="img" aria-labelledby="syria-title syria-desc">
  <title id="syria-title">Syria hex map</title>
  <desc id="syria-desc">Hexagon map with 15 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="HA">
    <title>Hasaka (Al Haksa)</title>
    <polygon class="tile" points="275.20,10.20 304.65,27.20 304.65,61.20 275.20,78.20 245.76,61.20 245.76,27.20" aria-label="Hasaka (Al Haksa)"/>
    <text class="label" x="275.20" y="44.20">HA</text>
  </g>
  <g class="state" data-state="DY">
    <title>Dayr Az Zawr</title>
    <polygon class="tile" points="245.76,61.20 275.20,78.20 275.20,112.20 245.76,129.20 216.31,112.20 216.31,78.20" aria-label="Dayr Az Zawr"/>
    <text class="label" x="245.76" y="95.20">DY</text>
  </g>
