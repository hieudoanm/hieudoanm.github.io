  <title id="maldives-title">Maldives hex map</title>
  <desc id="maldives-desc">Hexagon map with 21 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 1.90; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 9.40 6.71; }
    .label { fill: #52525b; font: 600 7.61px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
