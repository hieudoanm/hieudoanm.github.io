<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255.96 190.40" width="255.96" height="190.40" role="img" aria-labelledby="kyrgyzstan-title kyrgyzstan-desc">
  <title id="kyrgyzstan-title">Kyrgyzstan hex map</title>
  <desc id="kyrgyzstan-desc">Hexagon map with 8 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="YK">
    <title>Ysyk-Köl</title>
    <polygon class="tile" points="216.31,10.20 245.76,27.20 245.76,61.20 216.31,78.20 186.87,61.20 186.87,27.20" aria-label="Ysyk-Köl"/>
    <text class="label" x="216.31" y="44.20">YK</text>
  </g>
  <g class="state" data-state="NA">
    <title>Naryn</title>
    <polygon class="tile" points="186.87,61.20 216.31,78.20 216.31,112.20 186.87,129.20 157.42,112.20 157.42,78.20" aria-label="Naryn"/>
    <text class="label" x="186.87" y="95.20">NA</text>
  </g>
  <g class="state" data-state="GB">
    <title>Bishkek</title>
    <polygon class="tile" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="Bishkek"/>
    <text class="label" x="157.42" y="44.20">GB</text>
  </g>
  <g class="state" data-state="CHU">
    <title>Chuy</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Chuy"/>
    <text class="label" x="127.98" y="95.20">CHU</text>
  </g>
  <g class="state" data-state="TL">
    <title>Talas</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Talas"/>
    <text class="label" x="98.53" y="44.20">TL</text>
  </g>
  <g class="state" data-state="OS">
    <title>Osh</title>
    <polygon class="tile" points="98.53,112.20 127.98,129.20 127.98,163.20 98.53,180.20 69.09,163.20 69.09,129.20" aria-label="Osh"/>
    <text class="label" x="98.53" y="146.20">OS</text>
  </g>
  <g class="state" data-state="DA">
    <title>Jalal-Abad</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="Jalal-Abad"/>
    <text class="label" x="69.09" y="95.20">DA</text>
  </g>
  <g class="state" data-state="BA">
    <title>Batken</title>
    <polygon class="tile" points="39.64,112.20 69.09,129.20 69.09,163.20 39.64,180.20 10.20,163.20 10.20,129.20" aria-label="Batken"/>
    <text class="label" x="39.64" y="146.20">BA</text>
  </g>
</svg>
