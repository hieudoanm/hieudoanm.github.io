<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285.40 241.40" width="285.40" height="241.40" role="img" aria-labelledby="armenia-title armenia-desc">
  <title id="armenia-title">Armenia hex map</title>
  <desc id="armenia-desc">Hexagon map with 11 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="SU">
    <title>Syunik</title>
    <polygon class="tile" points="245.76,163.20 275.20,180.20 275.20,214.20 245.76,231.20 216.31,214.20 216.31,180.20" aria-label="Syunik"/>
    <text class="label" x="245.76" y="197.20">SU</text>
  </g>
  <g class="state" data-state="VD">
    <title>Vayots Dzor</title>
    <polygon class="tile" points="216.31,112.20 245.76,129.20 245.76,163.20 216.31,180.20 186.87,163.20 186.87,129.20" aria-label="Vayots Dzor"/>
    <text class="label" x="216.31" y="146.20">VD</text>
  </g>
  <g class="state" data-state="GR">
    <title>Gegharkunik</title>
    <polygon class="tile" points="186.87,61.20 216.31,78.20 216.31,112.20 186.87,129.20 157.42,112.20 157.42,78.20" aria-label="Gegharkunik"/>
    <text class="label" x="186.87" y="95.20">GR</text>
  </g>
  <g class="state" data-state="AV">
