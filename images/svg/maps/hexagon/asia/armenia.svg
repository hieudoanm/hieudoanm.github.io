    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Kotayk"/>
    <text class="label" x="127.98" y="95.20">KT</text>
  </g>
  <g class="state" data-state="LO">
    <title>Lori</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Lori"/>
