    <text class="label" x="186.87" y="197.20">AV</text>
  </g>
  <g class="state" data-state="TV">
    <title>Tavush</title>
    <polygon class="tile" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="Tavush"/>
    <text class="label" x="157.42" y="44.20">TV</text>
  </g>
  <g class="state" data-state="AR">
    <title>Ararat</title>
