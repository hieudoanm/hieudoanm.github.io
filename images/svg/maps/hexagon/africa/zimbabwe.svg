<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255.96 190.40" width="255.96" height="190.40" role="img" aria-labelledby="zimbabwe-title zimbabwe-desc">
  <title id="zimbabwe-title">Zimbabwe hex map</title>
  <desc id="zimbabwe-desc">Hexagon map with 10 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="MA">
    <title>Manicaland</title>
    <polygon class="tile" points="216.31,61.20 245.76,78.20 245.76,112.20 216.31,129.20 186.87,112.20 186.87,78.20" aria-label="Manicaland"/>
    <text class="label" x="216.31" y="95.20">MA</text>
  </g>
  <g class="state" data-state="HA">
    <title>Harare</title>
    <polygon class="tile" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Harare"/>
    <text class="label" x="186.87" y="44.20">HA</text>
  </g>
  <g class="state" data-state="MV">
    <title>Masvingo</title>
    <polygon class="tile" points="186.87,112.20 216.31,129.20 216.31,163.20 186.87,180.20 157.42,163.20 157.42,129.20" aria-label="Masvingo"/>
    <text class="label" x="186.87" y="146.20">MV</text>
  </g>
  <g class="state" data-state="ME">
    <title>Mashonaland East</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Mashonaland East"/>
    <text class="label" x="157.42" y="95.20">ME</text>
  </g>
  <g class="state" data-state="MC">
    <title>Mashonaland Central</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="Mashonaland Central"/>
    <text class="label" x="127.98" y="44.20">MC</text>
  </g>
  <g class="state" data-state="MS">
    <title>Matabeleland South</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Matabeleland South"/>
    <text class="label" x="127.98" y="146.20">MS</text>
  </g>
  <g class="state" data-state="MI">
    <title>Midlands</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Midlands"/>
    <text class="label" x="98.53" y="95.20">MI</text>
  </g>
  <g class="state" data-state="MW">
    <title>Mashonaland West</title>
    <polygon class="tile" points="69.09,10.20 98.53,27.20 98.53,61.20 69.09,78.20 39.64,61.20 39.64,27.20" aria-label="Mashonaland West"/>
    <text class="label" x="69.09" y="44.20">MW</text>
  </g>
  <g class="state" data-state="BU">
    <title>Bulawayo</title>
    <polygon class="tile" points="69.09,112.20 98.53,129.20 98.53,163.20 69.09,180.20 39.64,163.20 39.64,129.20" aria-label="Bulawayo"/>
    <text class="label" x="69.09" y="146.20">BU</text>
  </g>
  <g class="state" data-state="MN">
    <title>Matabeleland North</title>
    <polygon class="tile" points="39.64,61.20 69.09,78.20 69.09,112.20 39.64,129.20 10.20,112.20 10.20,78.20" aria-label="Matabeleland North"/>
    <text class="label" x="39.64" y="95.20">MN</text>
  </g>
</svg>
