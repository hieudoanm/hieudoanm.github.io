<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 139.40" width="226.51" height="139.40" role="img" aria-labelledby="gambia-title gambia-desc">
  <title id="gambia-title">Gambia hex map</title>
  <desc id="gambia-desc">Hexagon map with 6 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="UR">
    <title>Upper River</title>
    <polygon class="tile" points="186.87,61.20 216.31,78.20 216.31,112.20 186.87,129.20 157.42,112.20 157.42,78.20" aria-label="Upper River"/>
    <text class="label" x="186.87" y="95.20">UR</text>
  </g>
  <g class="state" data-state="MC">
    <title>Central River</title>
    <polygon class="tile" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="Central River"/>
    <text class="label" x="157.42" y="44.20">MC</text>
  </g>
  <g class="state" data-state="LR">
    <title>Lower River</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Lower River"/>
    <text class="label" x="127.98" y="95.20">LR</text>
  </g>
  <g class="state" data-state="NB">
    <title>North Bank</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="North Bank"/>
    <text class="label" x="98.53" y="44.20">NB</text>
  </g>
  <g class="state" data-state="WC">
    <title>West Coast</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="West Coast"/>
    <text class="label" x="69.09" y="95.20">WC</text>
  </g>
  <g class="state" data-state="BJ">
    <title>Banjul</title>
    <polygon class="tile" points="39.64,10.20 69.09,27.20 69.09,61.20 39.64,78.20 10.20,61.20 10.20,27.20" aria-label="Banjul"/>
    <text class="label" x="39.64" y="44.20">BJ</text>
  </g>
</svg>
