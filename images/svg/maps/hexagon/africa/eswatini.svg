<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 138.18 190.40" width="138.18" height="190.40" role="img" aria-labelledby="eswatini-title eswatini-desc">
  <title id="eswatini-title">Eswatini hex map</title>
  <desc id="eswatini-desc">Hexagon map with 4 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="LU">
    <title>Lubombo</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Lubombo"/>
    <text class="label" x="98.53" y="95.20">LU</text>
  </g>
  <g class="state" data-state="HH">
    <title>Hhohho</title>
    <polygon class="tile" points="69.09,10.20 98.53,27.20 98.53,61.20 69.09,78.20 39.64,61.20 39.64,27.20" aria-label="Hhohho"/>
    <text class="label" x="69.09" y="44.20">HH</text>
  </g>
  <g class="state" data-state="SH">
    <title>Shiselweni</title>
    <polygon class="tile" points="69.09,112.20 98.53,129.20 98.53,163.20 69.09,180.20 39.64,163.20 39.64,129.20" aria-label="Shiselweni"/>
    <text class="label" x="69.09" y="146.20">SH</text>
  </g>
  <g class="state" data-state="MA">
    <title>Manzini</title>
    <polygon class="tile" points="39.64,61.20 69.09,78.20 69.09,112.20 39.64,129.20 10.20,112.20 10.20,78.20" aria-label="Manzini"/>
    <text class="label" x="39.64" y="95.20">MA</text>
  </g>
</svg>
