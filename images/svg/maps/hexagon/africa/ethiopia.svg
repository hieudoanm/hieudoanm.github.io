<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255.96 241.40" width="255.96" height="241.40" role="img" aria-labelledby="ethiopia-title ethiopia-desc">
  <title id="ethiopia-title">Ethiopia hex map</title>
  <desc id="ethiopia-desc">Hexagon map with 11 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="DD">
    <title>Dire Dawa</title>
    <polygon class="tile" points="216.31,61.20 245.76,78.20 245.76,112.20 216.31,129.20 186.87,112.20 186.87,78.20" aria-label="Dire Dawa"/>
    <text class="label" x="216.31" y="95.20">DD</text>
  </g>
  <g class="state" data-state="HA">
    <title>Harari People</title>
    <polygon class="tile" points="216.31,163.20 245.76,180.20 245.76,214.20 216.31,231.20 186.87,214.20 186.87,180.20" aria-label="Harari People"/>
    <text class="label" x="216.31" y="197.20">HA</text>
  </g>
  <g class="state" data-state="SO">
    <title>Somali</title>
    <polygon class="tile" points="186.87,112.20 216.31,129.20 216.31,163.20 186.87,180.20 157.42,163.20 157.42,129.20" aria-label="Somali"/>
    <text class="label" x="186.87" y="146.20">SO</text>
  </g>
  <g class="state" data-state="AF">
    <title>Afar</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Afar"/>
    <text class="label" x="157.42" y="95.20">AF</text>
  </g>
  <g class="state" data-state="AA">
    <title>Addis Ababa</title>
    <polygon class="tile" points="157.42,163.20 186.87,180.20 186.87,214.20 157.42,231.20 127.98,214.20 127.98,180.20" aria-label="Addis Ababa"/>
    <text class="label" x="157.42" y="197.20">AA</text>
  </g>
  <g class="state" data-state="TI">
    <title>Tigray</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="Tigray"/>
    <text class="label" x="127.98" y="44.20">TI</text>
  </g>
  <g class="state" data-state="OR">
    <title>Oromiya</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Oromiya"/>
    <text class="label" x="127.98" y="146.20">OR</text>
  </g>
  <g class="state" data-state="AM">
    <title>Amhara</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Amhara"/>
    <text class="label" x="98.53" y="95.20">AM</text>
  </g>
  <g class="state" data-state="SN">
    <title>Southern Nations, Nationalities and Peoples</title>
