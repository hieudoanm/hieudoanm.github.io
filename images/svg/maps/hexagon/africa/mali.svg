<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255.96 190.40" width="255.96" height="190.40" role="img" aria-labelledby="mali-title mali-desc">
  <title id="mali-title">Mali hex map</title>
  <desc id="mali-desc">Hexagon map with 9 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="BKO">
    <title>Bamako</title>
    <polygon class="tile" points="216.31,61.20 245.76,78.20 245.76,112.20 216.31,129.20 186.87,112.20 186.87,78.20" aria-label="Bamako"/>
    <text class="label" x="216.31" y="95.20">BKO</text>
  </g>
  <g class="state" data-state="KD">
    <title>Kidal</title>
    <polygon class="tile" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Kidal"/>
    <text class="label" x="186.87" y="44.20">KD</text>
  </g>
  <g class="state" data-state="GA">
    <title>Gao</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Gao"/>
    <text class="label" x="157.42" y="95.20">GA</text>
  </g>
  <g class="state" data-state="TB">
    <title>Timbuktu</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="Timbuktu"/>
    <text class="label" x="127.98" y="44.20">TB</text>
  </g>
  <g class="state" data-state="SK">
    <title>Sikasso</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Sikasso"/>
    <text class="label" x="127.98" y="146.20">SK</text>
  </g>
  <g class="state" data-state="SG">
    <title>Ségou</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Ségou"/>
    <text class="label" x="98.53" y="95.20">SG</text>
  </g>
  <g class="state" data-state="MO">
    <title>Mopti</title>
    <polygon class="tile" points="69.09,10.20 98.53,27.20 98.53,61.20 69.09,78.20 39.64,61.20 39.64,27.20" aria-label="Mopti"/>
    <text class="label" x="69.09" y="44.20">MO</text>
  </g>
  <g class="state" data-state="KK">
    <title>Koulikoro</title>
    <polygon class="tile" points="69.09,112.20 98.53,129.20 98.53,163.20 69.09,180.20 39.64,163.20 39.64,129.20" aria-label="Koulikoro"/>
    <text class="label" x="69.09" y="146.20">KK</text>
  </g>
  <g class="state" data-state="KY">
    <title>Kayes</title>
    <polygon class="tile" points="39.64,61.20 69.09,78.20 69.09,112.20 39.64,129.20 10.20,112.20 10.20,78.20" aria-label="Kayes"/>
    <text class="label" x="39.64" y="95.20">KY</text>
  </g>
</svg>
