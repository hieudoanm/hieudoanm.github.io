<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 343.40" width="226.51" height="343.40" role="img" aria-labelledby="mozambique-title mozambique-desc">
  <title id="mozambique-title">Mozambique hex map</title>
  <desc id="mozambique-desc">Hexagon map with 11 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="CD">
    <title>Cabo Delgado</title>
    <polygon class="tile" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Cabo Delgado"/>
    <text class="label" x="186.87" y="44.20">CD</text>
  </g>
  <g class="state" data-state="NM">
    <title>Nampula</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Nampula"/>
    <text class="label" x="157.42" y="95.20">NM</text>
  </g>
  <g class="state" data-state="NS">
    <title>Niassa</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="Niassa"/>
    <text class="label" x="127.98" y="44.20">NS</text>
  </g>
  <g class="state" data-state="TE">
    <title>Tete</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Tete"/>
    <text class="label" x="127.98" y="146.20">TE</text>
  </g>
  <g class="state" data-state="IN">
    <title>Inhambane</title>
    <polygon class="tile" points="127.98,214.20 157.42,231.20 157.42,265.20 127.98,282.20 98.53,265.20 98.53,231.20" aria-label="Inhambane"/>
    <text class="label" x="127.98" y="248.20">IN</text>
  </g>
  <g class="state" data-state="ZA">
    <title>Zambezia</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Zambezia"/>
    <text class="label" x="98.53" y="95.20">ZA</text>
  </g>
  <g class="state" data-state="MN">
    <title>Manica</title>
    <polygon class="tile" points="98.53,163.20 127.98,180.20 127.98,214.20 98.53,231.20 69.09,214.20 69.09,180.20" aria-label="Manica"/>
    <text class="label" x="98.53" y="197.20">MN</text>
  </g>
  <g class="state" data-state="MAP">
    <title>Maputo</title>
    <polygon class="tile" points="98.53,265.20 127.98,282.20 127.98,316.20 98.53,333.20 69.09,316.20 69.09,282.20" aria-label="Maputo"/>
    <text class="label" x="98.53" y="299.20">MAP</text>
  </g>
  <g class="state" data-state="SO">
