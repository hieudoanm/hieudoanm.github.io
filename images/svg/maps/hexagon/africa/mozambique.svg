    <text class="label" x="69.09" y="248.20">GA</text>
  </g>
  <g class="state" data-state="MP">
    <title>Maputo</title>
    <polygon class="tile" points="39.64,265.20 69.09,282.20 69.09,316.20 39.64,333.20 10.20,316.20 10.20,282.20" aria-label="Maputo"/>
    <text class="label" x="39.64" y="299.20">MP</text>
