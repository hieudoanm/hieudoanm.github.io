<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 361.03 402.08" width="361.03" height="402.08" role="img" aria-labelledby="cabo-verde-title cabo-verde-desc">
  <title id="cabo-verde-title">Cabo Verde hex map</title>
  <desc id="cabo-verde-desc">Hexagon map with 22 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.12; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 10.49 7.49; }
    .label { fill: #52525b; font: 600 8.49px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
