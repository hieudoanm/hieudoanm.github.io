<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 167.62 139.40" width="167.62" height="139.40" role="img" aria-labelledby="sierra-leone-title sierra-leone-desc">
  <title id="sierra-leone-title">Sierra Leone hex map</title>
  <desc id="sierra-leone-desc">Hexagon map with 4 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="EA">
    <title>Eastern</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Eastern"/>
    <text class="label" x="127.98" y="95.20">EA</text>
  </g>
  <g class="state" data-state="NO">
    <title>Northern</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Northern"/>
    <text class="label" x="98.53" y="44.20">NO</text>
  </g>
  <g class="state" data-state="SO">
    <title>Southern</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="Southern"/>
    <text class="label" x="69.09" y="95.20">SO</text>
  </g>
  <g class="state" data-state="WE">
    <title>Western</title>
    <polygon class="tile" points="39.64,10.20 69.09,27.20 69.09,61.20 39.64,78.20 10.20,61.20 10.20,27.20" aria-label="Western"/>
    <text class="label" x="39.64" y="44.20">WE</text>
  </g>
</svg>
