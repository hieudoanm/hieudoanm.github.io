<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255.96 190.40" width="255.96" height="190.40" role="img" aria-labelledby="comoros-title comoros-desc">
  <title id="comoros-title">Comoros hex map</title>
  <desc id="comoros-desc">Hexagon map with 3 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="AND">
    <title>Andjouân</title>
    <polygon class="tile inset" points="216.31,112.20 245.76,129.20 245.76,163.20 216.31,180.20 186.87,163.20 186.87,129.20" aria-label="Andjouân"/>
    <text class="label" x="216.31" y="146.20">AND</text>
  </g>
  <g class="state" data-state="MOH">
    <title>Moûhîlî</title>
    <polygon class="tile" points="98.53,112.20 127.98,129.20 127.98,163.20 98.53,180.20 69.09,163.20 69.09,129.20" aria-label="Moûhîlî"/>
    <text class="label" x="98.53" y="146.20">MOH</text>
  </g>
  <g class="state" data-state="ANDA">
    <title>Andjazîdja</title>
    <polygon class="tile inset" points="39.64,10.20 69.09,27.20 69.09,61.20 39.64,78.20 10.20,61.20 10.20,27.20" aria-label="Andjazîdja"/>
    <text class="label" x="39.64" y="44.20">ANDA</text>
  </g>
</svg>
