<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 241.40" width="226.51" height="241.40" role="img" aria-labelledby="south-africa-title south-africa-desc">
  <title id="south-africa-title">South Africa hex map</title>
  <desc id="south-africa-desc">Hexagon map with 9 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="MP">
    <title>Mpumalanga</title>
    <polygon class="tile" points="186.87,61.20 216.31,78.20 216.31,112.20 186.87,129.20 157.42,112.20 157.42,78.20" aria-label="Mpumalanga"/>
    <text class="label" x="186.87" y="95.20">MP</text>
  </g>
  <g class="state" data-state="LP">
    <title>Limpopo</title>
    <polygon class="tile" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="Limpopo"/>
    <text class="label" x="157.42" y="44.20">LP</text>
  </g>
  <g class="state" data-state="NL">
    <title>KwaZulu-Natal</title>
    <polygon class="tile" points="157.42,112.20 186.87,129.20 186.87,163.20 157.42,180.20 127.98,163.20 127.98,129.20" aria-label="KwaZulu-Natal"/>
    <text class="label" x="157.42" y="146.20">NL</text>
  </g>
  <g class="state" data-state="GT">
    <title>Gauteng</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Gauteng"/>
    <text class="label" x="127.98" y="95.20">GT</text>
  </g>
  <g class="state" data-state="EC">
    <title>Eastern Cape</title>
    <polygon class="tile" points="127.98,163.20 157.42,180.20 157.42,214.20 127.98,231.20 98.53,214.20 98.53,180.20" aria-label="Eastern Cape"/>
    <text class="label" x="127.98" y="197.20">EC</text>
  </g>
  <g class="state" data-state="FS">
    <title>Free State</title>
    <polygon class="tile" points="98.53,112.20 127.98,129.20 127.98,163.20 98.53,180.20 69.09,163.20 69.09,129.20" aria-label="Free State"/>
    <text class="label" x="98.53" y="146.20">FS</text>
  </g>
  <g class="state" data-state="NW">
    <title>North West</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="North West"/>
    <text class="label" x="69.09" y="95.20">NW</text>
  </g>
  <g class="state" data-state="WC">
    <title>Western Cape</title>
    <polygon class="tile" points="69.09,163.20 98.53,180.20 98.53,214.20 69.09,231.20 39.64,214.20 39.64,180.20" aria-label="Western Cape"/>
    <text class="label" x="69.09" y="197.20">WC</text>
  </g>
  <g class="state" data-state="NC">
    <title>Northern Cape</title>
    <polygon class="tile" points="39.64,112.20 69.09,129.20 69.09,163.20 39.64,180.20 10.20,163.20 10.20,129.20" aria-label="Northern Cape"/>
    <text class="label" x="39.64" y="146.20">NC</text>
  </g>
</svg>
