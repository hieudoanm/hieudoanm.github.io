<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 139.40" width="226.51" height="139.40" role="img" aria-labelledby="eritrea-title eritrea-desc">
  <title id="eritrea-title">Eritrea hex map</title>
  <desc id="eritrea-desc">Hexagon map with 6 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="DK">
    <title>Debubawi Keyih Bahri</title>
    <polygon class="tile" points="186.87,61.20 216.31,78.20 216.31,112.20 186.87,129.20 157.42,112.20 157.42,78.20" aria-label="Debubawi Keyih Bahri"/>
    <text class="label" x="186.87" y="95.20">DK</text>
  </g>
  <g class="state" data-state="DU">
    <title>Debub</title>
    <polygon class="tile" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="Debub"/>
    <text class="label" x="157.42" y="44.20">DU</text>
  </g>
  <g class="state" data-state="MA">
    <title>Maekel</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Maekel"/>
    <text class="label" x="127.98" y="95.20">MA</text>
  </g>
  <g class="state" data-state="AN">
    <title>Anseba</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Anseba"/>
    <text class="label" x="98.53" y="44.20">AN</text>
  </g>
  <g class="state" data-state="GB">
    <title>Gash Barka</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="Gash Barka"/>
    <text class="label" x="69.09" y="95.20">GB</text>
  </g>
  <g class="state" data-state="SK">
    <title>Semenawi Keyih Bahri</title>
    <polygon class="tile" points="39.64,10.20 69.09,27.20 69.09,61.20 39.64,78.20 10.20,61.20 10.20,27.20" aria-label="Semenawi Keyih Bahri"/>
    <text class="label" x="39.64" y="44.20">SK</text>
  </g>
</svg>
