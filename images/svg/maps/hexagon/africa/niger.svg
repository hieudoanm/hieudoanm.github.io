<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285.40 139.40" width="285.40" height="139.40" role="img" aria-labelledby="niger-title niger-desc">
  <title id="niger-title">Niger hex map</title>
  <desc id="niger-desc">Hexagon map with 8 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="DF">
    <title>Diffa</title>
    <polygon class="tile" points="245.76,10.20 275.20,27.20 275.20,61.20 245.76,78.20 216.31,61.20 216.31,27.20" aria-label="Diffa"/>
    <text class="label" x="245.76" y="44.20">DF</text>
  </g>
  <g class="state" data-state="ZI">
    <title>Zinder</title>
    <polygon class="tile" points="216.31,61.20 245.76,78.20 245.76,112.20 216.31,129.20 186.87,112.20 186.87,78.20" aria-label="Zinder"/>
    <text class="label" x="216.31" y="95.20">ZI</text>
  </g>
  <g class="state" data-state="AG">
    <title>Agadez</title>
    <polygon class="tile" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Agadez"/>
    <text class="label" x="186.87" y="44.20">AG</text>
  </g>
  <g class="state" data-state="MA">
    <title>Maradi</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Maradi"/>
    <text class="label" x="157.42" y="95.20">MA</text>
  </g>
  <g class="state" data-state="TH">
    <title>Tahoua</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="Tahoua"/>
    <text class="label" x="127.98" y="44.20">TH</text>
  </g>
  <g class="state" data-state="DS">
    <title>Dosso</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Dosso"/>
    <text class="label" x="98.53" y="95.20">DS</text>
  </g>
  <g class="state" data-state="TL">
    <title>Tillabéri</title>
    <polygon class="tile" points="69.09,10.20 98.53,27.20 98.53,61.20 69.09,78.20 39.64,61.20 39.64,27.20" aria-label="Tillabéri"/>
    <text class="label" x="69.09" y="44.20">TL</text>
  </g>
  <g class="state" data-state="NI">
    <title>Niamey</title>
    <polygon class="tile" points="39.64,61.20 69.09,78.20 69.09,112.20 39.64,129.20 10.20,112.20 10.20,78.20" aria-label="Niamey"/>
    <text class="label" x="39.64" y="95.20">NI</text>
  </g>
</svg>
