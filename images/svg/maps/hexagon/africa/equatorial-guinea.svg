<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285.40 292.40" width="285.40" height="292.40" role="img" aria-labelledby="equatorial-guinea-title equatorial-guinea-desc">
  <title id="equatorial-guinea-title">Equatorial Guinea hex map</title>
  <desc id="equatorial-guinea-desc">Hexagon map with 7 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="WN">
    <title>Wele-Nzás</title>
    <polygon class="tile" points="245.76,163.20 275.20,180.20 275.20,214.20 245.76,231.20 216.31,214.20 216.31,180.20" aria-label="Wele-Nzás"/>
    <text class="label" x="245.76" y="197.20">WN</text>
  </g>
  <g class="state" data-state="KN">
    <title>Kié-Ntem</title>
    <polygon class="tile" points="216.31,112.20 245.76,129.20 245.76,163.20 216.31,180.20 186.87,163.20 186.87,129.20" aria-label="Kié-Ntem"/>
    <text class="label" x="216.31" y="146.20">KN</text>
  </g>
  <g class="state" data-state="CS">
    <title>Centro Sur</title>
    <polygon class="tile" points="186.87,163.20 216.31,180.20 216.31,214.20 186.87,231.20 157.42,214.20 157.42,180.20" aria-label="Centro Sur"/>
    <text class="label" x="186.87" y="197.20">CS</text>
  </g>
  <g class="state" data-state="LI">
    <title>Litoral</title>
    <polygon class="tile" points="157.42,112.20 186.87,129.20 186.87,163.20 157.42,180.20 127.98,163.20 127.98,129.20" aria-label="Litoral"/>
    <text class="label" x="157.42" y="146.20">LI</text>
  </g>
  <g class="state" data-state="BS">
    <title>Bioko Sur</title>
    <polygon class="tile inset" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Bioko Sur"/>
    <text class="label" x="98.53" y="44.20">BS</text>
  </g>
  <g class="state" data-state="AN">
    <title>Annobón</title>
    <polygon class="tile inset" points="98.53,214.20 127.98,231.20 127.98,265.20 98.53,282.20 69.09,265.20 69.09,231.20" aria-label="Annobón"/>
    <text class="label" x="98.53" y="248.20">AN</text>
  </g>
  <g class="state" data-state="BN">
    <title>Bioko Norte</title>
    <polygon class="tile inset" points="39.64,112.20 69.09,129.20 69.09,163.20 39.64,180.20 10.20,163.20 10.20,129.20" aria-label="Bioko Norte"/>
    <text class="label" x="39.64" y="146.20">BN</text>
  </g>
</svg>
