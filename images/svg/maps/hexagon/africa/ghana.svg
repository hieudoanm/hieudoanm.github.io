<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.07 241.40" width="197.07" height="241.40" role="img" aria-labelledby="ghana-title ghana-desc">
  <title id="ghana-title">Ghana hex map</title>
  <desc id="ghana-desc">Hexagon map with 10 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="UW">
    <title>Upper West</title>
    <polygon class="tile" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="Upper West"/>
    <text class="label" x="157.42" y="44.20">UW</text>
  </g>
  <g class="state" data-state="TV">
    <title>Volta</title>
    <polygon class="tile" points="157.42,112.20 186.87,129.20 186.87,163.20 157.42,180.20 127.98,163.20 127.98,129.20" aria-label="Volta"/>
    <text class="label" x="157.42" y="146.20">TV</text>
  </g>
  <g class="state" data-state="EP">
    <title>Eastern</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Eastern"/>
    <text class="label" x="127.98" y="95.20">EP</text>
  </g>
  <g class="state" data-state="AA">
    <title>Greater Accra</title>
    <polygon class="tile" points="127.98,163.20 157.42,180.20 157.42,214.20 127.98,231.20 98.53,214.20 98.53,180.20" aria-label="Greater Accra"/>
    <text class="label" x="127.98" y="197.20">AA</text>
  </g>
  <g class="state" data-state="UE">
    <title>Upper East</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Upper East"/>
    <text class="label" x="98.53" y="44.20">UE</text>
  </g>
  <g class="state" data-state="AH">
    <title>Ashanti</title>
    <polygon class="tile" points="98.53,112.20 127.98,129.20 127.98,163.20 98.53,180.20 69.09,163.20 69.09,129.20" aria-label="Ashanti"/>
    <text class="label" x="98.53" y="146.20">AH</text>
  </g>
  <g class="state" data-state="BA">
    <title>Brong Ahafo</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="Brong Ahafo"/>
    <text class="label" x="69.09" y="95.20">BA</text>
  </g>
  <g class="state" data-state="CP">
    <title>Central</title>
    <polygon class="tile" points="69.09,163.20 98.53,180.20 98.53,214.20 69.09,231.20 39.64,214.20 39.64,180.20" aria-label="Central"/>
    <text class="label" x="69.09" y="197.20">CP</text>
  </g>
  <g class="state" data-state="NP">
    <title>Northern</title>
    <polygon class="tile" points="39.64,10.20 69.09,27.20 69.09,61.20 39.64,78.20 10.20,61.20 10.20,27.20" aria-label="Northern"/>
    <text class="label" x="39.64" y="44.20">NP</text>
  </g>
  <g class="state" data-state="WP">
    <title>Western</title>
    <polygon class="tile" points="39.64,112.20 69.09,129.20 69.09,163.20 39.64,180.20 10.20,163.20 10.20,129.20" aria-label="Western"/>
    <text class="label" x="39.64" y="146.20">WP</text>
  </g>
</svg>
