<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 358.71 441.65" width="358.71" height="441.65" role="img" aria-labelledby="seychelles-title seychelles-desc">
  <title id="seychelles-title">Seychelles hex map</title>
  <desc id="seychelles-desc">Hexagon map with 26 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.57; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 12.70 9.07; }
    .label { fill: #52525b; font: 600 10.28px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
