<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285.40 241.40" width="285.40" height="241.40" role="img" aria-labelledby="senegal-title senegal-desc">
  <title id="senegal-title">Senegal hex map</title>
  <desc id="senegal-desc">Hexagon map with 14 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="TC">
    <title>Tambacounda</title>
    <polygon class="tile" points="245.76,112.20 275.20,129.20 275.20,163.20 245.76,180.20 216.31,163.20 216.31,129.20" aria-label="Tambacounda"/>
    <text class="label" x="245.76" y="146.20">TC</text>
  </g>
