<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.07 292.40" width="197.07" height="292.40" role="img" aria-labelledby="cameroon-title cameroon-desc">
  <title id="cameroon-title">Cameroon hex map</title>
  <desc id="cameroon-desc">Hexagon map with 10 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="NO">
    <title>Nord</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Nord"/>
    <text class="label" x="157.42" y="95.20">NO</text>
  </g>
  <g class="state" data-state="ES">
    <title>Est</title>
    <polygon class="tile" points="157.42,163.20 186.87,180.20 186.87,214.20 157.42,231.20 127.98,214.20 127.98,180.20" aria-label="Est"/>
    <text class="label" x="157.42" y="197.20">ES</text>
  </g>
  <g class="state" data-state="EN">
    <title>Extrême-Nord</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="Extrême-Nord"/>
    <text class="label" x="127.98" y="44.20">EN</text>
  </g>
  <g class="state" data-state="AD">
    <title>Adamaoua</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Adamaoua"/>
    <text class="label" x="127.98" y="146.20">AD</text>
  </g>
  <g class="state" data-state="SU">
    <title>Sud</title>
    <polygon class="tile" points="127.98,214.20 157.42,231.20 157.42,265.20 127.98,282.20 98.53,265.20 98.53,231.20" aria-label="Sud"/>
    <text class="label" x="127.98" y="248.20">SU</text>
  </g>
  <g class="state" data-state="NW">
    <title>Nord-Ouest</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Nord-Ouest"/>
    <text class="label" x="98.53" y="95.20">NW</text>
  </g>
  <g class="state" data-state="CE">
    <title>Centre</title>
    <polygon class="tile" points="98.53,163.20 127.98,180.20 127.98,214.20 98.53,231.20 69.09,214.20 69.09,180.20" aria-label="Centre"/>
    <text class="label" x="98.53" y="197.20">CE</text>
  </g>
  <g class="state" data-state="OU">
    <title>Ouest</title>
    <polygon class="tile" points="69.09,112.20 98.53,129.20 98.53,163.20 69.09,180.20 39.64,163.20 39.64,129.20" aria-label="Ouest"/>
    <text class="label" x="69.09" y="146.20">OU</text>
  </g>
  <g class="state" data-state="LT">
    <title>Littoral</title>
    <polygon class="tile" points="69.09,214.20 98.53,231.20 98.53,265.20 69.09,282.20 39.64,265.20 39.64,231.20" aria-label="Littoral"/>
    <text class="label" x="69.09" y="248.20">LT</text>
  </g>
  <g class="state" data-state="SW">
    <title>Sud-Ouest</title>
    <polygon class="tile" points="39.64,163.20 69.09,180.20 69.09,214.20 39.64,231.20 10.20,214.20 10.20,180.20" aria-label="Sud-Ouest"/>
    <text class="label" x="39.64" y="197.20">SW</text>
  </g>
</svg>
