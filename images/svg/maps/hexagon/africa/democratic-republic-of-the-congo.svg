    <text class="label" x="157.42" y="146.20">SK</text>
  </g>
  <g class="state" data-state="MA">
    <title>Maniema</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Maniema"/>
    <text class="label" x="127.98" y="95.20">MA</text>
  </g>
  <g class="state" data-state="KE">
