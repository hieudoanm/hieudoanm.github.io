<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 241.40" width="226.51" height="241.40" role="img" aria-labelledby="democratic-republic-of-the-congo-title democratic-republic-of-the-congo-desc">
  <title id="democratic-republic-of-the-congo-title">Democratic Republic of the Congo hex map</title>
  <desc id="democratic-republic-of-the-congo-desc">Hexagon map with 11 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="NK">
    <title>Nord-Kivu</title>
    <polygon class="tile" points="186.87,61.20 216.31,78.20 216.31,112.20 186.87,129.20 157.42,112.20 157.42,78.20" aria-label="Nord-Kivu"/>
    <text class="label" x="186.87" y="95.20">NK</text>
  </g>
  <g class="state" data-state="KA">
    <title>Katanga</title>
    <polygon class="tile" points="186.87,163.20 216.31,180.20 216.31,214.20 186.87,231.20 157.42,214.20 157.42,180.20" aria-label="Katanga"/>
    <text class="label" x="186.87" y="197.20">KA</text>
  </g>
  <g class="state" data-state="OR">
    <title>Orientale</title>
