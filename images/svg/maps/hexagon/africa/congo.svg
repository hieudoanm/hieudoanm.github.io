<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255.96 292.40" width="255.96" height="292.40" role="img" aria-labelledby="congo-title congo-desc">
  <title id="congo-title">Congo hex map</title>
  <desc id="congo-desc">Hexagon map with 12 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="LI">
    <title>Likouala</title>
    <polygon class="tile" points="216.31,10.20 245.76,27.20 245.76,61.20 216.31,78.20 186.87,61.20 186.87,27.20" aria-label="Likouala"/>
    <text class="label" x="216.31" y="44.20">LI</text>
  </g>
  <g class="state" data-state="BZV">
