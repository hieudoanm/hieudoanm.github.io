<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 167.62 241.40" width="167.62" height="241.40" role="img" aria-labelledby="belize-title belize-desc">
  <title id="belize-title">Belize hex map</title>
  <desc id="belize-desc">Hexagon map with 6 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="BZ">
    <title>Belize</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="Belize"/>
    <text class="label" x="127.98" y="95.20">BZ</text>
  </g>
  <g class="state" data-state="CZL">
    <title>Corozal</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Corozal"/>
    <text class="label" x="98.53" y="44.20">CZL</text>
  </g>
  <g class="state" data-state="SC">
    <title>Stann Creek</title>
    <polygon class="tile" points="98.53,112.20 127.98,129.20 127.98,163.20 98.53,180.20 69.09,163.20 69.09,129.20" aria-label="Stann Creek"/>
    <text class="label" x="98.53" y="146.20">SC</text>
  </g>
  <g class="state" data-state="OW">
    <title>Orange Walk</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="Orange Walk"/>
    <text class="label" x="69.09" y="95.20">OW</text>
  </g>
  <g class="state" data-state="TOL">
    <title>Toledo</title>
    <polygon class="tile" points="69.09,163.20 98.53,180.20 98.53,214.20 69.09,231.20 39.64,214.20 39.64,180.20" aria-label="Toledo"/>
    <text class="label" x="69.09" y="197.20">TOL</text>
  </g>
  <g class="state" data-state="CY">
    <title>Cayo</title>
    <polygon class="tile" points="39.64,112.20 69.09,129.20 69.09,163.20 39.64,180.20 10.20,163.20 10.20,129.20" aria-label="Cayo"/>
    <text class="label" x="39.64" y="146.20">CY</text>
  </g>
</svg>
