<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362.66 150.98" width="362.66" height="150.98" role="img" aria-labelledby="cuba-title cuba-desc">
  <title id="cuba-title">Cuba hex map</title>
  <desc id="cuba-desc">Hexagon map with 16 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 1.81; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 8.93 6.38; }
    .label { fill: #52525b; font: 600 7.23px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="GU">
    <title>Guantánamo</title>
    <polygon class="tile" points="337.86,102.07 356.28,112.70 356.28,133.97 337.86,144.60 319.45,133.97 319.45,112.70" aria-label="Guantánamo"/>
    <text class="label" x="337.86" y="123.34">GU</text>
  </g>
  <g class="state" data-state="HO">
    <title>Holguín</title>
