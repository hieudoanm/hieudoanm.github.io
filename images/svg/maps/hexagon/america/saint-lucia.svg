    <text class="label" x="127.98" y="146.20">PRA</text>
  </g>
  <g class="state" data-state="LAB">
    <title>Laborie</title>
    <polygon class="tile" points="127.98,214.20 157.42,231.20 157.42,265.20 127.98,282.20 98.53,265.20 98.53,231.20" aria-label="Laborie"/>
    <text class="label" x="127.98" y="248.20">LAB</text>
  </g>
  <g class="state" data-state="CAS">
