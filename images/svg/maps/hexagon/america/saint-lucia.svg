<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.07 292.40" width="197.07" height="292.40" role="img" aria-labelledby="saint-lucia-title saint-lucia-desc">
  <title id="saint-lucia-title">Saint Lucia hex map</title>
  <desc id="saint-lucia-desc">Hexagon map with 11 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="DEN">
    <title>Dennery</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Dennery"/>
    <text class="label" x="157.42" y="95.20">DEN</text>
  </g>
  <g class="state" data-state="MIC">
    <title>Micoud</title>
