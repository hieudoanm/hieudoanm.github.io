<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255.96 292.40" width="255.96" height="292.40" role="img" aria-labelledby="grenada-title grenada-desc">
  <title id="grenada-title">Grenada hex map</title>
  <desc id="grenada-desc">Hexagon map with 7 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="CAPM">
    <title>Carriacou and Petite Martinique</title>
    <polygon class="tile inset" points="216.31,10.20 245.76,27.20 245.76,61.20 216.31,78.20 186.87,61.20 186.87,27.20" aria-label="Carriacou and Petite Martinique"/>
    <text class="label" x="216.31" y="44.20">CAPM</text>
  </g>
  <g class="state" data-state="SP">
    <title>Saint Patrick</title>
    <polygon class="tile" points="157.42,112.20 186.87,129.20 186.87,163.20 157.42,180.20 127.98,163.20 127.98,129.20" aria-label="Saint Patrick"/>
    <text class="label" x="157.42" y="146.20">SP</text>
  </g>
  <g class="state" data-state="SA">
    <title>Saint Andrew</title>
    <polygon class="tile" points="127.98,163.20 157.42,180.20 157.42,214.20 127.98,231.20 98.53,214.20 98.53,180.20" aria-label="Saint Andrew"/>
    <text class="label" x="127.98" y="197.20">SA</text>
  </g>
  <g class="state" data-state="SM">
    <title>Saint Mark</title>
    <polygon class="tile" points="98.53,112.20 127.98,129.20 127.98,163.20 98.53,180.20 69.09,163.20 69.09,129.20" aria-label="Saint Mark"/>
    <text class="label" x="98.53" y="146.20">SM</text>
  </g>
  <g class="state" data-state="SD">
    <title>Saint David</title>
    <polygon class="tile" points="98.53,214.20 127.98,231.20 127.98,265.20 98.53,282.20 69.09,265.20 69.09,231.20" aria-label="Saint David"/>
    <text class="label" x="98.53" y="248.20">SD</text>
  </g>
  <g class="state" data-state="SJ">
    <title>Saint John</title>
    <polygon class="tile" points="69.09,163.20 98.53,180.20 98.53,214.20 69.09,231.20 39.64,214.20 39.64,180.20" aria-label="Saint John"/>
    <text class="label" x="69.09" y="197.20">SJ</text>
  </g>
  <g class="state" data-state="SG">
    <title>Saint George</title>
    <polygon class="tile" points="39.64,214.20 69.09,231.20 69.09,265.20 39.64,282.20 10.20,265.20 10.20,231.20" aria-label="Saint George"/>
    <text class="label" x="39.64" y="248.20">SG</text>
  </g>
</svg>
