<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 241.40" width="226.51" height="241.40" role="img" aria-labelledby="haiti-title haiti-desc">
  <title id="haiti-title">Haiti hex map</title>
  <desc id="haiti-desc">Hexagon map with 10 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="NE">
    <title>Nord-Est</title>
    <polygon class="tile" points="186.87,61.20 216.31,78.20 216.31,112.20 186.87,129.20 157.42,112.20 157.42,78.20" aria-label="Nord-Est"/>
    <text class="label" x="186.87" y="95.20">NE</text>
  </g>
  <g class="state" data-state="ND">
    <title>Nord</title>
    <polygon class="tile" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="Nord"/>
    <text class="label" x="157.42" y="44.20">ND</text>
  </g>
  <g class="state" data-state="CE">
    <title>Centre</title>
    <polygon class="tile" points="157.42,112.20 186.87,129.20 186.87,163.20 157.42,180.20 127.98,163.20 127.98,129.20" aria-label="Centre"/>
    <text class="label" x="157.42" y="146.20">CE</text>
  </g>
  <g class="state" data-state="AR">
    <title>L'Artibonite</title>
    <polygon class="tile" points="127.98,61.20 157.42,78.20 157.42,112.20 127.98,129.20 98.53,112.20 98.53,78.20" aria-label="L'Artibonite"/>
    <text class="label" x="127.98" y="95.20">AR</text>
  </g>
  <g class="state" data-state="SE">
    <title>Sud-Est</title>
    <polygon class="tile" points="127.98,163.20 157.42,180.20 157.42,214.20 127.98,231.20 98.53,214.20 98.53,180.20" aria-label="Sud-Est"/>
    <text class="label" x="127.98" y="197.20">SE</text>
  </g>
  <g class="state" data-state="NO">
    <title>Nord-Ouest</title>
    <polygon class="tile" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Nord-Ouest"/>
    <text class="label" x="98.53" y="44.20">NO</text>
  </g>
  <g class="state" data-state="OU">
    <title>Ouest</title>
    <polygon class="tile" points="98.53,112.20 127.98,129.20 127.98,163.20 98.53,180.20 69.09,163.20 69.09,129.20" aria-label="Ouest"/>
    <text class="label" x="98.53" y="146.20">OU</text>
  </g>
  <g class="state" data-state="NI">
    <title>Nippes</title>
    <polygon class="tile" points="69.09,61.20 98.53,78.20 98.53,112.20 69.09,129.20 39.64,112.20 39.64,78.20" aria-label="Nippes"/>
    <text class="label" x="69.09" y="95.20">NI</text>
  </g>
  <g class="state" data-state="SD">
    <title>Sud</title>
    <polygon class="tile" points="69.09,163.20 98.53,180.20 98.53,214.20 69.09,231.20 39.64,214.20 39.64,180.20" aria-label="Sud"/>
    <text class="label" x="69.09" y="197.20">SD</text>
  </g>
  <g class="state" data-state="GA">
    <title>Grand'Anse</title>
    <polygon class="tile" points="39.64,112.20 69.09,129.20 69.09,163.20 39.64,180.20 10.20,163.20 10.20,129.20" aria-label="Grand'Anse"/>
    <text class="label" x="39.64" y="146.20">GA</text>
  </g>
</svg>
