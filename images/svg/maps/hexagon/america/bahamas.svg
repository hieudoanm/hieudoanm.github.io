  <title id="bahamas-title">Bahamas hex map</title>
  <desc id="bahamas-desc">Hexagon map with 30 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 1.57; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 7.78 5.55; }
    .label { fill: #52525b; font: 600 6.30px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
