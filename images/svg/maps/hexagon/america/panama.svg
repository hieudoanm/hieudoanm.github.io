<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314.85 190.40" width="314.85" height="190.40" role="img" aria-labelledby="panama-title panama-desc">
  <title id="panama-title">Panama hex map</title>
  <desc id="panama-desc">Hexagon map with 12 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="EM">
    <title>Emberá</title>
    <polygon class="tile" points="275.20,61.20 304.65,78.20 304.65,112.20 275.20,129.20 245.76,112.20 245.76,78.20" aria-label="Emberá"/>
    <text class="label" x="275.20" y="95.20">EM</text>
  </g>
  <g class="state" data-state="KY">
    <title>Kuna Yala</title>
    <polygon class="tile" points="245.76,10.20 275.20,27.20 275.20,61.20 245.76,78.20 216.31,61.20 216.31,27.20" aria-label="Kuna Yala"/>
    <text class="label" x="245.76" y="44.20">KY</text>
  </g>
  <g class="state" data-state="DR">
    <title>Darién</title>
    <polygon class="tile" points="245.76,112.20 275.20,129.20 275.20,163.20 245.76,180.20 216.31,163.20 216.31,129.20" aria-label="Darién"/>
    <text class="label" x="245.76" y="146.20">DR</text>
  </g>
  <g class="state" data-state="SB">
    <title>Panama</title>
    <polygon class="tile" points="216.31,61.20 245.76,78.20 245.76,112.20 216.31,129.20 186.87,112.20 186.87,78.20" aria-label="Panama"/>
    <text class="label" x="216.31" y="95.20">SB</text>
  </g>
  <g class="state" data-state="CL">
    <title>Colón</title>
    <polygon class="tile" points="186.87,10.20 216.31,27.20 216.31,61.20 186.87,78.20 157.42,61.20 157.42,27.20" aria-label="Colón"/>
    <text class="label" x="186.87" y="44.20">CL</text>
  </g>
  <g class="state" data-state="LS">
    <title>Los Santos</title>
    <polygon class="tile" points="186.87,112.20 216.31,129.20 216.31,163.20 186.87,180.20 157.42,163.20 157.42,129.20" aria-label="Los Santos"/>
    <text class="label" x="186.87" y="146.20">LS</text>
  </g>
  <g class="state" data-state="CC">
    <title>Coclé</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="Coclé"/>
    <text class="label" x="157.42" y="95.20">CC</text>
  </g>
  <g class="state" data-state="NB">
    <title>Ngöbe Buglé</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="Ngöbe Buglé"/>
    <text class="label" x="127.98" y="44.20">NB</text>
  </g>
  <g class="state" data-state="HE">
