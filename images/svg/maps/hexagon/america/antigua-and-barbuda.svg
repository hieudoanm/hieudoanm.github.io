<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314.85 292.40" width="314.85" height="292.40" role="img" aria-labelledby="antigua-and-barbuda-title antigua-and-barbuda-desc">
  <title id="antigua-and-barbuda-title">Antigua and Barbuda hex map</title>
  <desc id="antigua-and-barbuda-desc">Hexagon map with 8 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="SPA">
    <title>Saint Philip</title>
    <polygon class="tile" points="275.20,214.20 304.65,231.20 304.65,265.20 275.20,282.20 245.76,265.20 245.76,231.20" aria-label="Saint Philip"/>
    <text class="label" x="275.20" y="248.20">SPA</text>
  </g>
  <g class="state" data-state="SPB">
    <title>Saint Peter</title>
    <polygon class="tile" points="245.76,163.20 275.20,180.20 275.20,214.20 245.76,231.20 216.31,214.20 216.31,180.20" aria-label="Saint Peter"/>
    <text class="label" x="245.76" y="197.20">SPB</text>
  </g>
  <g class="state" data-state="SG">
    <title>Saint George</title>
    <polygon class="tile" points="216.31,112.20 245.76,129.20 245.76,163.20 216.31,180.20 186.87,163.20 186.87,129.20" aria-label="Saint George"/>
    <text class="label" x="216.31" y="146.20">SG</text>
  </g>
  <g class="state" data-state="SP">
    <title>Saint Paul</title>
    <polygon class="tile" points="216.31,214.20 245.76,231.20 245.76,265.20 216.31,282.20 186.87,265.20 186.87,231.20" aria-label="Saint Paul"/>
    <text class="label" x="216.31" y="248.20">SP</text>
  </g>
  <g class="state" data-state="BAR">
    <title>Barbuda</title>
    <polygon class="tile inset" points="216.31,10.20 245.76,27.20 245.76,61.20 216.31,78.20 186.87,61.20 186.87,27.20" aria-label="Barbuda"/>
    <text class="label" x="216.31" y="44.20">BAR</text>
  </g>
  <g class="state" data-state="SJ">
    <title>Saint John</title>
    <polygon class="tile" points="186.87,163.20 216.31,180.20 216.31,214.20 186.87,231.20 157.42,214.20 157.42,180.20" aria-label="Saint John"/>
    <text class="label" x="186.87" y="197.20">SJ</text>
  </g>
  <g class="state" data-state="SM">
    <title>Saint Mary</title>
    <polygon class="tile" points="157.42,214.20 186.87,231.20 186.87,265.20 157.42,282.20 127.98,265.20 127.98,231.20" aria-label="Saint Mary"/>
    <text class="label" x="157.42" y="248.20">SM</text>
  </g>
  <g class="state" data-state="RED">
    <title>Redonda</title>
    <polygon class="tile inset" points="39.64,214.20 69.09,231.20 69.09,265.20 39.64,282.20 10.20,265.20 10.20,231.20" aria-label="Redonda"/>
    <text class="label" x="39.64" y="248.20">RED</text>
  </g>
</svg>
