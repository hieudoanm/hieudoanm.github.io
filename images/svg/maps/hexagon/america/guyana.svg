<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 241.40" width="226.51" height="241.40" role="img" aria-labelledby="guyana-title guyana-desc">
  <title id="guyana-title">Guyana hex map</title>
  <desc id="guyana-desc">Hexagon map with 10 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="ES">
    <title>Essequibo Islands-West Demerara</title>
    <polygon class="tile" points="186.87,112.20 216.31,129.20 216.31,163.20 186.87,180.20 157.42,163.20 157.42,129.20" aria-label="Essequibo Islands-West Demerara"/>
    <text class="label" x="186.87" y="146.20">ES</text>
  </g>
  <g class="state" data-state="EB">
    <title>East Berbice-Corentyne</title>
    <polygon class="tile" points="157.42,61.20 186.87,78.20 186.87,112.20 157.42,129.20 127.98,112.20 127.98,78.20" aria-label="East Berbice-Corentyne"/>
    <text class="label" x="157.42" y="95.20">EB</text>
  </g>
  <g class="state" data-state="MA">
    <title>Mahaica-Berbice</title>
    <polygon class="tile" points="157.42,163.20 186.87,180.20 186.87,214.20 157.42,231.20 127.98,214.20 127.98,180.20" aria-label="Mahaica-Berbice"/>
    <text class="label" x="157.42" y="197.20">MA</text>
  </g>
  <g class="state" data-state="CU">
    <title>Cuyuni-Mazaruni</title>
    <polygon class="tile" points="127.98,10.20 157.42,27.20 157.42,61.20 127.98,78.20 98.53,61.20 98.53,27.20" aria-label="Cuyuni-Mazaruni"/>
    <text class="label" x="127.98" y="44.20">CU</text>
  </g>
  <g class="state" data-state="UT">
    <title>Upper Takutu-Upper Essequibo</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Upper Takutu-Upper Essequibo"/>
    <text class="label" x="127.98" y="146.20">UT</text>
  </g>
  <g class="state" data-state="DE">
    <title>Demerara-Mahaica</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Demerara-Mahaica"/>
    <text class="label" x="98.53" y="95.20">DE</text>
  </g>
  <g class="state" data-state="UD">
    <title>Upper Demerara-Berbice</title>
    <polygon class="tile" points="98.53,163.20 127.98,180.20 127.98,214.20 98.53,231.20 69.09,214.20 69.09,180.20" aria-label="Upper Demerara-Berbice"/>
    <text class="label" x="98.53" y="197.20">UD</text>
  </g>
  <g class="state" data-state="BA">
    <title>Barima-Waini</title>
    <polygon class="tile" points="69.09,10.20 98.53,27.20 98.53,61.20 69.09,78.20 39.64,61.20 39.64,27.20" aria-label="Barima-Waini"/>
    <text class="label" x="69.09" y="44.20">BA</text>
  </g>
  <g class="state" data-state="PT">
    <title>Potaro-Siparuni</title>
    <polygon class="tile" points="69.09,112.20 98.53,129.20 98.53,163.20 69.09,180.20 39.64,163.20 39.64,129.20" aria-label="Potaro-Siparuni"/>
    <text class="label" x="69.09" y="146.20">PT</text>
  </g>
  <g class="state" data-state="PM">
    <title>Pomeroon-Supenaam</title>
    <polygon class="tile" points="39.64,61.20 69.09,78.20 69.09,112.20 39.64,129.20 10.20,112.20 10.20,78.20" aria-label="Pomeroon-Supenaam"/>
    <text class="label" x="39.64" y="95.20">PM</text>
  </g>
</svg>
