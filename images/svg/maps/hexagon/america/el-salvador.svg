<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344.29 241.40" width="344.29" height="241.40" role="img" aria-labelledby="el-salvador-title el-salvador-desc">
  <title id="el-salvador-title">El Salvador hex map</title>
  <desc id="el-salvador-desc">Hexagon map with 14 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="UN">
    <title>La Unión</title>
    <polygon class="tile" points="304.65,112.20 334.09,129.20 334.09,163.20 304.65,180.20 275.20,163.20 275.20,129.20" aria-label="La Unión"/>
    <text class="label" x="304.65" y="146.20">UN</text>
  </g>
  <g class="state" data-state="MO">
    <title>Morazán</title>
    <polygon class="tile" points="275.20,61.20 304.65,78.20 304.65,112.20 275.20,129.20 245.76,112.20 245.76,78.20" aria-label="Morazán"/>
    <text class="label" x="275.20" y="95.20">MO</text>
  </g>
  <g class="state" data-state="SM">
