<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344.29 292.40" width="344.29" height="292.40" role="img" aria-labelledby="canada-title canada-desc">
  <title id="canada-title">Canada hex map</title>
  <desc id="canada-desc">Hexagon map with 13 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="PE">
    <title>Prince Edward Island</title>
    <polygon class="tile inset" points="304.65,214.20 334.09,231.20 334.09,265.20 304.65,282.20 275.20,265.20 275.20,231.20" aria-label="Prince Edward Island"/>
    <text class="label" x="304.65" y="248.20">PE</text>
  </g>
  <g class="state" data-state="NS">
    <title>Nova Scotia</title>
    <polygon class="tile" points="245.76,112.20 275.20,129.20 275.20,163.20 245.76,180.20 216.31,163.20 216.31,129.20" aria-label="Nova Scotia"/>
    <text class="label" x="245.76" y="146.20">NS</text>
  </g>
  <g class="state" data-state="QC">
    <title>Québec</title>
