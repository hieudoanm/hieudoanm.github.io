<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.07 343.40" width="197.07" height="343.40" role="img" aria-labelledby="dominica-title dominica-desc">
  <title id="dominica-title">Dominica hex map</title>
  <desc id="dominica-desc">Hexagon map with 10 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="GO">
    <title>Saint George</title>
    <polygon class="tile" points="157.42,163.20 186.87,180.20 186.87,214.20 157.42,231.20 127.98,214.20 127.98,180.20" aria-label="Saint George"/>
    <text class="label" x="157.42" y="197.20">GO</text>
  </g>
  <g class="state" data-state="DA">
    <title>Saint David</title>
    <polygon class="tile" points="127.98,112.20 157.42,129.20 157.42,163.20 127.98,180.20 98.53,163.20 98.53,129.20" aria-label="Saint David"/>
    <text class="label" x="127.98" y="146.20">DA</text>
  </g>
  <g class="state" data-state="PK">
    <title>Saint Patrick</title>
    <polygon class="tile" points="127.98,214.20 157.42,231.20 157.42,265.20 127.98,282.20 98.53,265.20 98.53,231.20" aria-label="Saint Patrick"/>
    <text class="label" x="127.98" y="248.20">PK</text>
  </g>
  <g class="state" data-state="AN">
    <title>Saint Andrew</title>
    <polygon class="tile" points="98.53,61.20 127.98,78.20 127.98,112.20 98.53,129.20 69.09,112.20 69.09,78.20" aria-label="Saint Andrew"/>
    <text class="label" x="98.53" y="95.20">AN</text>
  </g>
  <g class="state" data-state="PL">
    <title>Saint Paul</title>
    <polygon class="tile" points="98.53,163.20 127.98,180.20 127.98,214.20 98.53,231.20 69.09,214.20 69.09,180.20" aria-label="Saint Paul"/>
    <text class="label" x="98.53" y="197.20">PL</text>
  </g>
  <g class="state" data-state="MA">
    <title>Saint Mark</title>
    <polygon class="tile" points="98.53,265.20 127.98,282.20 127.98,316.20 98.53,333.20 69.09,316.20 69.09,282.20" aria-label="Saint Mark"/>
    <text class="label" x="98.53" y="299.20">MA</text>
  </g>
  <g class="state" data-state="JN">
    <title>Saint John</title>
    <polygon class="tile" points="69.09,10.20 98.53,27.20 98.53,61.20 69.09,78.20 39.64,61.20 39.64,27.20" aria-label="Saint John"/>
    <text class="label" x="69.09" y="44.20">JN</text>
  </g>
  <g class="state" data-state="JH">
    <title>Saint Joseph</title>
    <polygon class="tile" points="69.09,112.20 98.53,129.20 98.53,163.20 69.09,180.20 39.64,163.20 39.64,129.20" aria-label="Saint Joseph"/>
    <text class="label" x="69.09" y="146.20">JH</text>
  </g>
  <g class="state" data-state="LU">
    <title>Saint Luke</title>
    <polygon class="tile" points="69.09,214.20 98.53,231.20 98.53,265.20 69.09,282.20 39.64,265.20 39.64,231.20" aria-label="Saint Luke"/>
