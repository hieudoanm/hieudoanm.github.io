<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 357.71 182.23" width="357.71" height="182.23" role="img" aria-labelledby="jamaica-title jamaica-desc">
  <title id="jamaica-title">Jamaica hex map</title>
  <desc id="jamaica-desc">Hexagon map with 14 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.77; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 13.67 9.76; }
    .label { fill: #52525b; font: 600 11.06px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
