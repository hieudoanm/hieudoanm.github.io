<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226.51 292.40" width="226.51" height="292.40" role="img" aria-labelledby="barbados-title barbados-desc">
  <title id="barbados-title">Barbados hex map</title>
  <desc id="barbados-desc">Hexagon map with 11 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="PH">
    <title>Saint Philip</title>
    <polygon class="tile" points="186.87,163.20 216.31,180.20 216.31,214.20 186.87,231.20 157.42,214.20 157.42,180.20" aria-label="Saint Philip"/>
    <text class="label" x="186.87" y="197.20">PH</text>
  </g>
  <g class="state" data-state="JN">
