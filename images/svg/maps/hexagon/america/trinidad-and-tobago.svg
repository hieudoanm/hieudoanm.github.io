<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344.29 394.40" width="344.29" height="394.40" role="img" aria-labelledby="trinidad-and-tobago-title trinidad-and-tobago-desc">
  <title id="trinidad-and-tobago-title">Trinidad and Tobago hex map</title>
  <desc id="trinidad-and-tobago-desc">Hexagon map with 16 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="WTO">
    <title>Western Tobago</title>
    <polygon class="tile inset" points="304.65,61.20 334.09,78.20 334.09,112.20 304.65,129.20 275.20,112.20 275.20,78.20" aria-label="Western Tobago"/>
    <text class="label" x="304.65" y="95.20">WTO</text>
  </g>
  <g class="state" data-state="SGE">
