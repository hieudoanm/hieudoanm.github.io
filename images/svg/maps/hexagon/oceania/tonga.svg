<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255.96 292.40" width="255.96" height="292.40" role="img" aria-labelledby="tonga-title tonga-desc">
  <title id="tonga-title">Tonga hex map</title>
  <desc id="tonga-desc">Hexagon map with 5 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="TON">
    <title>Tongatapu</title>
    <polygon class="tile inset" points="216.31,214.20 245.76,231.20 245.76,265.20 216.31,282.20 186.87,265.20 186.87,231.20" aria-label="Tongatapu"/>
    <text class="label" x="216.31" y="248.20">TON</text>
  </g>
  <g class="state" data-state="VAV">
    <title>Vava'u</title>
    <polygon class="tile" points="157.42,112.20 186.87,129.20 186.87,163.20 157.42,180.20 127.98,163.20 127.98,129.20" aria-label="Vava'u"/>
    <text class="label" x="157.42" y="146.20">VAV</text>
  </g>
  <g class="state" data-state="HAA">
    <title>Ha'apai</title>
    <polygon class="tile inset" points="98.53,214.20 127.98,231.20 127.98,265.20 98.53,282.20 69.09,265.20 69.09,231.20" aria-label="Ha'apai"/>
    <text class="label" x="98.53" y="248.20">HAA</text>
  </g>
  <g class="state" data-state="NI">
    <title>Niuas</title>
    <polygon class="tile inset" points="98.53,10.20 127.98,27.20 127.98,61.20 98.53,78.20 69.09,61.20 69.09,27.20" aria-label="Niuas"/>
    <text class="label" x="98.53" y="44.20">NI</text>
  </g>
  <g class="state" data-state="EU">
    <title>Eua</title>
    <polygon class="tile inset" points="39.64,112.20 69.09,129.20 69.09,163.20 39.64,180.20 10.20,163.20 10.20,129.20" aria-label="Eua"/>
    <text class="label" x="39.64" y="146.20">EU</text>
  </g>
</svg>
