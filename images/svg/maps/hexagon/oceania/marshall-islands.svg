<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 197.07 88.40" width="197.07" height="88.40" role="img" aria-labelledby="marshall-islands-title marshall-islands-desc">
  <title id="marshall-islands-title">Marshall Islands hex map</title>
  <desc id="marshall-islands-desc">Hexagon map with 2 first-level administrative divisions, one hexagon each. Regions that border each other share an edge.</desc>
  <style>
    .tile { fill: #fff; stroke: #1b1b1f; stroke-width: 2.89; stroke-linejoin: round; transition: fill .15s; }
    .tile.inset { stroke-dasharray: 14.28 10.20; }
    .label { fill: #52525b; font: 600 11.56px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .state:hover .tile { fill: #2563eb; }
    .state:hover .label { fill: #fff; }
  </style>
  <g class="state" data-state="RCA">
    <title>Ratak Chain</title>
    <polygon class="tile inset" points="157.42,10.20 186.87,27.20 186.87,61.20 157.42,78.20 127.98,61.20 127.98,27.20" aria-label="Ratak Chain"/>
    <text class="label" x="157.42" y="44.20">RCA</text>
  </g>
  <g class="state" data-state="RC">
    <title>Railik Chain</title>
    <polygon class="tile" points="39.64,10.20 69.09,27.20 69.09,61.20 39.64,78.20 10.20,61.20 10.20,27.20" aria-label="Railik Chain"/>
    <text class="label" x="39.64" y="44.20">RC</text>
  </g>
</svg>
